#
# ameesh — weight of the PARENT of the guest slice on a lending host (lot
# L159g). systemd nests `ameesh-guest.slice` under `ameesh.slice` (a dash
# in a slice name is a level), so the guest's own `CPUWeight`/`IOWeight` only
# share `ameesh.slice` among its children (`ameesh-agents.slice` if any).
# Against the application of the host (`system.slice`, `user.slice`), what
# counts is the weight of `ameesh.slice`: it is set low here, so the whole of
# ameesh yields, as the measure already counts it (`resources.GUEST_SLICES`).
# Installed by the owner, as root, with the guest slice:
#
#   install -D -m 0644 guest-weight.conf /etc/systemd/system/ameesh.slice.d/guest-weight.conf
#   systemctl daemon-reload

[Slice]
CPUWeight=10
IOWeight=10
