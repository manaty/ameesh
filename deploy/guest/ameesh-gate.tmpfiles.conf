#
# ameesh — directories of the gate of a lending host (study L159 §1.5, lot
# L159g), recreated at each boot. The guard (root) writes the state, the
# guest only reads it; the guest writes its acknowledgement. Installed by
# install-pilot.sh as /etc/tmpfiles.d/ameesh-gate.conf.
d /run/ameesh-gate        0755 root         root         -
d /run/ameesh-gate/state  0755 root         root         -
d /run/ameesh-gate/ack    0750 ameesh-guest ameesh-guest -
