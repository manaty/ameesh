# SPDX-License-Identifier: AGPL-3.0-only
# FORME des Secret attendus par statefulset.yaml — JAMAIS rempli ici, jamais
# appliqué tel quel, et volontairement absent de kustomization.yaml.
#
# Créez-les hors de tout dépôt, par exemple :
#
#   kubectl create secret generic ameesh-db --from-literal=password='…'
#   kubectl create secret generic ameesh-harness --from-env-file=harness.env   # fichier 0600, hors dépôt
#   kubectl create secret generic ameesh-canon-deploy-key \
#       --from-file=ssh-privatekey=./canon_deploy_key \
#       --from-file=known_hosts=./known_hosts
#
# ou par votre gestionnaire de secrets (External Secrets, Sealed Secrets,
# SOPS…). Les valeurs vides ci-dessous ne sont que des noms de clés.
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-db
type: Opaque
stringData:
  # mot de passe du rôle Postgres de l'exécuteur (PGPASSWORD) ; le DSN, lui,
  # est dans config.json sans mot de passe
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-harness
type: Opaque
stringData:
  # Seule la clé du harnais déployé est utile ; toutes deviennent des
  # variables d'environnement du harnais (envFrom). Clés d'API facturées à
  # l'usage : le plafond horaire d'ameesh (AMEESH_BUDGET_USD_PER_HOUR) et
  # celui du fournisseur s'appliquent. Un abonnement (connexion interactive)
  # sur un serveur partagé est à vérifier contre les conditions du
  # fournisseur : voir docs/profils/cluster.md.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-canon-deploy-key
type: Opaque
stringData:
  # clé de déploiement EN LECTURE SEULE sur le dépôt du canon (jamais en
  # écriture : ameesh ne fait que lire le canon ; les propositions passent par
  # PR, avec les identifiants de l'agent, pas ceux-ci)
  ssh-privatekey: ""
  # empreinte(s) du serveur git (ssh-keyscan vérifié hors bande)
  known_hosts: ""
