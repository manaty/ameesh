# SPDX-License-Identifier: AGPL-3.0-only
# #7695 (P2 de #7633) : exemple de chart d'un hôte pod PARTAGÉ à N tenants.
#
# Ce fichier est la source du chart rendu dans `rendered/` par `render.py`.
# `ameesh host tenant add human:<id> --host <hôte> --pod` donne le plan d'un
# tenant (UID, conteneur, PVC, entrée passwd) ; recopier ici le tenant et son
# UID éventuel, puis `./render.py --write` et relire le diff.
#
# Aucun secret ici : le mot de passe de la base est dans le Secret `ameesh-db`,
# les clés d'API d'organisation dans un Secret par tenant
# (`ameesh-harness-<slug>`), la clé de déploiement du canon dans
# `ameesh-canon-deploy-key` (voir secrets.exemple.yaml). Les comptes ne portent
# que des NOMS de profil ; les identifiants vivent sur le PVC du tenant.
host: pod-alice-exemple
namespace: ameesh
statefulset: ameesh-pod-alice
image: ameesh-runner
image_pull_policy: IfNotPresent
schema: public
project: exemple
dsn: postgresql://ameesh@ameesh-postgres:5432/ameesh?sslmode=require
canon:
  url: git@git.example.invalid:exemple/canon.git
  branch: main
  fetch_interval: 300
supervisor:
  lease_ttl: 120
  poll: 5
tenant_defaults:
  lease_ttl: 120
  poll: 5
  canon_sync_interval: 0
  storage_size: 20Gi
  # Profils publiés au battement (`harnais/compte`, noms seulement). Le carton
  # reste en `api-key` jusqu'à la tranche P3 (Q2 bis) : aucune clé n'est
  # écrite ici, et un profil sans identifiant sur le PVC n'est jamais choisi.
  accounts:
    claude:
      - name: primaire
    codex:
      - name: primaire
tenants:
  - tenant: human:alice
  - tenant: human:bruno
