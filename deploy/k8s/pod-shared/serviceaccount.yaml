# #7695 (design 7633 §6.1) : le pod partagé n'a AUCUN geste Kubernetes.
#
# Le jeton de compte de service n'est jamais monté (`automountServiceAccountToken:
# false` au niveau du pod) ; le compte de service n'existe que pour nommer le
# pod et permettre une politique RBAC qui le refuse explicitement. Aucun Role,
# aucun RoleBinding vers ce pod : `pods/exec` sur le pod partagé est interdit
# (design 7633 §7.3). La connexion du siège (P3) passe par un pod dédié.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ameesh-pod
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
automountServiceAccountToken: false
