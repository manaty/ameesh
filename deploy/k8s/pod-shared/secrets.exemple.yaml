# SPDX-License-Identifier: AGPL-3.0-only
# #7695 : forme des Secret attendus par le chart d'un hôte pod PARTAGÉ — jamais
# rempli ici, jamais appliqué tel quel, volontairement absent de
# kustomization.yaml.
#
# Créez-les hors de tout dépôt, par exemple :
#
#   kubectl create secret generic ameesh-db --from-literal=password='…'
#   for t in alice bruno; do
#     kubectl create secret generic "ameesh-harness-$t" --from-env-file="$t.env"  # 0600
#   done
#   kubectl create secret generic ameesh-canon-deploy-key \
#       --from-file=ssh-privatekey=./canon_deploy_key \
#       --from-file=known_hosts=./known_hosts
#
# ou par votre gestionnaire de secrets (External Secrets, Sealed Secrets,
# SOPS…). Les valeurs vides ci-dessous ne sont que des noms de clés.
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-db
type: Opaque
stringData:
  # mot de passe du rôle Postgres de l'exécuteur (PGPASSWORD) ; le DSN, lui,
  # est dans les ConfigMap sans mot de passe.
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-harness-alice
type: Opaque
stringData:
  # Clés d'API d'ORGANISATION du tenant alice (mode `api-key`, seule carte
  # admise tant que P3 n'a pas rouvert Q2 bis). Un Secret PAR TENANT : il
  # n'est monté que dans le conteneur de ce tenant (`envFrom`), jamais dans
  # le superviseur ni dans un autre conteneur. Aucun abonnement ici.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-harness-bruno
type: Opaque
stringData:
  # même forme pour chaque tenant supplémentaire ; le nom est
  # `ameesh-harness-<slug>` (ou `secret:` du tenant dans host.exemple.yaml).
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-canon-deploy-key
type: Opaque
stringData:
  # clé de déploiement EN LECTURE SEULE sur le dépôt du canon (jamais en
  # écriture) ; montée dans l'init `canon` et `canon-fetch` seulement, jamais
  # dans un conteneur de tenant.
  ssh-privatekey: ""
  # empreinte(s) du serveur git (ssh-keyscan vérifié hors bande)
  known_hosts: ""
