# GÉNÉRÉ par deploy/k8s/pod-shared/render.py — ne pas editer a la main.
# Source : deploy/k8s/pod-shared/host.exemple.yaml ; `render.py --check` verifie la fraicheur.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ameesh-pod-alice
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
    app.kubernetes.io/part-of: ameesh
spec:
  replicas: 1
  serviceName: ameesh-pod
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ameesh
      app.kubernetes.io/component: pod-host
      app.kubernetes.io/part-of: ameesh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ameesh
        app.kubernetes.io/component: pod-host
        app.kubernetes.io/part-of: ameesh
    spec:
      serviceAccountName: ameesh-pod
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: canon
        image: ameesh-runner
        imagePullPolicy: IfNotPresent
        args:
        - sh
        - -ec
        - |
          install -m 600 /etc/ameesh/canon-key/ssh-privatekey /tmp/canon-key
          export GIT_SSH_COMMAND="ssh -i /tmp/canon-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/ameesh/canon-key/known_hosts"
          repo=/var/lib/ameesh/canon/repo
          if [ ! -d "$repo/.git" ]; then
            git clone --quiet --branch "$CANON_BRANCH" -- "$CANON_URL" "$repo"
          fi
          ameesh canon sync --fetch || echo "canon sync en échec : réclamation fermée jusqu'au prochain sync" >&2
          rm -f /tmp/canon-key
        env:
        - name: HOME
          value: /tmp
        - name: AMEESH_HOST
          value: pod-alice-exemple
        - name: AMEESH_CONFIG
          value: /etc/ameesh/supervisor/config.json
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: ameesh-db
              key: password
        - name: CANON_URL
          valueFrom:
            configMapKeyRef:
              name: ameesh-pod-canon
              key: url
        - name: CANON_BRANCH
          valueFrom:
            configMapKeyRef:
              name: ameesh-pod-canon
              key: branch
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          runAsUser: 10001
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: supervisor-config
          mountPath: /etc/ameesh/supervisor
          readOnly: true
        - name: canon
          mountPath: /var/lib/ameesh/canon
        - name: canon-key
          mountPath: /etc/ameesh/canon-key
          readOnly: true
        - name: canon-tmp
          mountPath: /tmp
      containers:
      - name: supervisor
        image: ameesh-runner
        imagePullPolicy: IfNotPresent
        args:
        - sh
        - -ec
        - |-
          umask 077
          exec ameesh run --poll 5
        workingDir: /home/ameesh
        env:
        - name: HOME
          value: /home/ameesh
        - name: AMEESH_HOST
          value: pod-alice-exemple
        - name: AMEESH_CONFIG
          value: /etc/ameesh/supervisor/config.json
        - name: AMEESH_POD
          value: '1'
        - name: AMEESH_POD_MEMORY_BYTES
          value: '4294967296'
        - name: AMEESH_POD_CPU_CORES
          value: '4'
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: ameesh-db
              key: password
        readinessProbe:
          exec:
            command:
            - ameesh
            - doctor
            - --probe
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsUser: 10001
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: supervisor-home
          mountPath: /home/ameesh
        - name: supervisor-config
          mountPath: /etc/ameesh/supervisor
          readOnly: true
        - name: canon
          mountPath: /var/lib/ameesh/canon
          readOnly: true
        - name: supervisor-tmp
          mountPath: /tmp
      - name: tenant-alice
        image: ameesh-runner
        env:
        - name: HOME
          value: /home/ameesh-alice
        - name: USER
          value: ameesh-alice
        - name: LOGNAME
          value: ameesh-alice
        - name: TMPDIR
          value: /tmp
        - name: AMEESH_HOST
          value: pod-alice-exemple
        - name: AMEESH_TENANT
          value: human:alice
        - name: AMEESH_RUNNER_ID
          value: pod-alice-exemple/alice
        - name: AMEESH_CONFIG
          value: /etc/ameesh/tenant/config.json
        - name: AMEESH_CANON
          value: /var/lib/ameesh/canon/repo
        - name: AMEESH_CANON_SYNC_INTERVAL
          value: '0'
        - name: GIT_CONFIG_COUNT
          value: '1'
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: /var/lib/ameesh/canon/repo
        - name: AMEESH_POD
          value: '1'
        volumeMounts:
        - name: home-alice
          mountPath: /home/ameesh-alice
        - name: passwd
          mountPath: /etc/passwd
          subPath: passwd
          readOnly: true
        - name: group
          mountPath: /etc/group
          subPath: group
          readOnly: true
        - name: tenant-config-alice
          mountPath: /etc/ameesh/tenant
          readOnly: true
        - name: canon
          mountPath: /var/lib/ameesh/canon
          readOnly: true
        - name: tenant-tmp-alice
          mountPath: /tmp
        securityContext:
          runAsUser: 2519
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        args:
        - sh
        - -ec
        - |-
          umask 077
          exec ameesh run --poll 5
        workingDir: /home/ameesh-alice
        readinessProbe:
          exec:
            command:
            - ameesh
            - doctor
            - --probe
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        envFrom:
        - secretRef:
            name: ameesh-harness-alice
            optional: true
      - name: tenant-bruno
        image: ameesh-runner
        env:
        - name: HOME
          value: /home/ameesh-bruno
        - name: USER
          value: ameesh-bruno
        - name: LOGNAME
          value: ameesh-bruno
        - name: TMPDIR
          value: /tmp
        - name: AMEESH_HOST
          value: pod-alice-exemple
        - name: AMEESH_TENANT
          value: human:bruno
        - name: AMEESH_RUNNER_ID
          value: pod-alice-exemple/bruno
        - name: AMEESH_CONFIG
          value: /etc/ameesh/tenant/config.json
        - name: AMEESH_CANON
          value: /var/lib/ameesh/canon/repo
        - name: AMEESH_CANON_SYNC_INTERVAL
          value: '0'
        - name: GIT_CONFIG_COUNT
          value: '1'
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: /var/lib/ameesh/canon/repo
        - name: AMEESH_POD
          value: '1'
        volumeMounts:
        - name: home-bruno
          mountPath: /home/ameesh-bruno
        - name: passwd
          mountPath: /etc/passwd
          subPath: passwd
          readOnly: true
        - name: group
          mountPath: /etc/group
          subPath: group
          readOnly: true
        - name: tenant-config-bruno
          mountPath: /etc/ameesh/tenant
          readOnly: true
        - name: canon
          mountPath: /var/lib/ameesh/canon
          readOnly: true
        - name: tenant-tmp-bruno
          mountPath: /tmp
        securityContext:
          runAsUser: 2169
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        args:
        - sh
        - -ec
        - |-
          umask 077
          exec ameesh run --poll 5
        workingDir: /home/ameesh-bruno
        readinessProbe:
          exec:
            command:
            - ameesh
            - doctor
            - --probe
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        envFrom:
        - secretRef:
            name: ameesh-harness-bruno
            optional: true
      - name: canon-fetch
        image: ameesh-runner
        imagePullPolicy: IfNotPresent
        args:
        - sh
        - -ec
        - |
          install -m 600 /etc/ameesh/canon-key/ssh-privatekey /tmp/canon-key
          export GIT_SSH_COMMAND="ssh -i /tmp/canon-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/ameesh/canon-key/known_hosts"
          while :; do
            git -C /var/lib/ameesh/canon/repo fetch --quiet --no-tags origin \
              || echo "git fetch du canon en échec : dernière révision connue conservée" >&2
            sleep "$CANON_FETCH_INTERVAL" & wait $!
          done
        env:
        - name: HOME
          value: /tmp
        - name: CANON_FETCH_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: ameesh-pod-canon
              key: fetch-interval
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsUser: 10001
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: canon
          mountPath: /var/lib/ameesh/canon
        - name: canon-key
          mountPath: /etc/ameesh/canon-key
          readOnly: true
        - name: canon-tmp
          mountPath: /tmp
      volumes:
      - name: supervisor-home
        emptyDir:
          sizeLimit: 1Gi
      - name: home-alice
        persistentVolumeClaim:
          claimName: pvc-alice
      - name: home-bruno
        persistentVolumeClaim:
          claimName: pvc-bruno
      - name: canon
        emptyDir: {}
      - name: canon-key
        secret:
          secretName: ameesh-canon-deploy-key
          defaultMode: 288
      - name: canon-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: supervisor-tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: supervisor-config
        configMap:
          name: ameesh-pod-supervisor
      - name: passwd
        configMap:
          name: ameesh-pod-passwd
          items:
          - key: passwd
            path: passwd
      - name: group
        configMap:
          name: ameesh-pod-passwd
          items:
          - key: group
            path: group
      - name: tenant-config-alice
        configMap:
          name: ameesh-pod-tenant-alice
          items:
          - key: config.json
            path: config.json
      - name: tenant-tmp-alice
        emptyDir:
          sizeLimit: 1Gi
      - name: tenant-config-bruno
        configMap:
          name: ameesh-pod-tenant-bruno
          items:
          - key: config.json
            path: config.json
      - name: tenant-tmp-bruno
        emptyDir:
          sizeLimit: 1Gi
