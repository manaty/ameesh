# Source : deploy/k8s/pod-shared/host.exemple.yaml ; `render.py --check` verifie la fraicheur.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ameesh-pod-passwd
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
    app.kubernetes.io/part-of: ameesh
data:
  passwd: |
    root:x:0:0:root:/root:/bin/sh
    ameesh:x:10001:10000:ameesh pod supervisor:/home/ameesh:/bin/sh
    ameesh-alice:x:2519:10000:tenant alice:/home/ameesh-alice:/bin/sh
    ameesh-bruno:x:2169:10000:tenant bruno:/home/ameesh-bruno:/bin/sh
    nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin
  group: |
    root:x:0:
    ameesh:x:10001:
    ameesh-pod:x:10000:
    nogroup:x:65534:
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ameesh-pod-supervisor
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
    app.kubernetes.io/part-of: ameesh
data:
  config.json: |
    {
      "dsn": "postgresql://ameesh@ameesh-postgres:5432/ameesh?sslmode=require",
      "schema": "public",
      "project": "exemple",
      "host": "pod-alice-exemple",
      "humans": [
        "alice",
        "bruno"
      ],
      "pod": true,
      "canon": "/var/lib/ameesh/canon/repo",
      "canon_ref": "origin/main",
      "canon_sync_interval": 300,
      "lease_ttl": 120,
      "poll": 5
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ameesh-pod-canon
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
    app.kubernetes.io/part-of: ameesh
data:
  url: git@git.example.invalid:exemple/canon.git
  branch: main
  fetch-interval: '300'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ameesh-pod-tenant-alice
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
    app.kubernetes.io/part-of: ameesh
data:
  config.json: |
    {
      "dsn": "postgresql://ameesh@ameesh-postgres:5432/ameesh?sslmode=require",
      "schema": "public",
      "project": "exemple",
      "host": "pod-alice-exemple",
      "tenant": "human:alice",
      "runner_id": "pod-alice-exemple/alice",
      "humans": [
        "alice"
      ],
      "pod": true,
      "canon": "/var/lib/ameesh/canon/repo",
      "canon_ref": "origin/main",
      "canon_sync_interval": 0,
      "lease_ttl": 120,
      "poll": 5,
      "accounts": {
        "claude": [
          {
            "name": "primaire"
          }
        ],
        "codex": [
          {
            "name": "primaire"
          }
        ]
      }
    }
---
