# SPDX-License-Identifier: AGPL-3.0-only
# Chart de référence d'un hôte pod partagé à N tenants (#7695 P2, #7699 P6).
#
#   ./render.py --write                         # régénère rendered/ (relire le diff)
#   ./render.py --check                         # vérifie que rendered/ est à jour
#   kubectl kustomize deploy/k8s/pod-shared     # rendu, sans rien appliquer
#   kubectl apply -k deploy/k8s/pod-shared      # acte de l'opérateur, jamais d'un agent
#
# Les Secret ne font PAS partie des ressources : ils sont créés à part (voir
# secrets.exemple.yaml, jamais rempli dans un dépôt). Les objets de `rendered/`
# sont générés depuis host.exemple.yaml ; les éditer à la main est une erreur
# (`render.py --check` le refuse).
#
# L'image est dans `host.exemple.yaml`, **épinglée par digest** : kustomize ne
# réécrit pas de tag. Un `images:` ici écraserait le digest et rendrait le
# retour arrière imprévisible.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: ameesh            # à décommenter / adapter

labels:
  - pairs:
      app.kubernetes.io/part-of: ameesh
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - rendered/configmaps.yaml
  - rendered/pvcs.yaml
  - rendered/statefulset.yaml
  - rendered/networkpolicy.yaml
  - rendered/resourcequota.yaml
  - rendered/pdb.yaml
