# SPDX-License-Identifier: AGPL-3.0-only
# #7697 (P4 de #7633) : le seul composant qui parle à l'API Kubernetes est le
# pourvoyeur. Le ServiceAccount `ameesh-child` n'a aucun droit et ne monte
# aucun jeton ; le pourvoyeur ne peut créer que des pods et des ConfigMap dans
# SON namespace (voir rbac.yaml et la ValidatingAdmissionPolicy).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ameesh-child
  namespace: ameesh
  labels:
    app.kubernetes.io/part-of: ameesh
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ameesh-pod-provisioner
  namespace: ameesh
  labels:
    app.kubernetes.io/part-of: ameesh
