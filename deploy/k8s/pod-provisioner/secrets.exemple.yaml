# SPDX-License-Identifier: AGPL-3.0-only
# #7697 (P4 de #7633) : forme des Secrets attendus par le pourvoyeur — jamais
# rempli ici, jamais appliqué tel quel, volontairement absent de
# kustomization.yaml.
#
#   kubectl create secret generic ameesh-db-pod-provisioner --from-literal=password='…'
#   kubectl create secret generic ameesh-db-pod-admission --from-literal=password='…'
#   kubectl create secret generic ameesh-child-<slug> \
#       --from-literal=api-key='…'      # clé d'API d'ORGANISATION, fichier 0600
#
# La clé d'API est celle de l'ORGANISATION, avec un plafond de dépense côté
# fournisseur : le relais de modèle (imputation au compte du parent) est une
# tranche ultérieure (D6). Un Secret par enfant, nommé
# `ameesh-child-<slug>` (le nom exact est dans la demande et dans
# `placement.describe()`), n'est monté que dans SON conteneur.
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-db-pod-provisioner
  namespace: ameesh
type: Opaque
stringData:
  # mot de passe du rôle `ameesh_pod_provisioner` (PGPASSWORD) ; le DSN, sans
  # mot de passe, est dans le Deployment. Rôle créé et borné par
  # deploy/sql/role-pod-provisioner.sql (#44561).
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-db-pod-admission
  namespace: ameesh
type: Opaque
stringData:
  # mot de passe du rôle `ameesh_pod_admission`, lecture seule sur
  # `pod_requests` ; le webhook ne peut pas écrire sa source d'autorisation.
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-child-exemple
  namespace: ameesh
type: Opaque
stringData:
  # clé d'API d'organisation de l'enfant ; le nom du Secret réel est dérivé de
  # l'enfant (`tenancy.child_credential_secret`), jamais choisi par le parent.
  api-key: ""
