# SPDX-License-Identifier: AGPL-3.0-only
# #7694 (design 7633 §3, §6.3) : les ConfigMap d'un hôte pod.
#
# Aucune de ces valeurs n'est un secret : le mot de passe de la base est dans
# le Secret `ameesh-db`, et les clés de fournisseur dans le Secret
# `ameesh-harness-alice` (voir secrets.exemple.yaml). Ne jamais remplir un
# Secret dans ce dépôt.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ameesh-pod-passwd
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
data:
  # Projeté sur /etc/passwd et /etc/group des conteneurs de tenant (subPath,
  # lecture seule). Le GID 10000 est le `fsGroup` neutre du pod, le même pour
  # tous les PVC : ce n'est pas une frontière (les dossiers de comptes sont
  # 0700 et le groupe n'y a aucun droit). L'UID 2519 vient de
  # `ameesh host tenant add human:alice --host pod-alice-exemple --pod` ;
  # il est la source de vérité, recopié ici et vérifié par le battement.
  passwd: |
    root:x:0:0:root:/root:/bin/sh
    ameesh:x:10001:10000:ameesh pod supervisor:/home/ameesh:/bin/sh
    ameesh-alice:x:2519:10000:tenant alice:/home/ameesh-alice:/bin/sh
    nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin
  group: |
    root:x:0:
    ameesh:x:10001:
    ameesh-pod:x:10000:
    nogroup:x:65534:
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ameesh-pod-supervisor
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
data:
  # Configuration du SUPERVISEUR (sans `tenant`) : il publie les relevés de
  # l'hôte pod, tient host_lifecycle et la porte, synchronise le canon. Il ne
  # réclame aucun agent et ne monte aucun volume de tenant.
  config.json: |
    {
      "dsn": "postgresql://ameesh@ameesh-postgres:5432/ameesh?sslmode=require",
      "schema": "public",
      "project": "exemple",
      "host": "pod-alice-exemple",
      "humans": ["alice"],
      "pod": true,
      "canon": "/var/lib/ameesh/canon/repo",
      "canon_ref": "origin/main",
      "canon_sync_interval": 300,
      "lease_ttl": 120,
      "poll": 5
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ameesh-pod-tenant-alice
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
data:
  # Configuration du TENANT (non secrète) : elle nomme l'hôte, le tenant, le
  # runner et le canon en lecture seule. `canon_sync_interval: 0` est
  # redondant avec la garde de `canon_sync_once` (#7694), et le dit.
  # Les comptes (`accounts`) viendront de la tranche P2/P3 ; en P1 la carte
  # Host reste en `api-key`, aucun siège n'est déclaré ici.
  config.json: |
    {
      "dsn": "postgresql://ameesh@ameesh-postgres:5432/ameesh?sslmode=require",
      "schema": "public",
      "project": "exemple",
      "host": "pod-alice-exemple",
      "tenant": "human:alice",
      "runner_id": "pod-alice-exemple/alice",
      "humans": ["alice"],
      "canon": "/var/lib/ameesh/canon/repo",
      "canon_ref": "origin/main",
      "canon_sync_interval": 0,
      "lease_ttl": 120,
      "poll": 5
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ameesh-pod-canon
  labels:
    app.kubernetes.io/name: ameesh
    app.kubernetes.io/component: pod-host
data:
  # Source du canon, clonée par l'init `canon` et tenue à jour par
  # `canon-fetch`. La clé de déploiement (lecture seule) est le Secret
  # `ameesh-canon-deploy-key` ; elle n'est jamais montée dans un tenant.
  url: git@git.example.invalid:exemple/canon.git
  branch: main
  fetch-interval: "300"
