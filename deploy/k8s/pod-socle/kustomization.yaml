# Squelette d'un hôte pod ameesh (P1 de #7633) — un superviseur, un tenant.
#
#   kubectl kustomize deploy/k8s/pod-socle    # rendu, sans rien appliquer
#   kubectl apply -k deploy/k8s/pod-socle     # acte de l'opérateur, jamais d'un agent
#
# Les Secret ne font PAS partie des ressources : ils sont créés à part (voir
# secrets.exemple.yaml, jamais rempli dans un dépôt).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: ameesh            # à décommenter / adapter

labels:
  - pairs:
      app.kubernetes.io/part-of: ameesh
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - configmaps.yaml
  - pvc.yaml
  - statefulset.yaml

images:
  # image construite depuis le Dockerfile du dépôt, poussée dans VOTRE registre
  - name: ameesh-runner
    newName: registry.example.invalid/ameesh-runner
    newTag: "1.1.0"
