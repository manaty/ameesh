# SPDX-License-Identifier: AGPL-3.0-only
# FORME des Secret attendus par statefulset.yaml — JAMAIS rempli ici, jamais
# appliqué tel quel, et volontairement absent de kustomization.yaml.
#
# Créez-les hors de tout dépôt, par exemple :
#
#   kubectl create secret generic ameesh-db --from-literal=password='…'
#   kubectl create secret generic ameesh-harness-alice --from-env-file=alice.env  # 0600, hors dépôt
#   kubectl create secret generic ameesh-canon-deploy-key \
#       --from-file=ssh-privatekey=./canon_deploy_key \
#       --from-file=known_hosts=./known_hosts
#
# ou par votre gestionnaire de secrets (External Secrets, Sealed Secrets,
# SOPS…). Les valeurs vides ci-dessous ne sont que des noms de clés.
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-db
type: Opaque
stringData:
  # mot de passe du rôle Postgres de l'exécuteur (PGPASSWORD) ; le DSN, lui,
  # est dans les ConfigMap sans mot de passe.
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-harness-alice
type: Opaque
stringData:
  # Clés d'API d'ORGANISATION du tenant (mode `api-key`, seule carte admise en
  # P1). Aucun abonnement ici : la tranche P3 rouvre Q2 bis et la connexion du
  # siège, pas ce chart-ci. Toutes les clés du Secret deviennent des variables
  # d'environnement du harnais du tenant, jamais de celles des autres tenants.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ameesh-canon-deploy-key
type: Opaque
stringData:
  # clé de déploiement EN LECTURE SEULE sur le dépôt du canon (jamais en
  # écriture) ; montée dans l'init `canon` et `canon-fetch` seulement, jamais
  # dans un conteneur de tenant.
  ssh-privatekey: ""
  # empreinte(s) du serveur git (ssh-keyscan vérifié hors bande)
  known_hosts: ""
