# Lot #3312: needrestart never restarts a GitHub Actions runner itself.
# Installed by deploy/ci-flotte/install.sh as
# /etc/needrestart/conf.d/ameesh-ci-runners.conf (perl, evaluated after
# needrestart.conf).
#
# Ubuntu 24.04 runs needrestart in automatic mode after every unattended
# upgrade (apt-daily-upgrade.timer, 06:00 + up to 60 min). A library the
# runner maps (zlib1g on 24/10/2026, liblzma5 on 21/10) made it `systemctl
# restart` the eight `actions.runner.*` units of ameesh-ci-1 then ameesh-ci-2
# in the middle of their jobs: "The runner has received a shutdown signal",
# a red full suite on main with no failing test (run 40068028315).
#
# `0` moves the runners to the "deferred" list, like docker and dbus: they
# still appear in `needrestart -b` (NEEDRESTART-SVC), and
# ameesh-ci-runner-drain restarts each one only while it runs no job.
$nrconf{override_rc}->{qr(^actions\.runner\.)} = 0;
