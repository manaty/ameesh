# SPDX-License-Identifier: AGPL-3.0-only
#
# #3444 (décision owner #133454 a) — GARDE-FOU, PAS LA FRONTIÈRE.
#
# Ce drop-in est OPT-IN (il vit sous deploy/poste/, pas dans le gabarit) :
# il retire ~/.ssh du système de fichiers de l'unité et l'agent SSH de son
# environnement. C'est un garde-fou contre l'usage par défaut et l'accident.
# Il ne satisfait PAS seul la décision #133454 a : le même compte Unix peut
# le contourner (demander au gestionnaire utilisateur une autre unité sans ce
# drop-in, ou joindre la socket de l'agent SSH à son chemin connu dans
# XDG_RUNTIME_DIR). La frontière (« la clé root n'est plus atteignable »)
# reste à établir par un lot séparé ; options et coûts en note de #3444 et
# dans docs/EXPLOITATION.md, « Clés SSH de l'owner et exécuteurs du poste ».
#
# NE PAS POSER CE FICHIER AVANT LE PRÉREQUIS :
#   1. profil AppArmor `deploy/poste/ameesh-systemd-executor.apparmor` ;
#   2. témoin `deploy/poste/verifie-cles-owner` en root ;
#   3. `deploy/poste/preuve-isolation-cles-owner.sh` -> PASS ;
#   4. seulement alors ce drop-in, puis daemon-reload et redémarrage.
# Sur Ubuntu 24.04 sans le profil, systemd ignore SILENCIEUSEMENT
# `InaccessiblePaths=` (mesuré sur agents-2, 25/10/2026) : le témoin
# ExecStartPre échoue et l'unité refuse de démarrer — donc plus aucun runner
# sur l'hôte. L'ordre est une garde, pas une politesse.
#
# Installation (propriétaire des unités) :
#   install -D -m 0644 deploy/poste/cles-owner.conf \
#     ~/.config/systemd/user/ameesh-runner-agent@.service.d/cles-owner.conf
#   systemctl --user daemon-reload
#   systemctl --user restart 'ameesh-runner-agent@*'   # draine chaque tour
# Retour arrière : retirer le fichier, daemon-reload, redémarrer.

[Service]
# Sans `-` : ~/.ssh doit exister (c'est le cas sur le poste). Un chemin
# absent ne serait pas masqué ; le témoin refuse alors le démarrage.
InaccessiblePaths=%h/.ssh
# Répété du gabarit à dessein : le drop-in reste complet si le gabarit
# installé est antérieur au lot.
UnsetEnvironment=SSH_AUTH_SOCK SSH_AGENT_PID
# Témoin root (0755) : exige un MONTAGE sur %h/.ssh dans le namespace de
# l'unité, et non un simple répertoire vide. Échec => l'unité ne démarre pas.
ExecStartPre=/usr/local/libexec/ameesh/verifie-cles-owner %h/.ssh
