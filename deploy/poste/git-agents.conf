#
# #3540 — git des exécuteurs d'agents de pc-smichea en HTTPS par `gh`.
#
# Lu comme configuration SYSTÈME de git, et seulement dans les unités
# d'agents (`Environment=GIT_CONFIG_SYSTEM=%h/.config/ameesh/git-agents.conf`
# du drop-in `deploy/poste/cles-owner.conf`) : le shell de l'owner, son
# `~/.gitconfig` et son `~/.ssh` ne sont pas touchés. À poser sur un hôte où
# le drop-in masque déjà `~/.ssh` : là, SSH ne peut plus servir de transport.
#
# GIT_CONFIG_SYSTEM (fichier) et NON GIT_CONFIG_COUNT/KEY/VALUE : la
# désignation au gel relit sa cible par `canon._git`, dont `_git_env()` retire
# ces variables de l'environnement ; la réécriture d'URL y serait invisible
# (« cannot refresh target origin/main: git fetch failed; stale target
# refused »). Un fichier système est lu par tous les git de l'unité.
#
# Ce fichier est aussi le seul endroit du poste où les URLs GitHub des clones
# SSH sont réécrites : sur un hôte sans ce drop-in, un `git push` SSH reste
# un push SSH (`ameesh work merge-pr` pousse en SSH pour les PR qui touchent
# `.github/workflows/**`, le jeton d'un rôle pouvant manquer `workflow`).
#
# Installation (propriétaire des unités, avec le drop-in) :
#   install -D -m 0644 deploy/poste/git-agents.conf \
#     ~/.config/ameesh/git-agents.conf
# Retrait : le fichier et le drop-in, puis `daemon-reload` et redémarrage.

# Le fichier est lu à la place de /etc/gitconfig : l'inclure garde la
# configuration système de l'hôte (absente = include ignoré).
[include]
	path = /etc/gitconfig

# Les remotes SSH des clones du poste. GitHub n'accepte que ces deux formes ;
# `git@github.com:owner/repo` est la plus courante, `ssh://…` la forme URL.
[url "https://github.com/"]
	insteadOf = git@github.com:
	insteadOf = ssh://git@github.com/

# L'assistant d'identification `gh` de l'owner (même uid), pour les fetchs
# d'un dépôt privé et les pushs. `gh` doit être dans le PATH de l'unité
# (/usr/bin sur le poste) ; l'assistant du ~/.gitconfig de l'owner reste un
# second recours, il n'est ni copié ni modifié ici.
[credential "https://github.com"]
	helper = !gh auth git-credential
