#
# Inventaire de réplication PostgreSQL 17 du mesh (lot #6868, EP8.3a ;
# cible révisée par le lot #8027 : le primaire reste sur le hub).
#
# Une ligne par nœud, six champs séparés par des blancs, « # » commente :
#
#   nom  hote  role  synchrone  nofailover  priorite
#
#   nom        nom du nœud, aussi utilisé comme application_name du flux ;
#   hote       nom (ou adresse) que les autres nœuds joignent sur le réseau
#              privé (#6859), port 5432 ;
#   role       « primaire » : le primaire permanent de la grappe (le hub) ;
#              « standby »  : les répliques, candidates à une bascule de
#              secours seulement ;
#   synchrone  « oui » : candidat à synchronous_standby_names ; le primaire
#              et le hub sont « non » (le hub ne s'attend jamais lui-même) ;
#   nofailover « oui » : jamais promu par accident (hub, 4 vCPU / 8 Go sans
#              swap) ; un retour planifié du primaire sur le hub passe par
#              promouvoir.sh --retour-nofailover, borne exigée ;
#   priorite   score de candidat (100 = préféré), indicatif pour EP8.4.
#
# Le nombre de synchrones votants est fixé à 1 (ANY 1 dans le fragment de
# configuration) : les deux VM d'agents sont candidates, le hub ne l'est pas.
# La cible du lot #8027 est le hub primaire (il reste seul allumé en veille) ;
# les scripts lisent aussi le rôle effectif du serveur (pg_is_in_recovery)
# pour couvrir une bascule de secours et son retour.
manaty-mesh-1    10.78.0.10       primaire  non  oui    0
ameesh-agents-1  10.78.0.11       standby   oui  non  100
ameesh-agents-2  10.78.0.12       standby   oui  non   90
