#
# Inventaire de réplication PostgreSQL 17 du mesh (lot #6868, EP8.3a).
#
# Une ligne par nœud, six champs séparés par des blancs, « # » commente :
#
#   nom  hote  role  synchrone  nofailover  priorite
#
#   nom        nom du nœud, aussi utilisé comme application_name du flux ;
#   hote       nom (ou adresse) que les autres nœuds joignent sur le réseau
#              privé (#6859), port 5432 ;
#   role       « primaire » : la cible après la bascule manuelle d'EP8.3 ;
#              « standby »  : les autres ;
#   synchrone  « oui » : candidat à synchronous_standby_names ; le hub est
#              « non » (nosync) et n'ajoute jamais sa latence à un commit ;
#   nofailover « oui » : jamais promu (hub, 4 vCPU / 8 Go sans swap), sauf le
#              retour planifié d'un aller-retour (promouvoir.sh
#              --retour-nofailover, borne exigée) ;
#   priorite   score de candidat (100 = préféré), indicatif pour EP8.4.
#
# Le nombre de synchrones votants est fixé à 1 (ANY 1 dans le fragment de
# configuration) : les deux VM d'agents sont candidates, le hub ne l'est pas.
# L'inventaire est la cible d'EP8.3 ; au moment de la préparation, le hub est
# encore primaire : les scripts lisent le rôle effectif du serveur
# (pg_is_in_recovery) pour poser les rôles et slots sur celui qui sert.
ameesh-agents-1  10.78.0.11       primaire  oui  non  100
ameesh-agents-2  10.78.0.12       standby   oui  non   90
manaty-mesh-1    10.78.0.10       standby   non  oui    0
