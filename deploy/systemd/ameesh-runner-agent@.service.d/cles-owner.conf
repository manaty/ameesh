# SPDX-License-Identifier: AGPL-3.0-only
#
# #3444 (décision owner #133454 a) — à poser UNIQUEMENT sur un hôte où
# l'exécuteur partage le compte Unix de l'humain (pc-smichea). La clé SSH de
# l'owner n'est plus dans le système de fichiers de l'exécuteur, et son agent
# SSH n'entre plus par l'environnement.
#
# ATTENTION : sur Ubuntu 24.04, ce drop-in n'est effectif que si le prérequis
# hôte est posé (profil AppArmor pour systemd-executor, voir
# docs/EXPLOITATION.md « Clés SSH de l'owner et exécuteurs du poste »).
# Le noyau y restreint les espaces de noms utilisateur
# (kernel.apparmor_restrict_unprivileged_userns=1) : systemd crée bien le user
# ns, AppArmor refuse ensuite les capacités du nouveau ns, le mount ns n'est
# jamais posé et InaccessiblePaths= est SILENCIEUSEMENT ignoré (mesuré sur
# agents-2 le 25/10/2026). Le témoin ExecStartPre ci-dessous rend cet échec
# visible : sans isolation effective, l'unité REFUSE de démarrer — jamais de
# fausse sécurité. C'est voulu : une unité qui ne peut pas cacher ~/.ssh ne
# doit pas mener d'agent sur ce compte.
#
# Installation (propriétaire des unités, sans root pour ce fichier) :
#   install -D -m 0644 deploy/systemd/ameesh-runner-agent@.service.d/cles-owner.conf \
#     ~/.config/systemd/user/ameesh-runner-agent@.service.d/cles-owner.conf
#   systemctl --user daemon-reload
#   systemctl --user restart 'ameesh-runner-agent@*'   # draine chaque tour
#
# Retour arrière (l'inverse de la décision) : retirer le fichier,
#   systemctl --user daemon-reload
#   systemctl --user restart 'ameesh-runner-agent@*'
# puis, si on le veut, décharger le profil AppArmor (docs/EXPLOITATION.md).

[Service]
# Le répertoire des clés privées de l'humain. Pas ~/.gnupg : les sauvegardes
# de session chiffrées en dépendent, et le lot ne vise que les clés SSH.
# `-` : hôte sans ~/.ssh (rien à cacher).
InaccessiblePaths=-%h/.ssh
# Répété du gabarit à dessein : le drop-in reste complet si le gabarit
# installé est antérieur au lot.
UnsetEnvironment=SSH_AUTH_SOCK SSH_AGENT_PID
# Témoin d'isolation, posé en root (0755) par la procédure du poste. Il
# s'exécute DANS le mount ns de l'unité et échoue si ~/.ssh est encore
# lisible et non vide ; son échec empêche le démarrage de l'exécuteur.
ExecStartPre=/usr/local/libexec/ameesh/verifie-cles-owner %h/.ssh
