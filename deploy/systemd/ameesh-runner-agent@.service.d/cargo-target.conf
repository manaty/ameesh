#
# ameesh — one Rust build directory per agent (lot #248, L231), instead of one
# `target/` per worktree (~14 GB each for nexlink desktop/host). Set by bureau
# on pc-smichea after the 2026-10-11 19:20 outage (btrfs metadata full).
# One turn at a time per agent, so no two cargo builds of one agent compete
# for the directory (cargo's own lock serialises sub-agents anyway).
#
# Installation (next to the unit):
#   install -D -m 0644 'deploy/systemd/ameesh-runner-agent@.service.d/cargo-target.conf' \
#     ~/.config/systemd/user/ameesh-runner-agent@.service.d/cargo-target.conf
#   systemctl --user daemon-reload      # applies at each agent's next restart
#
# Scripts that hard-code `<crate>/target/debug/...` must read
# $CARGO_TARGET_DIR when it is set. The housekeeping never enters this
# directory (#247); `cargo clean` from any worktree of the agent empties it.

[Service]
Environment=CARGO_TARGET_DIR=%h/.cache/cargo-target/%i
