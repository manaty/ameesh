#
# ameesh — complément de l'unité système `ameesh-runner@<persona>` (hors
# dépôt) de la VM du mesh : plafond mémoire par persona (L159c). Le
# 2026-10-10, sans plafond, l'OOM du noyau y a tué un harnais à 4,1 Go.
# Mêmes valeurs que deploy/systemd/ameesh-runner-agent@.service ; un plafond
# propre à une persona va dans /etc/systemd/system/ameesh-runner@<p>.service.d/.

[Service]
Slice=ameesh-agents.slice
MemoryHigh=5.4G
MemoryMax=6G
OOMScoreAdjust=500
