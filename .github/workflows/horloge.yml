# SPDX-License-Identifier: AGPL-3.0-only
# #5427 — la barrière horloge et fuseau, hors de la porte de fusion.
#
# Sept lots correctifs en deux semaines (#2600, #4168, #5086, #5302, #5314,
# #5321, #5412) et trois paquets rouges en 24 h : des tests dépendaient du jour
# ou de l'horloge du runner, et le défaut ne se voyait qu'après la composition
# du paquet. Cette passe rejoue les tests sensibles au jour sous une horloge
# simulée (libfaketime à 23:45 puis 00:05 UTC) et sous un fuseau extrême
# (TZ=Pacific/Kiritimati, UTC+14) : elle est **hors** de la porte de fusion,
# ne porte jamais le check requis `tests` et ne bloque aucune PR.
#
# La sélection vient du lint d'herméticité (règle H3 : fixture dépendante du
# jour) et de tests/parts/horloge.txt (les modules des lots ci-dessus).
# `scripts/test-horloge-passe.py` vérifie d'abord que l'horloge simulée est
# bien celle annoncée ; sans libfaketime utilisable, la passe est **non
# concluante** (canon §3) et ne rougit pas.
#
# Un rouge est un défaut **du test** (canon §3), pas un incident de
# production. Le workflow ouvre un ticket par test (« test dépendant de
# l'environnement : … », `scripts/horloge-tickets.py`) ; la veille GitHub le
# convertit en lot dans l'heure, avec son `issue_ref`. Aucun secret n'est
# utilisé : le jeton du workflow suffit (`issues: write`).
#
# Quatre créneaux (23:35, 00:15, 09:45, 10:05 UTC), hors des coupures de
# release 11:00/23:00 Europe/Paris ; Ubuntu hébergé (dépôt public, pas de
# facture) : la passe ne prend pas un runner du pool sur lequel les paquets
# attendent. La passe ne rejoue un scénario que dans sa fenêtre de 15 min
# autour de la bascule : un cron en retard devient « pas dû », jamais un faux
# rouge dû au décalage entre l'horloge simulée et celle de la base.
name: horloge

on:
  schedule:
    # Quatre passages : la passe tente les trois scénarios et ne rejoue que
    # ceux qui sont dans leur fenêtre de 15 min (les autres sont « pas dus »).
    # 23:35 / 00:15 UTC : horloge simulée à 23:45 puis 00:05, la base reste
    # à quelques minutes de l'heure réelle (baux et âges cohérents).
    # 09:45 / 10:05 UTC : 23:45 puis 00:05 à Pacific/Kiritimati (UTC+14).
    - cron: "35 23 * * *"
    - cron: "15 0 * * *"
    - cron: "45 9 * * *"
    - cron: "5 10 * * *"
  workflow_dispatch:

concurrency:
  group: horloge
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  passe:
    name: passe horloge et fuseau
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGPASSWORD: ameesh-ci
      AMEESH_REQUIRE_DB: "1"
    steps:
      - name: début du job
        run: echo "AMEESH_JOB_DEBUT=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dépendances (psycopg, hôte, yaml)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'psycopg[binary]>=3.2' 'cryptography>=41' \
            'psutil>=5.9' 'coverage>=7.10' 'pyyaml>=6'
      # libfaketime du paquet Ubuntu 24.04 (0.9.10) casse `select.select`
      # (EINVAL) : la base jetable de PgTestCase ne peut plus lire son tube.
      # On construit donc la version amont épinglée ; le commit est vérifié
      # pour qu'un tag déplacé ne fasse pas tourner un autre code.
      - name: libfaketime épinglé (horloge simulée)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential git postgresql-client
          expected=86b37fde2fed7336ea2d0c17928e3015a55d9b4a
          timeout 120 git clone --quiet --depth 1 --branch v0.9.13 \
            https://github.com/wolfcw/libfaketime.git "$RUNNER_TEMP/libfaketime"
          test "$(git -C "$RUNNER_TEMP/libfaketime" rev-parse HEAD)" = "$expected"
          make -C "$RUNNER_TEMP/libfaketime" -j"$(nproc)" >/dev/null
          test -f "$RUNNER_TEMP/libfaketime/src/libfaketime.so.1"
          echo "AMEESH_FAKETIME_LIB=$RUNNER_TEMP/libfaketime/src/libfaketime.so.1" \
            >> "$GITHUB_ENV"
      - name: port de la base jetable
        run: |
          echo "AMEESH_TEST_DSN=postgresql://ameesh@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ameesh" >> "$GITHUB_ENV"
      - name: base jetable (sans fsync)
        run: |
          psql "$AMEESH_TEST_DSN" -q \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - name: identité git des tests (dépôts temporaires)
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "ameesh ci"
          git config --global user.email "ci@ameesh.invalid"
          git config --global init.defaultBranch main
      - name: passe horloge et fuseau
        id: passe
        run: |
          rc=0
          python3 scripts/test-horloge-passe.py --timeout 900 \
            --json "$RUNNER_TEMP/horloge.json" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = 0 ]; then exit 0; fi
          if [ "$rc" = 77 ]; then
            echo "::warning::passe non concluante (libfaketime absent ou horloge non vérifiée) : rien n'est bloqué (canon §3)"
            exit 0
          fi
          exit "$rc"
      - name: tickets d'admission (un test dépendant de l'environnement)
        if: failure() && steps.passe.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$RUNNER_TEMP/horloge.json" ]; then
            echo "::error::rapport de passe absent : admission impossible"
            exit 0
          fi
          python3 scripts/horloge-tickets.py "$RUNNER_TEMP/horloge.json"
      - name: rapport de la passe
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/horloge.json" ]; then
            python3 - "$RUNNER_TEMP/horloge.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## Passe horloge et fuseau\n")
          print("verdict : **%s**\n" % payload.get("verdict"))
          for run in payload.get("scenarios") or ():
              print("- %s : %s, %d échec(s), %.1f s" % (
                  run.get("name"), run.get("tz"), len(run.get("failures") or ()),
                  float(run.get("seconds") or 0)))
          PY
          else
            echo "rapport absent" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horloge-rapport
          path: ${{ runner.temp }}/horloge.json
          if-no-files-found: ignore
          retention-days: 7
