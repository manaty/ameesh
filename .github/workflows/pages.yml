# SPDX-License-Identifier: AGPL-3.0-only
# Public site of ameesh on GitHub Pages: landing page (site/landing/) at the
# root, MkDocs documentation (site/docs/, mkdocs.yml) under /docs/.
# Served at https://ameesh.org (custom domain, set in the repository's
# Pages settings; _site/CNAME documents it).
# The build is strict: a broken link or a missing page fails it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "mkdocs.yml"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: MkDocs and Material (pinned)
        run: python -m pip install -r site/requirements.txt
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - name: build (mkdocs --strict + landing page)
        # URL of the site assistant (L33), a repository variable — not a
        # secret: it is public in the page. Unset = chat bubble hidden.
        env:
          AMEESH_CHAT_ENDPOINT: ${{ vars.AMEESH_CHAT_ENDPOINT }}
        run: MKDOCS=mkdocs scripts/build-site.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site
          retention-days: 1  # read by deploy in the same run; org artifact quota (#3546)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
