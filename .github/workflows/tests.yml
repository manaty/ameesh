# SPDX-License-Identifier: AGPL-3.0-only
# Intégration continue d'ameesh : la suite sur un vrai Postgres 17, avec les
# deux pilotes de base (psql et psycopg). Aucun secret n'est utilisé : chaque
# base de service n'existe que le temps de sa part.
#
# L116 — la suite est découpée en parts parallèles par scripts/test-parts.py
# (par module, équilibré par tests/parts/durees.json), chaque part avec son
# propre Postgres :
#   - psycopg : sur une PR de lot, les tests impactés et le contrat (L1211),
#               en une à quatre parts selon l'estimation ; la suite complète,
#               en 8 parts (#1476 : 6 → 8, d'après les durées mesurées du run
#               de paquet 39085758208), sur push vers main ou release/**, sur
#               une PR de release (source ou cible release/** ou
#               integration/**) et sur l'appel du portier de paquet
#               (workflow_call, §12) ;
#   - psql    : sur une PR de lot, les modules « pilote » parmi les impactés
#               et le contrat, plus la liste « always » déclenchée (#749), en
#               une à trois parts (#947 : huit jobs se partagent chaque hôte
#               auto-hébergé, une part unique de ~24 min au repos atteignait le
#               plafond de 30 min sous saturation) ; hors lot (#3749), la liste
#               pilote et tout le contrat, en 16 parts (#1476), sur push vers
#               main ou release/**, sur une PR de release, à la main
#               (workflow_dispatch, hors tête de PR ouverte, #1635), sur
#               l'appel du portier de paquet (workflow_call) et sur une
#               demande de gel #1343 (`ci-lot-<sha>`/`ci-full-<sha>`, parcours
#               PR).
# #3749 — règle owner du 26/10 (canon home#184) : suite complète en 10 min de
# mur au plus. La suite entière tournait deux fois (16 psql + 8 psycopg,
# ≈ 800 min de job par suite) ; elle ne tourne plus qu'avec psycopg, et la
# suite psql entière passe de nuit : .github/workflows/psql-nocturne.yml
# appelle ce workflow (workflow_call) avec l'entrée `psql-full` — psql sur
# tous les modules, aucune part psycopg (déjà passée sur chaque poussée de
# main). Le nocturne n'est jamais le check requis d'une PR.
# #1476 : 16 psql + 8 psycopg = 24 jobs, la taille du pool de #1468 ; le
# découpage suit les durées mesurées (scripts/test-plan.py, PARTS), jamais ce
# fichier (rééquilibrage : #3754).
# #3754 — chaque part psql/psycopg tourne en deux processus de test
# (`--parallel 2`), chacun son schéma : les runners auto-hébergés offrent
# 16 vCPU pour 8 jobs, une part série n'occupait qu'un cœur. La charge mesurée
# de la part peut relever ce nombre jusqu'à 4 (cible ~450 s de tests par
# processus) : les parts lourdes prennent plus de cœurs, pas plus de temps.
# #3945 — sans dépasser la part de l'hôte, vCPU // AMEESH_CI_JOBS_PER_HOST :
# 73 processus et 24 Postgres sur 48 vCPU ont rendu main rouge cinq runs de
# suite, un test de timing différent à chaque fois.
# Le découpage se fait par classe (son setUpClass reste dans un processus),
# sauf une classe de plus de 5 min découpée en tests pour isoler un test lent ;
# il est pondéré par les durées par test mesurées de tests/parts/durees.json ;
# le flux des tests est fusionné en un seul, avec un `debut`, un `impacted` et
# un `fin`. La mesure (`carte.yml`) reste série.
# Le job final « tests » agrège les parts : c'est le nom de vérification stable
# hors lancement manuel, qui publie « tests (dispatch) » (#1635).
#
# §12 — une tête de paquet ne lance qu'une seule suite complète. Le run
# `pull_request` de sa PR porte le check requis `tests` ; le portier
# `.github/workflows/paquet.yml`, déclenché par `push integration/**`, n'appelle
# cette suite (`workflow_call`) que si aucune PR ouverte ne couvre la tête
# exacte, et son check n'est jamais nommé `tests` (incident #1342 : deux suites
# complètes, l'agrégat rouge du run push annulé bloquait la PR #1050).
#
# L1211 — canon §3 : une branche de lot ne lance que les tests impactés, plus
# toujours les tests de contrat (tests/parts/toujours.txt : droits, rôles,
# migrations, objets globaux du cluster), avec repli sur la suite complète
# quand la sélection ne peut pas décider (scripts/test-plan.py, lot_selection).
# La suite complète tourne sur main, release/** et pour la branche d'intégration
# du paquet (§12) par le run `pull_request` de sa PR ou, à défaut de PR couvrant
# la tête, par le portier `paquet.yml` : une PR de lot n'en déclenche plus, mais
# une PR de release (source ou cible release/** ou integration/**) garde la
# suite complète (psycopg entier, psql pilote + contrat, #3749), sans voie
# version/doc ni sélection d'un lot — y compris dans le plan de repli. Les règles de refusion (a : delta de main
# disjoint, b : migrations seules) viendront ensuite.
#
# #1343 — canon §3 (bureau home 66, owner 14/10 21:45) : sur ameesh, la
# relecture passe avant la CI. Une poussée sur une PR de lot ne lance plus
# rien ; la CI d'un lot (impactés + contrat, voie `mode=lot` du plan) ne tourne
# qu'une fois, sur la tête gelée, quand les verdicts requis sont acquis.
# `ameesh ci run <lot>` (src/ameesh/ci.py) porte ce déclencheur : gel présent,
# branche distante et tête de PR au SHA gelé, verdict `ok` sur ce SHA (sauf lot
# léger), puis pose d'une étiquette `ci-lot-<40hex>` / `ci-full-<40hex>` sur la
# PR — `pull_request` `types: [labeled]` (un `workflow_dispatch` ne satisfait
# pas un check requis de PR). Le job `plan` compare exactement le SHA de
# l'étiquette à `pull_request.head.sha`, vérifie que le checkout est le
# merge-ref composé de la pointe cible figée dans la description de l'étiquette
# et de cette tête (ses deux parents), puis sélectionne contre cette base.
# #2328 : `pull_request.base.sha` peut rester périmé après un mouvement de main.
# Une étiquette étrangère, un SHA qui ne nomme pas la tête, une composition
# qui a bougé ou un `ci-lot` sur
# `release/**`/`integration/**` font rougir le check requis sans exécuter de
# tests. Aucune voie version seule ou documentation seule : sur la tête gelée,
# un check `tests` vert veut dire que des tests ont tourné. Exceptions
# (canon) : un lot qui débloque la CI ou corrige un incident demande sa CI en
# parallèle de sa relecture (`--exception incident|unblock --reason …`), le
# motif et la marque restant dans la trace du lot. La commande est seule à
# retirer/reposer son étiquette (nouvelle demande admissible, ou reprise
# explicite d'un terminal rouge/annulé) ; une étiquette posée à la main
# demande de vrais tests, elle ne prouve ni gel ni avis. Un run devenu périmé
# (autre SHA, autre composition) est annulé par `ameesh ci run` ou `ameesh ci
# cancel <lot>`, jamais le run de la composition gelée.
#
# L157 — une PR de lot qui ne change QUE le numéro de version (pyproject.toml
# seul, la seule ligne `version = "…"`) ne relance pas la suite : `main` l'a
# déjà validée pour ce contenu. Le job « changements » le détecte
# (scripts/version-only.py) ; les parts sont alors sautées et « tests » reste
# vert. Au moindre doute, la suite tourne ; jamais sur un push, à la main, ni
# sur une PR de release.
#
# L161a — même chose pour une PR de lot de documentation seule (docs/, site/,
# *.md hors src/, tests/, .github/ et examples/) : seuls ses lecteurs déclarés
# (tests/parts/lecteurs-doc.txt) tournent, sans base, dans « lecteurs de la
# doc » ; une PR de release garde la suite complète. Une exécution de main en
# cours n'est jamais annulée par la suivante.
# #824 — décision owner signée #17605 du 13/10/2026 : un seul run de main
# reste en attente ; une fusion plus récente remplace ce run en attente et
# valide aussi les fusions intermédiaires qu'elle contient.
#
# #833 — le filtre s'applique aussi à une poussée vers main, sur le diff de
# toute la poussée (`github.event.before` → tête, jamais HEAD^1 seul). Une
# poussée vers release/** ou une histoire réécrite garde la suite complète.
#
# L161b — chaque part écrit ses résultats au fil de l'eau (--flow, JSON lignes,
# un test par ligne, schéma ameesh-test-event/1), publiés en artefact
# (flux-<pilote>-<part>) et résumés dans le résumé du job (scripts/ci-flow.py).
# Les modules de test touchés par les fichiers changés (--since HEAD^1 : la
# cible pour une PR, le commit précédent sur main) passent en premier dans
# chaque part. Rien n'est sauté sur main ; sur une branche de lot, le plan
# décide (L1211).
#
# L161f — the `plan` job reads the measured map (cache `carte-<sha>`, written
# by .github/workflows/carte.yml) once for the whole run and writes plan.json
# (scripts/test-plan.py): the class of every module (P0 changed test, P1
# impacted by changed blocks, files or tables, P2 recent failure, P3 the
# rest), the parts and their modules. Every part runs from that same plan
# (`--plan`), impacted first; the matrices come from the plan (fromJSON), and
# a driver with no part is skipped. On a lot branch (L1211), only the impacted
# modules and the contract list run; the rest of the suite runs on main,
# release/** and the package integration branch, and any doubt (no map, stale
# or unsure selection, changed lines without a test, test infrastructure)
# falls back to the full suite. Map missing, stale or unusable: the L161b
# order, full suite. The `bilan` job (never required) counts the leaks
# (failures of modules the map did not select) and the provisional green (P0
# and P1 green in every part), kept as the `leaks` artifact for the two-week
# review (L161i).
#
# L161c — pendant la part, `ci-flow.py publish` (arrière-plan) tient le check
# run « tests (flux) <part> » de la tête poussée : chaque échec y entre dès
# qu'il est écrit. `ameesh notify` le relève et l'envoie aussitôt à l'agent du
# lot (ameesh.ci). D'où `checks: write` sur les parts ; sans ce droit (PR d'une
# fourche), rien n'est publié et la part n'en est pas affectée.
#
# #748 — à la release (branche `release/**`, ou PR dont la tête ou la base
# l'est) et à la main, les parts psycopg sont rejouées une fois sur l'autre
# classe de système de fichiers que celle du défaut du runner (tmpfs ↔ disque,
# lue à l'exécution) : un test qui ne tient que sur la classe ordinaire
# (horodatages, renommage entre périphériques, inodes, blocs) se révèle là. Le
# job « autre système de fichiers » est alors exigé par le check agrégé.
#
# #856 — un runner arrêté (saturation #747) tue le publisher et l'étape
# `close` : le check restait `in_progress` pour toujours. Le job `tests`
# (indépendant des publishers) conclut les orphelins en relisant l'état
# terminal réel du job et de l'exécution (`ci-flow.py sweep`, par
# l'`external_id` du check #1393, sinon par le `details_url` ou, à défaut, par
# le `check_suite`) : `cancelled`, jamais `success` sans ligne `fin`, et aucun
# check actif n'est touché. D'où `actions: read` et `checks: write` sur le job
# `tests`. #1393 : le balayage est borné (`timeout 120`, `--max-duration 100`)
# sous le plafond de 5 min du job — il ne change jamais le verdict requis.
#
# #3251 — décision owner #128512 (23/10, option a) : un agrégat requis jamais
# conclu est une preuve absente (bloquant, run relancé une fois, #3186) ; les
# non-concluants **à l'intérieur** d'un agrégat qui a conclu restent non
# bloquants (canon §3). L'étape « bilan des parts » classe donc chaque job
# interne (scripts/ci-agregat.py) : un échec prouvé rougit `tests` ; une
# annulation d'une part **non requise** (macOS, autre système de fichiers) ne
# le rougit pas et publie le check de détail `tests (bilan des parts)` en
# `neutral`, que fire et radar consignent (#3209) sans retenir paquet ni
# release. #3449 : une part **Linux planifiée** (psycopg, psql) annulée,
# expirée, absente ou en échec rougit `tests`, même si les 15 autres ont
# réussi (15/16) — macOS vert ne prouve pas la suite Linux (run
# 40144843565, h-13). Seuls macOS et « autre système de fichiers » restent
# des non-concluants consignés. #940 reste fermé : si
# l'annulation ne peut pas être consignée, l'étape échoue et `tests` reste
# rouge — jamais de SUCCESS muet.
name: tests

# #1343 : le titre du run porte la demande de gel — PR, étiquette (mode et SHA
# complet) et pointe cible demandée — pour que la commande et la preuve de fusion
# puissent la relire ; une poussée garde le nom de sa branche.
run-name: "tests${{ github.event_name == 'pull_request' && format(' [PR #{0} {1} base {2}]', github.event.pull_request.number, github.event.label.name, github.event.label.description) || (github.event_name == 'push' && format(' [{0}]', github.ref_name) || '') }}"

on:
  # §12 : une poussée sur integration/** ne déclenche plus cette suite
  # directement. Le portier .github/workflows/paquet.yml décide — une tête de
  # paquet n'a qu'une suite, celle de sa PR — et rappelle cette suite
  # (workflow_call) quand aucune PR ouverte ne couvre la tête poussée.
  push:
    branches: [main, "release/**"]
  # #1343 (canon §3, bureau home 66) : une poussée sur une PR de LOT ne lance
  # plus rien. La CI d'un lot part au gel, quand les verdicts requis sont
  # acquis : `ameesh ci run <lot>` pose sur la PR l'étiquette
  # `ci-lot-<40hex>` / `ci-full-<40hex>`, seul déclencheur du parcours PR. Une
  # étiquette étrangère (ni l'une ni l'autre) réveille le workflow mais le job
  # `plan` la refuse : le check requis rougit sans exécuter de tests. Une PR de
  # release (source ou cible release/** ou integration/**) passe aussi par sa
  # demande `ci-full-<sha>` ; les poussées vers integration/** restent portées
  # par le portier de paquet (§12, #1410), pas par ce déclencheur.
  pull_request:
    types: [labeled]
    branches: [main, "release/**", "integration/**"]
  workflow_call:
    inputs:
      # #3749 : le nocturne psql (psql-nocturne.yml) — psql sur toute la
      # suite, aucune part psycopg. Absent (portier de paquet) : faux.
      psql-full:
        type: boolean
        default: false
        description: suite psql complète, sans part psycopg (nocturne, #3749)
  workflow_dispatch:

# Une PR dépassée est annulée, mais la concurrency d'une étiquette ÉTRANGÈRE
# est distincte de celle d'une demande de gel (#1343) : ajouter une étiquette
# quelconque ne doit pas annuler un run gelé valide. Les pushes de main
# partagent un groupe : GitHub garde un run en cours et un seul en attente,
# remplacé par le suivant. Release et poussées gardent un groupe par exécution
# (périmètre gelé). `ameesh ci run` annule lui-même les runs périmés d'une
# autre composition avant de reposer son étiquette, jamais celui de la
# composition courante.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.label.name) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # L161b : commit poussé (tête de la PR), à côté du commit de fusion testé
  AMEESH_CI_TETE: ${{ github.event.pull_request.head.sha || github.sha }}
  AMEESH_TEST_DSN: postgresql://ameesh@127.0.0.1:5432/ameesh
  PGPASSWORD: ameesh-ci
  AMEESH_REQUIRE_DB: "1"
  AMEESH_BALANCE_INTERVAL: "0"
  PYTHONPATH: src
  # #3945 : runners par hôte auto-hébergé (8 sur ameesh-ci-1..3) ; une part
  # prend au plus vCPU // ce nombre de processus (scripts/test-parts.py,
  # host_cap). Réglable sans PR par la variable du dépôt ; une fourche
  # (ubuntu-latest, un job par machine) en a un seul.
  AMEESH_CI_JOBS_PER_HOST: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.AMEESH_CI_JOBS_PER_HOST || '8') || '1' }}

# Linux jobs run on the self-hosted ameesh-ci runners (one persistent host,
# four runners): GitHub's free tier caps hosted jobs at 20 for the whole
# organisation. A pull request from a fork never reaches that host (the
# repository is public: its code would run on a shared, persistent machine);
# it stays on ubuntu-latest, like the macOS job and the Pages deployment.
#
# #1468 — priority pool. A few runners (label `ameesh-ci-prio`) are kept for
# package and release runs and for the lots marked unblock/incident: they do
# NOT carry `ameesh-ci`, so an ordinary job (which asks for `ameesh-ci`) can
# never take them — adding a label while keeping `ameesh-ci` would reserve
# nothing. Every runner, general or reserved, carries `ameesh-ci-pool`; a
# priority job asks for it, so it takes the first idle runner of either group.
# A run is priority when the switch `vars.AMEESH_CI_PRIO` is `on` and it is a
# push (or the package gate's workflow_call) on integration/** or release/**,
# a PR whose source or target is one of those branches, or a PR listed in
# `vars.AMEESH_CI_PRIO_PRS` (JSON array of PR numbers: a repository variable,
# writable with repository write access, set by the pilot for an unblock or
# incident lot and recorded with its before/after value; setting it triggers
# no run). Switch off or unset: every job
# asks for `ameesh-ci`, as before. The routing only picks the runner: no
# `if:`, no part, no required check depends on it, and no hosted runner is
# ever added (a fork PR keeps ubuntu-latest, as before). The job-level
# expression is the same everywhere (tests/test_1468_ci_prio.py), sauf
# `bilan` qui porte en plus le repli prêté de #1256 ci-dessous ;
# docs/EXPLOITATION.md, « Runners prioritaires », gives the activation and
# rollback steps; scripts/ci-queue-wait.py measures the queue wait per class.
#
# Borrowed capacity (lot #1256, option A of the R2 B1 arbitration): a lending
# host runs SINGLE-USE runners under the DISTINCT label `ameesh-lent`, never
# `ameesh-ci`, so no job of the fleet — in particular the required check
# `tests` and everything it needs — can land there. Only a job that is not
# the required check, is not needed by it, holds no write permission and
# feeds nothing the required path reads may target that label; the admissible
# list and the residual risk are in deploy/guest/PILOT-ci-nexlink.md §3.
# `vars.AMEESH_LENT_RUNS_ON` is set to `["self-hosted","linux","ameesh-lent"]`
# only while a loan is armed (a single-use configuration deposited and the
# slot armed); unset, the job stays on the fleet. The one job routed below
# (`bilan`, after the priority pool of #1468) is `continue-on-error` and is
# NOT in the `needs` of `tests`.
jobs:
  # L157, L161a, L161f : nature of the change (version or documentation only,
  # lot PR only; merge commit against its target), the branch context
  # (release PRs keep the full suite) and the plan of the run, from the map
  plan:
    name: plan
    # #3198 : l'étiquette `ci-macos` (suite complète macOS dans macos.yml) est
    # un évènement `labeled` comme un gel. Elle doit laisser ce workflow
    # entièrement silencieux : sans cette garde, la porte de gel refuserait
    # l'étiquette étrangère et le check requis `tests` rougirait sur une PR
    # par ailleurs verte. Tous les jobs la portent ; le job `tests` change en
    # plus de nom, pour ne jamais publier le contexte requis sans tests.
    if: github.event.label.name != 'ci-macos'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # #1635 : dispatch-guard.py lit les PR ouvertes
    permissions:
      contents: read
      pull-requests: read
    env:
      # #833 : sur une poussée, le diff va du commit d'avant la poussée
      # (`github.event.before`; vide hors push) à la tête, pas seulement HEAD^1.
      # La référence distingue main (filtre doc) des branches release (suite
      # complète, quel que soit le contenu).
      # #2328 : la commande fige la pointe cible actuelle dans la description
      # de l'étiquette ; pulls.base.sha peut être périmé. Sans description,
      # la porte refuse (pas de repli sur la base périmée ou sur HEAD^1).
      AMEESH_CI_BASE: ${{ github.event_name == 'pull_request' && github.event.label.description || (github.event_name == 'push' && github.event.before || 'HEAD^1') }}
      AMEESH_CI_REF: ${{ github.ref }}
      # la tête demandée par l'étiquette (payload), tracée et comparée
      AMEESH_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      AMEESH_CI_LABEL: ${{ github.event.label.name }}
    outputs:
      client_types: ${{ steps.client_types.outcome }}
      version_only: ${{ steps.plan.outputs.version_only }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      doc_readers: ${{ steps.plan.outputs.doc_readers }}
      code: ${{ steps.plan.outputs.code }}
      psycopg: ${{ steps.plan.outputs.psycopg }}
      psycopg_parts: ${{ steps.plan.outputs.psycopg_parts }}
      psql: ${{ steps.plan.outputs.psql }}
      psql_parts: ${{ steps.plan.outputs.psql_parts }}
      release: ${{ steps.release.outputs.release }}
      # the digest of the uploaded plan.json, read by every required consumer
      # before it runs a part: the run's runtime token also serves the
      # artifact API, so a job of the borrowed label could delete and replace
      # this artifact before a "re-run failed jobs" (R1 Claude B4, #1256).
      # A job output is written by this job alone and cannot be rewritten by
      # another one, so it is the reference the parts check against.
      plan_sha256: ${{ steps.plan_digest.outputs.sha256 }}
      # #1343 : mode, tête et base de la demande de gel, relus par la commande
      # et la preuve de fusion.
      mode: ${{ steps.gel.outputs.mode }}
      sha: ${{ steps.gel.outputs.sha }}
      # #4543 : `base` est la base demandée (description de l'étiquette) ;
      # `plan_base` est la base de la composition réellement extraite, celle
      # que le plan diff et lit. Les deux restent tracées, la carte se lit sur
      # la seconde.
      base: ${{ steps.gel.outputs.base }}
      plan_base: ${{ steps.gel.outputs.plan_base }}
    steps:
      # #1635 : un lancement à la main publie le check requis `tests` sur le
      # commit lancé (check lié au commit, pas à l'évènement) ; sur la tête
      # d'une PR ouverte, il satisferait le check de cette PR sans merge-ref ni
      # porte de gel. La référence est contrôlée avant tout checkout (main,
      # release/**, integration/**, validation/**), puis
      # scripts/dispatch-guard.py refuse un commit qui est la tête d'une PR
      # ouverte. Un refus fait échouer `plan` : `tests` rougit sans tests. La
      # référence passe par l'environnement, jamais interpolée (#1237).
      - name: lancement à la main (main, release/**, integration/**, validation/** — #1635)
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          case "$DISPATCH_REF" in
            refs/heads/main|refs/heads/release/?*|refs/heads/integration/?*|refs/heads/validation/?*)
              echo "workflow_dispatch on $DISPATCH_REF: branch admitted" ;;
            *)
              echo "::error::workflow_dispatch on '$DISPATCH_REF': only main, release/**, integration/** and validation/** may be run by hand (#1635); a lot branch gets its CI through its pull request, nothing run"
              exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the map commit, and whether it is an ancestor
      # #1343 : la demande de gel est une étiquette `ci-lot-<40hex>` ou
      # `ci-full-<40hex>` posée sur la PR par `ameesh ci run`. La porte vérifie,
      # avant tout plan et sans exécuter un test : l'étiquette (motif exact,
      # SHA complet), l'égalité exacte avec `pull_request.head.sha`, le mode
      # imposé par les refs (`release/**`/`integration/**` → full), et que le
      # checkout est bien le merge-ref de cette tête, composé de la base de
      # l'étiquette ou d'une pointe qui n'en diffère que par des atterrissages
      # de coupure (#4533, canon §12). Toute autre étiquette est refusée : le
      # check requis rougit, rien ne tourne.
      - name: gel (étiquette ci-lot/ci-full sur la tête gelée — #1343)
        id: gel
        if: github.event_name == 'pull_request'
        # #1237 (N1 de #1211) : un nom de branche est choisi par l'auteur de la
        # PR ; il passe par l'environnement et reste cité, jamais interpolé
        # dans le script.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          label="$AMEESH_CI_LABEL"
          if ! printf '%s' "$label" | grep -Eq '^ci-(lot|full)-[0-9a-f]{40}$'; then
            echo "::error::label '$label' is not a freeze request (ci-lot-<40 hex> or ci-full-<40 hex>): foreign label, nothing run"
            exit 1
          fi
          mode="$(printf '%s' "$label" | sed -E 's/^ci-(lot|full)-.*$/\1/')"
          sha="${label##*-}"
          head="$AMEESH_CI_HEAD"
          if [ "$sha" != "$head" ]; then
            echo "::error::label '$label' names $sha, the pull request head is $head: the freeze does not cover this head, nothing run"
            exit 1
          fi
          base="$AMEESH_CI_BASE"
          case "$base" in
            *[!0-9a-f]*) echo "::error::unusable requested base: '$base' (label description: full 40-hex expected)"; exit 1 ;;
          esac
          if [ "${#base}" != 40 ]; then
            echo "::error::unusable requested base: '$base' (${#base} characters, label description: full 40-hex expected)"
            exit 1
          fi
          release=0
          case "$HEAD_REF" in release/*|integration/*) release=1 ;; esac
          case "$BASE_REF" in release/*|integration/*) release=1 ;; esac
          if [ "$release" = 1 ] && [ "$mode" != "full" ]; then
            echo "::error::source or target release/** or integration/** requires ci-full-<sha> (--full): a lot request never covers a release, nothing run"
            exit 1
          fi
          parents="$(git rev-list --parents -n 1 HEAD)"
          if [ "$(printf '%s' "$parents" | wc -w)" != 3 ]; then
            echo "::error::HEAD is not the pull request merge-ref (a merge commit): the composition cannot be checked, nothing run"
            exit 1
          fi
          p1="$(git rev-parse HEAD^1)"
          p2="$(git rev-parse HEAD^2)"
          if [ "$p2" != "$head" ]; then
            echo "::error::the merge-ref head is $p2, the label names $head: the composition moved, refreeze the request, nothing run"
            exit 1
          fi
          # #4533 (canon §12, manaty/home#173) : la pointe demandée peut être en
          # avance sur la référence de fusion (GitHub la calcule en asynchrone),
          # ou en retard ; un delta de cible fait **seulement** d'atterrissages
          # de coupure (message de release, ligne de version de pyproject.toml
          # et notes docs/versions/*.md) ne change pas le contenu testé. La
          # ci-full d'un paquet composé avant la coupure reste valide : le plan
          # part de la base réelle du merge-ref, jamais d'une base non testée.
          # Tout autre delta reste refusé.
          cutoff_commit() {
            local sha="$1" line parent names name
            git log -1 --format=%B "$sha" | grep -q 'ameesh-release:' || return 1
            line="$(git rev-list --parents -n 1 "$sha")" || return 1
            set -- $line
            [ "$#" -ge 2 ] || return 1
            parent="$2"
            names="$(git diff --name-only --no-renames "$parent" "$sha")" || return 1
            [ -n "$names" ] || return 1
            for name in $names; do
              case "$name" in
                docs/versions/*.md) ;;
                pyproject.toml)
                  git diff -U0 "$parent" "$sha" -- pyproject.toml | awk '
                    /^(\+\+\+|---)/ { next }
                    /^\+/ { add++; if ($0 !~ /^[+]version = "[^"]+"[[:space:]]*$/) bad = 1 }
                    /^-/  { del++; if ($0 !~ /^-version = "[^"]+"[[:space:]]*$/) bad = 1 }
                    END { exit !(add == 1 && del == 1 && !bad) }' || return 1
                  ;;
                *) return 1 ;;
              esac
            done
            return 0
          }
          cutoff_landing_only() {
            local old="$1" new="$2" range commits commit
            if git merge-base --is-ancestor "$old" "$new"; then
              range="$old..$new"
            elif git merge-base --is-ancestor "$new" "$old"; then
              range="$new..$old"
            else
              return 1
            fi
            commits="$(git rev-list --reverse "$range")" || return 1
            [ -n "$commits" ] || return 1
            for commit in $commits; do
              cutoff_commit "$commit" || return 1
            done
            return 0
          }
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # fetch-depth: 0 couvre les branches au checkout ; une pointe vue
            # après coup peut manquer : on la lit avant de conclure.
            git fetch --quiet --no-tags origin "$base" || {
              echo "::error::requested base $base is not readable in the checkout: the composition cannot be checked, nothing run"
              exit 1
            }
          fi
          plan_base="$p1"
          if [ "$p1" != "$base" ]; then
            if cutoff_landing_only "$p1" "$base"; then
              echo "composition: merge-ref base $p1, requested base $base: only cutoff landing commit(s) (version and notes) separate them, the tested content is unchanged; the plan runs against $p1"
            else
              echo "::error::the merge-ref base is $p1, the requested base is $base: the composition moved, request CI again, nothing run"
              exit 1
            fi
          fi
          # #4543 : les deux bases sont tracées — celle de l'étiquette (la
          # demande) et celle de la composition réellement extraite (le plan,
          # la carte). Une seule ligne pour la même course.
          echo "freeze request: mode=$mode sha=$sha base=$base plan_base=$plan_base head=$head label=$label"
          {
            echo "mode=$mode"
            echo "sha=$sha"
            echo "base=$base"
            echo "plan_base=$plan_base"
          } >> "$GITHUB_OUTPUT"
          {
            echo "AMEESH_CI_MODE=$mode"
            echo "AMEESH_CI_GEL=$sha"
            # le plan sélectionne contre la composition réellement extraite,
            # pas contre une pointe que le merge-ref n'a pas encore intégrée.
            echo "AMEESH_CI_BASE=$plan_base"
          } >> "$GITHUB_ENV"
      # une poussée garde le plan automatique (L1211, L161a) : impactés +
      # contrat sur une branche de lot, suite complète sur main/release.
      - name: poussée (plan automatique)
        if: github.event_name != 'pull_request'
        run: echo "AMEESH_CI_MODE=auto" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # #4521 (revue cx2, B/P2 ; B/P1 auditeur) : la garde des alias
      # `sys.modules` tourne aussi en CI, sur l'arbre testé, dans `plan` dont
      # l'échec rougit l'agrégat requis `tests`. Le canon `manaty/home` est
      # privé, donc illisible depuis un runner : l'étape lit la politique
      # épinglée `scripts/alias-review-classes.json`, générée depuis le canon
      # audité et vérifiée au gel contre le canon de l'hôte
      # (`--check-policy`). Un chemin absent, une classe inconnue ou une
      # politique illisible refusent (code 2) ; un alias dont l'implémentation
      # est plus légère que son ancien chemin refuse la CI (code 1). Jamais de
      # vert muet.
      - name: garde alias/classe (#4521)
        run: python3 scripts/garde-alias-classe.py --root . --project ameesh --policy scripts/alias-review-classes.json
      - name: lancement à la main sur la tête d'une PR ouverte (#1635)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dispatch-guard.py
      # #4036 : `ui` n'est pas requis. Cette vérification du contrat client
      # passe donc dans plan, dont l'échec rougit l'agrégat requis `tests`.
      # Avant les parts, sans build UI ni scripts d'installation npm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: dépendances du générateur de types clients
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: types clients à jour
        id: client_types
        run: node ui/scripts/gen-api.mjs --check
      # the most recent map of main (a PR reads the caches of its base branch)
      # #4543 : la clé suit la base du plan (`plan_base`), pas la base
      # demandée : la carte doit être celle du commit que le plan diff, sinon
      # la trace du run porte une base et la sélection en lit une autre.
      - uses: actions/cache/restore@v4
        with:
          path: carte/carte.json.gz
          key: carte-${{ steps.gel.outputs.plan_base || github.event.before || github.sha }}
          restore-keys: carte-
      - id: plan
        name: plan of the run
        # #1237 (N1 of #1211): a branch name travels through the environment,
        # never interpolated into the script — the merge gate does not run a
        # `$(…)` written in a ref.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          # #3749 : vide hors appel du nocturne (push, PR, dispatch, portier)
          PSQL_FULL: ${{ inputs.psql-full }}
        run: |
          python3 scripts/test-plan.py plan --out plan.json --map carte/carte.json.gz \
            --event "${{ github.event_name }}" \
            --base "$AMEESH_CI_BASE" --ref "$AMEESH_CI_REF" \
            --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --mode "$AMEESH_CI_MODE" \
            --psql-full "$PSQL_FULL" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" --annotations
      - id: release
        name: release lane of the run
        # #748 : la suite sur l'autre classe de système de fichiers ne se rejoue
        # que pour une release (source ou cible `release/**`) ou à la main ; le
        # nom de branche voyage par l'environnement (L1237) et n'est jamais
        # interpolé dans le script.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          release=false
          case "$BASE_REF" in release/*) release=true ;; esac
          case "$HEAD_REF" in release/*) release=true ;; esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - id: plan_digest
        name: empreinte du plan (canal artefacts, #1256 B4)
        run: echo "sha256=$(sha256sum plan.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 3

  psycopg:
    name: psycopg ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
    needs: plan
    if: needs.plan.outputs.psycopg != '[]' && github.event.label.name != 'ci-macos'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    # #2292 : à 4 parts, 14,3-30,5 min sous saturation sur les cinq derniers
    # paquets, et les parts 4/4 de h-1800 puis 1/4 de h-1900 ont été coupées à
    # 30 min sans test en échec. La suite complète passe à 6 parts ; le plafond
    # est relevé à 45 min (30,5 mesuré + marge, aligné sur « autre système de
    # fichiers ») et reste tenu par le contrat test_899.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.psycopg) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]  # host port chosen by docker: several runners share the host
        # base jetable : données en mémoire
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    permissions:
      contents: read
      checks: write  # L161c : check run « tests (flux) »
    env:
      AMEESH_DRIVER: psycopg
      FLUX_NOM: tests (flux) psycopg ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
      # #899 : le plafond du job, tenu à timeout-minutes (contrat test_899) ;
      # 45 depuis #2292 (4 parts coupées à 30 min sur h-1800/h-1900).
      AMEESH_PLAFOND_MIN: "45"
    steps:
      - &debut
        name: début du job (mesure du plafond, #899)
        run: echo "AMEESH_JOB_DEBUT=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      # #3581 : le témoin du pont JS (#3529) appelle `node`, absent du PATH de
      # certains runners du pool (FileNotFoundError node, psql 7/16 et psycopg
      # 3/8). Le correctif de paquet 6fdfefdde faisait sauter le témoin quand
      # node manque : le pont n'était alors plus vérifié, un non-concluant
      # silencieux (§3). Node 22 — la majeure des workflows Nexlink qui portent
      # ce pont, et de ui.yml — est provisionné par job sur le runner (cache
      # d'outils d'actions/setup-node, aucun geste root sur la VM), puis la
      # vérification de démarrage refuse la part si ce node n'est pas dans le
      # PATH ou n'est pas en 22. Les ancres `&node_bridge`/`&node_witness` sont
      # reprises telles quelles par psql et fs-class : une seule déclaration,
      # aucun job de la suite ne peut oublier le pont.
      - &node_bridge
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - &node_witness
        name: node 22 du pont JS (lot 3581)
        run: |
          set -euo pipefail
          if ! node_path="$(command -v node)"; then
            echo "::error::node 22 requis par le pont JS (lot 3581) : aucun node dans le PATH de ce runner ; la suite ne tourne pas sans lui"
            exit 1
          fi
          version="$("$node_path" --version)"
          case "$version" in
            v22.*) echo "node $version ($node_path) : pont JS disponible" ;;
            *)
              echo "::error::node 22 requis par le pont JS (lot 3581) : ce runner porte '$version' ; la suite ne tourne pas sans lui"
              exit 1 ;;
          esac
      - &dsn
        name: port de la base jetable
        run: echo "AMEESH_TEST_DSN=postgresql://ameesh@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ameesh" >> "$GITHUB_ENV"
      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # environnement Python en cache : la clé suit pyproject.toml et le runner
      # qui l'a construit (#932 — un venv de runner auto-hébergé porte un lien
      # absolu vers /home/runner/r<X>/_work/_tool/Python/... : la clé par
      # `runner.name` empêche un runner de restaurer le venv d'un autre ; les
      # runners hébergés, au cache commun /opt/hostedtoolcache et au nom
      # variable (« GitHub Actions N »), partagent la clé `hosted`, #1294).
      #
      # #1293 : la clé primaire est celle du run, donc unique ; la
      # restauration passe par les clés partielles (`restore-keys`). Un venv
      # restauré invalide est reconstruit **puis resauvé sous une clé neuve**
      # (étape suivante) : `actions/cache` ne resauve pas sous une clé
      # identique, si bien qu'un venv devenu invalide était reconstruit à
      # chaque exécution sur ce runner.
      - id: venv
        uses: actions/cache/restore@v4
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-cov-${{ hashFiles('pyproject.toml') }}-run${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-cov-${{ hashFiles('pyproject.toml') }}-
      # Le contrôle vaut aussi pour un cache de même runner devenu périmé (outil
      # Python déplacé) : un venv restauré n'est utilisé que s'il sait encore
      # importer ses dépendances, sinon il est reconstruit (#932, #1293).
      # `coverage` est la dépendance des témoins de `scripts/map.py` : sans elle,
      # les cas qui lisent un vrai fichier de couverture seraient sautés (le
      # pilote psql ne l'installe pas, d'où le saut là-bas). La clé de cache
      # ci-dessus porte `-cov-` : un venv en cache sans coverage ne doit pas
      # être réutilisé pour ces témoins (#1257).
      #
      # #1958 : cette étape est l'unique source de la liste pour les deux jobs
      # qui partagent ce venv, psycopg et fs-class. L'ancre `&deps_venv` est
      # reprise telle quelle par fs-class : installation et contrôle d'import
      # ne peuvent plus diverger de la clé partagée.
      - id: deps
        name: dépendances (pilote psycopg)
        run: &deps_venv |
          # Les deux besoins du venv : `coverage` pour les témoins de
          # scripts/map.py (#1257), `yaml` pour la CI pyyaml (#1511).
          # #2907 : un cache importable peut encore contenir psycopg 3.1.
          if .venv-ci/bin/python -c 'import psycopg, cryptography, psutil, coverage, yaml; raise SystemExit(tuple(map(int, psycopg.__version__.split(".")[:2])) < (3, 2))' >/dev/null 2>&1; then
            echo "venv restauré du cache : valide"
          else
            rm -rf .venv-ci
            python -m venv .venv-ci
            .venv-ci/bin/pip install 'psycopg[binary]>=3.2' 'cryptography>=41' 'psutil>=5.9' 'coverage>=7.10' 'pyyaml>=6'
            echo "reconstruit=1" >> "$GITHUB_OUTPUT"
          fi
      # #1293 : le venv reconstruit est sauvé sous la clé du run, que la
      # prochaine exécution retrouve par `restore-keys`. Un sauvetage refusé
      # (quota, course entre parts) ne fait pas rougir la part : la
      # reconstruction reste correcte, seule la prochaine exécution repaie.
      - if: steps.deps.outputs.reconstruit == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-cov-${{ hashFiles('pyproject.toml') }}-run${{ github.run_id }}-${{ github.run_attempt }}
      - &base
        name: base jetable (sans fsync) et client psql
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql "$AMEESH_TEST_DSN" -q -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - &pgdump17
        name: pg_dump 17 pour le gabarit (#3752)
        # #3752/#3754 : le serveur de la part est postgres:17, le client des
        # runners Ubuntu 24.04 est 16 ; `pg_dump 16` refuse un serveur 17 et le
        # gabarit se replie sur migrate() à chaque classe. Le paquet PGDG est
        # installé une fois par runner (les jobs suivants sautent l'étape) ;
        # les huit jobs d'un hôte se sérialisent sur les verrous apt.
        # #3754 (avis auditeur) : installation de confort, pas un verdict.
        # Sans client 17, tests/gabarit.py se replie sur migrate() ; un sudo à
        # mot de passe, une panne PGDG ou un verrou apt au-delà de 180 s ne
        # doit pas faire tomber la ci-full du paquet.
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -x /usr/lib/postgresql/17/bin/pg_dump ] \
             || pg_dump --version 2>/dev/null | grep -qE 'pg_dump \(PostgreSQL\) 17\.'; then
            echo "pg_dump 17 déjà présent"
            exit 0
          fi
          command -v curl >/dev/null || { sudo apt-get update -q; sudo apt-get install -y -q curl; }
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          for essai in 1 2 3 4 5; do
            sudo apt-get -o DPkg::Lock::Timeout=180 update -q && break
            sleep $((essai * 5))
          done
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y -q postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - &git
        name: identité git des tests (dépôts temporaires)
        run: |
          # own global config per job: runners sharing the host never race on ~/.gitconfig
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "ameesh ci"
          git config --global user.email "ci@ameesh.invalid"
          git config --global init.defaultBranch main
      - &plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}
      - &plan_empreinte
        name: le plan téléchargé est celui du plan (empreinte, #1256 B4)
        run: |
          # the run's runtime token also serves the artifact API, and a job of
          # the borrowed label runs after `plan`: it could delete this
          # artifact and publish a forged one before a "re-run failed jobs".
          # The digest comes from the plan job's own output, which no other
          # job can rewrite; a part that does not match runs nothing.
          echo "${{ needs.plan.outputs.plan_sha256 }}  $RUNNER_TEMP/plan.json" | sha256sum -c -
      - &publier
        name: publication du flux en direct (check run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nohup python3 scripts/ci-flow.py publish "$RUNNER_TEMP/flux.jsonl" --name "$FLUX_NOM"
          --plafond-min "$AMEESH_PLAFOND_MIN" --debut "$AMEESH_JOB_DEBUT"
          > "$RUNNER_TEMP/publier.log" 2>&1 &
      - name: part ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
        run: >-
          .venv-ci/bin/python scripts/test-parts.py run --plan "$RUNNER_TEMP/plan.json"
          --part ${{ matrix.part }} --driver psycopg --flow "$RUNNER_TEMP/flux.jsonl"
          --parallel 2
      - &fermer
        name: fin du check run du flux
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci-flow.py close "$RUNNER_TEMP/flux.jsonl" --name "$FLUX_NOM"
          cat "$RUNNER_TEMP/publier.log" 2>/dev/null || true
      - &resume
        name: résumé du flux
        if: always()
        run: python scripts/ci-flow.py summary "$RUNNER_TEMP/flux.jsonl" >> "$GITHUB_STEP_SUMMARY"
      - name: flux en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-psycopg-${{ matrix.part }}
          path: ${{ runner.temp }}/flux.jsonl
          if-no-files-found: ignore
          retention-days: 1  # read by bilan in the same run; 8 400 artifacts filled the org quota (13/10)

  psql:
    name: psql ${{ matrix.part }}/${{ needs.plan.outputs.psql_parts }}
    needs: plan
    if: needs.plan.outputs.psql != '[]' && github.event.label.name != 'ci-macos'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    # #880 : sur une PR, la part psql est une seule part « pilote » ; mesurée
    # 21,7-26,1 min au repos et 30,4-31,0 min sous saturation (8/8 runners),
    # elle était annulée par le plafond de 30 min sans échec de test (PR #640,
    # run 38381239685). 60 min laisse la marge sous charge (#1251 : 45 → 60) et
    # reste un plafond borné (§3 du processus de lot : aucun job ne retient un
    # runner des heures).
    # psycopg garde 30 min : ses parts tournent en 6-8 min, même à 3× plus lent
    # elles tiennent dans le plafond.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # sur une PR de lot (L1211) : les modules « pilote » parmi les
        # impactés et le contrat, plus la liste « always » déclenchée (#749) ;
        # une part, deux ou trois selon l'estimation (scripts/test-plan.py,
        # lot_part_count), trois au plus (#947 : sous saturation, une part
        # unique atteignait le plafond de 30 min) ; hors lot, la liste pilote
        # et tout le contrat en 16 parts (#1476, #3749) ; la suite entière
        # seulement au nocturne (psql-nocturne.yml).
        part: ${{ fromJSON(needs.plan.outputs.psql) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]  # host port chosen by docker: several runners share the host
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    permissions:
      contents: read
      checks: write  # L161c
    env:
      AMEESH_DRIVER: psql
      FLUX_NOM: tests (flux) psql ${{ matrix.part }}/${{ needs.plan.outputs.psql_parts }}
      # #899 : le plafond du job, tenu à timeout-minutes (contrat test_899) ;
      # 45 depuis #880, qui a relevé le plafond de la part psql sous saturation.
      AMEESH_PLAFOND_MIN: "60"
    steps:
      - *debut
      - uses: actions/checkout@v4
      - *node_bridge
      - *node_witness
      - *dsn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ManifestesTest (test_cluster, liste « toujours ») lit deploy/k8s avec
      # PyYAML : sans lui il est sauté, donc jamais vérifié en CI (#1511).
      # #3616 : test_3536_notify_nexlink exige l'extra `crypto` ; le job psql
      # n'a pas de .venv-ci, et sans cryptography la part 2/16 rougit (run
      # 40235900946). Les parts psycopg l'installent déjà dans leur venv.
      # #3581 : le pont JS de ce job utilise node 22, provisionné ci-dessus.
      - name: dépendances des parts psql (pyyaml, crypto)
        run: python -m pip install -q 'pyyaml>=6' 'cryptography>=41'
      - *base
      - *pgdump17
      - *git
      - *plan
      - *plan_empreinte
      - *publier
      - name: part ${{ matrix.part }}
        run: >-
          python scripts/test-parts.py run --plan "$RUNNER_TEMP/plan.json"
          --part ${{ matrix.part }} --driver psql --flow "$RUNNER_TEMP/flux.jsonl"
          --parallel 2
      - *fermer
      - *resume
      - name: flux en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-psql-${{ matrix.part }}
          path: ${{ runner.temp }}/flux.jsonl
          if-no-files-found: ignore
          retention-days: 1  # read by bilan in the same run; 8 400 artifacts filled the org quota (13/10)

  # #748 : la suite rejouée sur une AUTRE classe de système de fichiers que
  # celle du défaut du runner (tmpfs ↔ disque), à la release seulement. Un test
  # qui ne tient que sur la classe ordinaire (horodatages, renommage entre
  # périphériques, inodes, blocs, montage) se révèle ici, là où la suite
  # ordinaire ne le voit pas. La classe par défaut est lue à l'exécution
  # (`stat -f`), donc le job reste vrai si l'hôte change de défaut ; la racine
  # temporaire des tests (`TMPDIR`) est posée sur l'autre classe et vérifiée.
  # Une release dont la suite n'est pas verte sur les deux classes ne fusionne
  # pas (canon §3 : un test dépendant de l'environnement est bloquant).
  fs-class:
    name: autre système de fichiers ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
    needs: plan
    # #3749 : le nocturne psql lancé à la main n'a aucune part psycopg à rejouer
    if: >-
      needs.plan.outputs.code == 'true' &&
      needs.plan.outputs.psycopg != '[]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.ref_name, 'release/')) ||
       needs.plan.outputs.release == 'true') &&
      github.event.label.name != 'ci-macos'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.psycopg) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    permissions:
      contents: read
      checks: write  # L161c : check run « tests (flux) »
    env:
      AMEESH_DRIVER: psycopg
      FLUX_NOM: tests (flux) autre système de fichiers ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
      AMEESH_PLAFOND_MIN: "45"
    steps:
      - *debut
      - uses: actions/checkout@v4
      - *node_bridge
      - *node_witness
      - *dsn
      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # #1958 : même clé que le job psycopg — même runner, même Python, même
      # pyproject.toml, et la classe de `TMPDIR` (posée plus bas) ne change pas
      # le venv. Une clé distincte paierait deux constructions et laisserait le
      # contrôle de fs-class plus étroit que le contenu déposé par psycopg.
      - id: venv
        uses: actions/cache/restore@v4
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-cov-${{ hashFiles('pyproject.toml') }}-run${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-cov-${{ hashFiles('pyproject.toml') }}-
      # Le contrôle vaut aussi pour un cache de même runner devenu périmé (outil
      # Python déplacé) : un venv restauré n'est utilisé que s'il sait encore
      # importer ses dépendances, sinon il est reconstruit (#932, #1293).
      #
      # #1958 : ce contrôle et l'installation sont ceux du job psycopg (ancre
      # `&deps_venv`), pas une seconde liste. Le raccord #1511 (pyyaml) profite
      # ainsi aux deux jobs, et un contrôle plus étroit que le contenu de la
      # clé partagée ne peut plus faire reconstruire le venv de l'autre.
      - id: deps
        name: dépendances (pilote psycopg)
        run: *deps_venv
      # #1293 : le venv reconstruit est sauvé sous la clé du run, que la
      # prochaine exécution retrouve par `restore-keys`. Un sauvetage refusé
      # (quota, course entre parts) ne fait pas rougir la part : la
      # reconstruction reste correcte, seule la prochaine exécution repaie.
      - if: steps.deps.outputs.reconstruit == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-cov-${{ hashFiles('pyproject.toml') }}-run${{ github.run_id }}-${{ github.run_attempt }}
      - *base
      - *pgdump17
      - *git
      - *plan
      - *plan_empreinte
      - name: racine temporaire sur l'autre classe de système de fichiers
        run: |
          set -eu
          defaut=$(stat -f -c %T "${TMPDIR:-/tmp}")
          mini=$((1024 * 1024))            # 1 GiB libres, en KiB : de quoi loger la part
          racine=""; meilleur=0
          for candidat in "/dev/shm/ameesh-autre-fs-${GITHUB_RUN_ID}-${{ matrix.part }}" \
                          "${RUNNER_TEMP:?}/ameesh-autre-fs"; do
            mkdir -p "$candidat" 2>/dev/null || continue
            classe=$(stat -f -c %T "$candidat" 2>/dev/null || echo inconnu)
            libre=$(df -Pk "$candidat" 2>/dev/null | awk 'NR==2 {print $4}')
            [ "$classe" != "$defaut" ] && [ "$classe" != inconnu ] || continue
            [ "${libre:-0}" -ge "$mini" ] || continue
            if [ "$libre" -gt "$meilleur" ]; then racine="$candidat"; meilleur=$libre; fi
          done
          if [ -z "$racine" ]; then
            echo "::error::aucune autre classe de système de fichiers utilisable (défaut=$defaut) : /dev/shm et RUNNER_TEMP sont le même système, absents, ou sous 1 GiB libres"
            exit 1
          fi
          classe=$(stat -f -c %T "$racine")
          df -h "$racine" | tail -1
          echo "TMPDIR=$racine" >> "$GITHUB_ENV"
          echo "AMEESH_AUTRE_FS=$classe" >> "$GITHUB_ENV"
          echo "système de fichiers : défaut=$defaut, cette part=$classe ($racine)"
          {
            echo "### #748 — autre système de fichiers (part ${{ matrix.part }})"
            echo "- défaut du runner : \`$defaut\`"
            echo "- cette part : \`$classe\` (\`$racine\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - *publier
      - name: part ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
        run: >-
          .venv-ci/bin/python scripts/test-parts.py run --plan "$RUNNER_TEMP/plan.json"
          --part ${{ matrix.part }} --driver psycopg --flow "$RUNNER_TEMP/flux.jsonl"
      - *fermer
      - *resume
      - name: flux en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # hors du motif `flux-*` : le bilan (L161f) agrège ces flux-là, une
          # seconde part du même plan y fausserait le vert provisoire
          name: autre-fs-${{ matrix.part }}
          path: ${{ runner.temp }}/flux.jsonl
          if-no-files-found: ignore
          retention-days: 14
      # en dernier : `TMPDIR` reste posé sur l'autre classe pour les étapes
      # suivantes, et une action Node (artefact) écrirait dans une racine déjà
      # supprimée
      - name: ménage de la racine temporaire (hôte persistant)
        if: always()
        run: |
          case "${TMPDIR:-}" in
            /dev/shm/ameesh-autre-fs-*|*/ameesh-autre-fs) rm -rf -- "$TMPDIR" ;;
          esac

  # L63 : la couche plateforme (ameesh.platform) et son lint, sous macOS avec
  # psutil. Sous Linux, les parts psycopg passent par psutil et les parts psql
  # (sans psutil) par le repli /proc.
  # #3198 : ce job est COURT, sans base, borné à 20 min. La suite complète
  # sous macOS (8 parts psycopg, PostgreSQL installé dans une étape) vivait
  # ici et durait jusqu'à 3 h 50 (runs 39934625577, 39919541641, 39895964473) :
  # `fire.ready_pr` et `packet_automerge` attendent tout le rollup, donc le
  # paquet ne partait pas seul (#2415, run 39983066190), et les minutes macOS
  # pèsent ~10× le Linux sur le budget Actions. Elle est désormais dans
  # .github/workflows/macos.yml — nocturne sur main et à la demande par le
  # label `ci-macos` sur une PR — jusqu'à #3026 (macOS vert). Ici il ne reste
  # que le verdict plateforme rapide (L63/L66), qui sort en quelques minutes.
  # #987 : image x64 explicite (`macos-26-intel`), pas `macos-latest` (macOS 26
  # arm64) — le 13/10/2026, la capacité arm64 a annulé ce job après ~15 min
  # sans runner (« not acquired by Runner of type hosted »), ce qui rougissait
  # le check requis sans défaut de code. L'image est un runner standard
  # (gratuit), pas un runner « large » payant (canon §3). Défense en
  # profondeur : .github/workflows/relance-hosted.yml rejoue les jobs annulés
  # faute de runner.
  # L68/#3198 — DÉCISION DE CONCEPTION (revue #393, 23/10) : ce job est le
  # verdict COURT de la couche plateforme ; la suite complète vit dans
  # `macos.yml`, hors du chemin du paquet. Depuis #3026 (L68b), ce job court
  # est REQUIS : il entre dans les `needs` de `tests` ; la suite longue reste
  # un nocturne hors porte et ne revient jamais ici.
  platform-macos:
    name: plateforme macOS
    needs: plan
    if: needs.plan.outputs.code == 'true' && github.event.label.name != 'ci-macos'
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      AMEESH_REQUIRE_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # psutil est la dépendance de la couche plateforme sous macOS : sans
      # elle, `PlatformTest` se saute au lieu de prouver (L63).
      - name: psutil
        run: python -m pip install 'psutil>=5.9'
      - name: couche plateforme, lint, garanties, notification de bureau et services (L63, L65, L66)
        run: >-
          python -m unittest -v tests.test_l63_platform.PlatformTest
          tests.test_l63_platform.LintTest tests.test_l63_platform.GuaranteeTest
          tests.test_l66_desktop.PlatformNotifyTest
          tests.test_l65_services.ServicePayloadTest
          tests.test_l65_services.ServiceInstallTest
          tests.test_l65_services.KeychainTest
      - name: osascript réel sur le script produit (L66)
        run: |
          set -euo pipefail
          script=$(python -c 'from ameesh.platform import notify; print(notify._applescript("ameesh CI", "test L66 — ’accent", "normal"))')
          test -n "$script"
          if osascript -e "$script"; then
            echo "osascript: notification affichée"
          elif osacompile -e "$script" -o "$RUNNER_TEMP/l66.scpt"; then
            echo "osascript: pas de session GUI sur le runner; le script compile sans erreur"
          else
            echo "osascript: le script AppleScript produit ne compile pas" >&2
            exit 1
          fi

  # L161a : PR de documentation seule, ses lecteurs déclarés seulement, sans base
  doc-readers:
    name: lecteurs de la doc
    needs: plan
    if: needs.plan.outputs.docs_only == 'true' && github.event.label.name != 'ci-macos'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      AMEESH_REQUIRE_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lecteurs de la doc
        run: python -m unittest -v ${{ needs.plan.outputs.doc_readers }}

  # L161f : leaks (failures of modules the map did not select) and the
  # provisional green, for the two-week review (L161i); never required.
  # Its result gates nothing and nothing required reads what it produces, so
  # it is the job this lot routes to the borrowed label when a loan is armed
  # (option A, #1256; plan §3): a forged green here costs the two-week tally,
  # never a required check.
  bilan:
    name: bilan des impactés
    # #876 : « always() » seul recrée le job après l'annulation de l'exécution
    # (il reste queued des heures, puis la conclut en rouge) ; !cancelled() le saute.
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.code == 'true' && github.event.label.name != 'ci-macos'
    needs: [plan, psycopg, psql]
    # Union #1256 x #1468 : le pool prioritaire d'abord, puis l'hôte prêté
    # quand un prêt est armé, puis la flotte ordinaire. `bilan` est hors de la
    # clôture du check requis (tests/test_1256_ci_runners.py), seul job routé
    # du workflow avec `ui.yml/ui` ; c'est le seul job Linux dont l'expression
    # diffère de celle des autres (tests/test_1468_ci_prio.py).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || vars.AMEESH_LENT_RUNS_ON || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    # Cache access is closed for a job that may run on the borrowed host: the
    # cache service scopes the run's runtime token from this declaration, and
    # `permissions:` does not bound it (R1 Codex B3, #1256). `none` here: this
    # job reads no cache. A write mode is forbidden on every routed job — it
    # could otherwise publish a `carte-*` or `.venv-ci` entry that `plan` and
    # the psycopg parts restore, poisoning required checks.
    cache-mode: none
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: flux-*
          path: flux
      - name: leaks and provisional green
        run: |
          python3 scripts/test-plan.py leaks plan.json flux/*/flux.jsonl --out leaks.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: leaks
          path: leaks.json
          retention-days: 15  # the two-week tally (L161i)

  # L158: a PR that changes the version number carries the number its content
  # needs (CONTRIBUTING.md, "Numérotation des versions"): scripts/version-level.py
  # compares it with the content since the last tag. Any other PR: nothing to check.
  # #1343 : chaque PR de tests est une demande de gel (étiquette ci-lot/ci-full) ;
  # le numéro est vérifié sur la base du merge-ref (HEAD^1, la base réellement
  # composée — la porte de gel du job plan vérifie ses deux parents), sans quoi un
  # lot qui change la version obtiendrait un `tests` vert sans que le numéro soit
  # regardé. #4533 : cette base est la pointe demandée, ou une pointe qui n'en
  # diffère que par des atterrissages de coupure ; c'est bien le contenu testé.
  version:
    name: version number
    if: github.event_name == 'pull_request' && github.event.label.name != 'ci-macos'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, and the range since the last one
      - name: number against content
        # #1343 : la porte `gel` du job plan vérifie que HEAD est le merge-ref
        # de la tête étiquetée (HEAD^2) ; `HEAD^1` est la base réellement
        # composée (#4533 : la pointe demandée, ou une pointe qui n'en diffère
        # que par des atterrissages de coupure), et la commande garde la forme
        # du contrat L158 (tests/test_l158_version_level.py).
        run: python3 scripts/version-level.py pr HEAD^1 HEAD

  # nom de vérification stable : vert seulement si toutes les parts le sont
  # (L161a : une poussée de documentation seule sur main, ses lecteurs verts ;
  # L161f : une part que le plan n'a pas prévue est sautée ;
  # L158: on a PR, the version number check must pass ;
  # #748 : la part « autre système de fichiers », quand elle tourne — release
  # ou exécution à la main — compte comme les autres ;
  # #1343 : sur une demande de gel (toute PR), jamais de voie qui saute les
  # tests — un check `tests` vert veut dire que des tests ont tourné.
  # #3251/#3449 (décision owner #128512) : une annulation d'une part non
  # requise n'est pas un négatif — l'agrégat conclut vert et publie son détail
  # `tests (bilan des parts)` (neutral), consigné par fire/radar ; un échec
  # prouvé reste rouge, et une part Linux planifiée annulée, expirée,
  # absente ou en échec rougit, même si 15/16 ont réussi (#128512).
  tests:
    # Une PR peut être ouverte sur ce SHA après la garde ou la fin du run :
    # un dispatch ne doit jamais publier le contexte requis de cette PR.
    # #3198 : l'étiquette `ci-macos` ne publie jamais le contexte requis
    # `tests` (job sauté) ; son check porte un autre nom. Le check `tests` de
    # la demande de gel reste seul à porter le nom requis sur ce SHA.
    name: ${{ github.event.label.name == 'ci-macos' && 'tests (ci-macos, hors gel)' || (github.event_name == 'workflow_dispatch' && 'tests (dispatch)' || 'tests') }}
    # #876 : seul check requis ; `always() && !cancelled()` le ferait passer
    # skipped sur une exécution annulée, et GitHub compte un job sauté comme un
    # succès — la PR redeviendrait fusionnable sans aucun test. Il garde donc
    # `always()` (une exécution annulée le conclut en rouge) ; l'attente en file
    # de cet agrégat après annulation est la saturation des runners (lot #828).
    # #3198 : hors demande de gel (étiquette `ci-macos`), il saute et change de
    # nom — jamais de `tests` vert sans tests.
    if: always() && github.event.label.name != 'ci-macos'
    needs: [plan, version, psycopg, psql, platform-macos, doc-readers, fs-class]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # #856 : relire l'état terminal des jobs d'une exécution
      checks: write   # #856 : conclure les checks « tests (flux) » orphelins
    steps:
      # #3251 (décision #128512) : un run annulé n'a produit aucun agrégat
      # conclu. `always()` sur le job laisse cette étape s'exécuter ; elle
      # échoue explicitement pour que le check requis reste rouge, même si
      # des parts avaient déjà conclu avant l'annulation. #3449 : cette garde
      # ne suffit pas — un job `tests` démarré après l'annulation des familles
      # Linux mais avant que le run ne soit marqué `cancelled` la voit fausse
      # (run 40144843565). Le classifieur lit donc aussi les jobs du run
      # (`needs.*.result` ne distingue pas 0/16 de 15/16) : une part Linux
      # planifiée annulée, expirée, absente ou en échec est bloquante.
      - name: run annulé
        if: cancelled()
        run: |
          echo "::error title=tests : run annulé::l'agrégat requis ne conclut pas sur un run annulé (#3251, décision #128512)."
          exit 1
      # #3251 : le bilan lit `scripts/ci-agregat.py` du dépôt ; le checkout
      # doit donc précéder l'étape (le job n'avait jusque-là besoin d'aucun
      # fichier avant la réconciliation #856). `continue-on-error` : un
      # checkout en échec laisse le bilan conclure (script absent = rouge),
      # jamais un vert muet.
      - uses: actions/checkout@v4
        if: always()
        continue-on-error: true
      - name: bilan des types clients
        if: always()
        env:
          CLIENT_TYPES: ${{ needs.plan.outputs.client_types }}
        run: |
          printf 'Types clients à jour (gen-api --check, requis via plan) : **%s**.\n' \
            "${CLIENT_TYPES:-non exécuté}" >> "$GITHUB_STEP_SUMMARY"
      - name: bilan des parts
        env:
          # #3251 : le classifieur publie le check de détail de l'agrégat.
          GH_TOKEN: ${{ github.token }}
        run: |
          # #3251 (décision owner #128512, signée le 23/10, option a) :
          # l'agrégat conclut sur ce que les parts ont prouvé. L'annulation
          # d'une part **non requise** (capacité hébergée, runner perdu :
          # `cancelled`, `timed_out`, `startup_failure` sur macOS ou « autre
          # système de fichiers ») n'est pas un négatif : l'agrégat conclut
          # vert s'il garde la preuve Linux, et le classifieur publie le check
          # de détail `tests (bilan des parts)` en `neutral`, que fire et
          # radar consignent (#3209) sans retenir paquet ni release (canon
          # §3). #3449 : les familles **Linux planifiées** (psycopg, psql)
          # sont la preuve de la suite — une part planifiée annulée, expirée,
          # absente ou en échec est **bloquante** : `tests` rougit, même si
          # macOS est vert (run 40144843565) et même si 15 parts sur 16 ont
          # réussi (#128512) ; seuls macOS et « autre système de fichiers »
          # restent des non-concluants consignés. Un **échec** (`FAILURE`),
          # une part sautée qui devait tourner, un
          # plan refusé **ou aucune part réussie** (toutes annulées : preuve
          # absente, #128512) restent un négatif. #940 n'est pas rouvert : si
          # une annulation ne peut pas être consignée (jeton en lecture
          # seule, API en panne), le classifieur échoue et `tests` reste
          # rouge — jamais de SUCCESS muet.
          #
          # La classification est dans scripts/ci-agregat.py (pur, testé sans
          # CI) ; l'étape ne fait que lui passer les résultats des `needs`.
          # #3449 : les parts réussies par famille se lisent sur les jobs du
          # run (`actions: read`) — une matrice `cancelled` peut garder 15/16
          # parts vertes, mais une part planifiée annulée, expirée, absente
          # ou en échec rougit quand même (#128512).
          python3 scripts/ci-agregat.py \
            --event "${{ github.event_name }}" \
            --run-id "${{ github.run_id }}" \
            --plan "${{ needs.plan.result }}" \
            --version "${{ needs.version.result }}" \
            --version-only "${{ needs.plan.outputs.version_only }}" \
            --docs-only "${{ needs.plan.outputs.docs_only }}" \
            --doc-readers "${{ needs.doc-readers.result }}" \
            --psycopg "${{ needs.psycopg.result }}" \
            --psycopg-parts '${{ needs.plan.outputs.psycopg }}' \
            --psql "${{ needs.psql.result }}" \
            --psql-parts '${{ needs.plan.outputs.psql }}' \
            --psql-full "${{ inputs.psql-full }}" \
            --plateforme-macos "${{ needs.platform-macos.result }}" \
            --autre-fs "${{ needs.fs-class.result }}" \
            --publish
      # #856 : réconciliation indépendante du publisher — un runner arrêté
      # (#747) tue le publisher ET l'étape `close`, et le check « tests (flux) »
      # restait in_progress pour toujours. On relit l'état terminal réel du job
      # et de l'exécution qui l'ont publié (par l'`external_id` du check #1393,
      # sinon par le `details_url`, sinon par le `check_suite` : GitHub laisse
      # l'URL par défaut sur ces checks) ; jamais `success` sans ligne `fin`,
      # aucun check dont l'exécution est encore active, ni d'une autre tête,
      # n'est touché.
      # `continue-on-error` : cette réconciliation ne change jamais le verdict
      # requis « tests » (comme la publication, elle n'est pas une cause d'échec).
      # `if: always()` : un bilan rouge (une part requise tombée) ne doit pas
      # sauter le balayage — le checkout ci-dessus l'a déjà fourni.
      # #1393 : `timeout 120` et `--max-duration 100` bornent le balayage (les
      # appels GitHub peuvent durer 20 s) sous le plafond de 5 min du job : un
      # balayage lent ne peut pas faire expirer le job et rougir « tests » ; il
      # s'arrête entre deux checks et les restants sont vus au passage suivant.
      - name: conclusion des checks de flux orphelins
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 120 python3 scripts/ci-flow.py sweep --max-duration 100

  # #3380 : témoin du Python du poste, sans base et hors agrégat requis.
  # Reste facultatif tant que sa fiabilité et son coût ne sont pas établis.
  python314:
    name: Python 3.14 smoke (optional)
    continue-on-error: true
    needs: plan
    if: github.event.label.name != 'ci-macos' && needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: installation
        run: python -m pip install '.[crypto]'
      - name: compilation
        run: python -m compileall -q src
      - name: import de tous les modules
        run: |
          python - <<'PY'
          import importlib
          from pathlib import Path

          paths = sorted(Path('src/ameesh').rglob('*.py'))
          for path in paths:
              parts = path.relative_to('src').with_suffix('').parts
              name = '.'.join(parts[:-1] if parts[-1] == '__init__' else parts)
              importlib.import_module(name)
          print(f'{len(paths)} modules importés')
          PY
      - name: aide des parseurs (#3379)
        run: python -m unittest tests.test_3379_argparse_help -v
      - name: aide de la commande installée
        run: ameesh --help

  # L98 T2b (#4408) : le cœur au profil nu (`AMEESH_MODULES=bare`), sans module
  # intégré : registre, modules de projet et frontière L97 (test_generic_core),
  # puis `ameesh modules` et `canon check` sur le canon d'exemple sans
  # extensions. Profil de CI et de test seulement (décision 2, #4405) ; hors de
  # l'agrégat requis `tests` : son rouge se voit sur la PR sans retenir le
  # paquet tant qu'il n'y est pas versé.
  profil-nu:
    name: profil nu (modules)
    needs: plan
    if: github.event.label.name != 'ci-macos' && needs.plan.outputs.code == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AMEESH_MODULES: bare
      AMEESH_REQUIRE_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # venv du job : un runner auto-hébergé ne garde rien dans le Python partagé
      - name: installation
        run: |
          python -m venv "$RUNNER_TEMP/nu"
          "$RUNNER_TEMP/nu/bin/python" -m pip install -q . 'pyyaml>=6'
      - name: tests au profil nu
        run: |
          "$RUNNER_TEMP/nu/bin/python" -m unittest -v tests.test_l98_bare_profile \
            tests.test_l98_modules_registry tests.test_l317_project_modules \
            tests.test_generic_core
      - name: ameesh modules et canon check sur le canon d'exemple
        run: |
          set -euo pipefail
          echo '{}' > "$RUNNER_TEMP/config.json"
          export AMEESH_CONFIG="$RUNNER_TEMP/config.json"
          test "$("$RUNNER_TEMP/nu/bin/ameesh" modules)" = "no module"
          cp -r examples/canon "$RUNNER_TEMP/canon"
          git -C "$RUNNER_TEMP/canon" init -q
          git -C "$RUNNER_TEMP/canon" add -A
          git -C "$RUNNER_TEMP/canon" -c user.name=ci -c user.email=ci@example.invalid commit -qm exemple
          "$RUNNER_TEMP/nu/bin/ameesh" canon check --canon "$RUNNER_TEMP/canon" --ref HEAD --host banc
