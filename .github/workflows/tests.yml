# SPDX-License-Identifier: AGPL-3.0-only
# Intégration continue d'ameesh : la suite sur un vrai Postgres 17, avec les
# deux pilotes de base (psql et psycopg). Aucun secret n'est utilisé : chaque
# base de service n'existe que le temps de sa part.
#
# L116 — la suite est découpée en parts parallèles par scripts/test-parts.py
# (par module, équilibré par tests/parts/durees.json), chaque part avec son
# propre Postgres :
#   - psycopg : sur une PR de lot, les tests impactés et le contrat (L1211),
#               en une à quatre parts selon l'estimation ; la suite complète,
#               en 4 parts, sur push vers main ou release/**, sur une PR de
#               release (source ou cible release/** ou integration/**) et sur
#               l'appel du portier de paquet (workflow_call, §12) ;
#   - psql    : sur une PR de lot, les modules « pilote » parmi les impactés
#               et le contrat, plus la liste « always » déclenchée (#749), en
#               une à trois parts (#947 : huit jobs se partagent chaque hôte
#               auto-hébergé, une part unique de ~24 min au repos atteignait le
#               plafond de 30 min sous saturation) ; la suite complète, en
#               6 parts, sur push vers main ou release/**, sur une PR de
#               release (sans liste pilote), à la main (workflow_dispatch),
#               sur l'appel du portier de paquet (workflow_call) et sur une
#               demande de gel #1343 (`ci-lot-<sha>`/`ci-full-<sha>`, parcours
#               PR).
# Le job final « tests » agrège les parts : c'est le nom de vérification stable.
#
# §12 — une tête de paquet ne lance qu'une seule suite complète. Le run
# `pull_request` de sa PR porte le check requis `tests` ; le portier
# `.github/workflows/paquet.yml`, déclenché par `push integration/**`, n'appelle
# cette suite (`workflow_call`) que si aucune PR ouverte ne couvre la tête
# exacte, et son check n'est jamais nommé `tests` (incident #1342 : deux suites
# complètes, l'agrégat rouge du run push annulé bloquait la PR #1050).
#
# L1211 — canon §3 : une branche de lot ne lance que les tests impactés, plus
# toujours les tests de contrat (tests/parts/toujours.txt : droits, rôles,
# migrations, objets globaux du cluster), avec repli sur la suite complète
# quand la sélection ne peut pas décider (scripts/test-plan.py, lot_selection).
# La suite complète tourne sur main, release/** et pour la branche d'intégration
# du paquet (§12) par le run `pull_request` de sa PR ou, à défaut de PR couvrant
# la tête, par le portier `paquet.yml` : une PR de lot n'en déclenche plus, mais
# une PR de release (source ou cible release/** ou integration/**) garde la
# suite complète, les deux pilotes, sans voie version/doc ni liste pilote psql —
# y compris dans le plan de repli. Les règles de refusion (a : delta de main
# disjoint, b : migrations seules) viendront ensuite.
#
# #1343 — canon §3 (bureau home 66, owner 14/10 21:45) : sur ameesh, la
# relecture passe avant la CI. Une poussée sur une PR de lot ne lance plus
# rien ; la CI d'un lot (impactés + contrat, voie `mode=lot` du plan) ne tourne
# qu'une fois, sur la tête gelée, quand les verdicts requis sont acquis.
# `ameesh ci run <lot>` (src/ameesh/ci.py) porte ce déclencheur : gel présent,
# branche distante et tête de PR au SHA gelé, verdict `ok` sur ce SHA (sauf lot
# léger), puis pose d'une étiquette `ci-lot-<40hex>` / `ci-full-<40hex>` sur la
# PR — `pull_request` `types: [labeled]` (un `workflow_dispatch` ne satisfait
# pas un check requis de PR). Le job `plan` compare exactement le SHA de
# l'étiquette à `pull_request.head.sha`, vérifie que le checkout est le
# merge-ref composé de la base du payload et de cette tête (ses deux parents),
# puis sélectionne contre la base du payload. Une étiquette étrangère, un SHA
# qui ne nomme pas la tête, une composition qui a bougé ou un `ci-lot` sur
# `release/**`/`integration/**` font rougir le check requis sans exécuter de
# tests. Aucune voie version seule ou documentation seule : sur la tête gelée,
# un check `tests` vert veut dire que des tests ont tourné. Exceptions
# (canon) : un lot qui débloque la CI ou corrige un incident demande sa CI en
# parallèle de sa relecture (`--exception incident|unblock --reason …`), le
# motif et la marque restant dans la trace du lot. La commande est seule à
# retirer/reposer son étiquette (nouvelle demande admissible, ou reprise
# explicite d'un terminal rouge/annulé) ; une étiquette posée à la main
# demande de vrais tests, elle ne prouve ni gel ni avis. Un run devenu périmé
# (autre SHA, autre composition) est annulé par `ameesh ci run` ou `ameesh ci
# cancel <lot>`, jamais le run de la composition gelée.
#
# L157 — une PR de lot qui ne change QUE le numéro de version (pyproject.toml
# seul, la seule ligne `version = "…"`) ne relance pas la suite : `main` l'a
# déjà validée pour ce contenu. Le job « changements » le détecte
# (scripts/version-only.py) ; les parts sont alors sautées et « tests » reste
# vert. Au moindre doute, la suite tourne ; jamais sur un push, à la main, ni
# sur une PR de release.
#
# L161a — même chose pour une PR de lot de documentation seule (docs/, site/,
# *.md hors src/, tests/, .github/ et examples/) : seuls ses lecteurs déclarés
# (tests/parts/lecteurs-doc.txt) tournent, sans base, dans « lecteurs de la
# doc » ; une PR de release garde la suite complète. Une exécution de main en
# cours n'est jamais annulée par la suivante.
# #824 — décision owner signée #17605 du 13/10/2026 : un seul run de main
# reste en attente ; une fusion plus récente remplace ce run en attente et
# valide aussi les fusions intermédiaires qu'elle contient.
#
# #833 — le filtre s'applique aussi à une poussée vers main, sur le diff de
# toute la poussée (`github.event.before` → tête, jamais HEAD^1 seul). Une
# poussée vers release/** ou une histoire réécrite garde la suite complète.
#
# L161b — chaque part écrit ses résultats au fil de l'eau (--flow, JSON lignes,
# un test par ligne, schéma ameesh-test-event/1), publiés en artefact
# (flux-<pilote>-<part>) et résumés dans le résumé du job (scripts/ci-flow.py).
# Les modules de test touchés par les fichiers changés (--since HEAD^1 : la
# cible pour une PR, le commit précédent sur main) passent en premier dans
# chaque part. Rien n'est sauté sur main ; sur une branche de lot, le plan
# décide (L1211).
#
# L161f — the `plan` job reads the measured map (cache `carte-<sha>`, written
# by .github/workflows/carte.yml) once for the whole run and writes plan.json
# (scripts/test-plan.py): the class of every module (P0 changed test, P1
# impacted by changed blocks, files or tables, P2 recent failure, P3 the
# rest), the parts and their modules. Every part runs from that same plan
# (`--plan`), impacted first; the matrices come from the plan (fromJSON), and
# a driver with no part is skipped. On a lot branch (L1211), only the impacted
# modules and the contract list run; the rest of the suite runs on main,
# release/** and the package integration branch, and any doubt (no map, stale
# or unsure selection, changed lines without a test, test infrastructure)
# falls back to the full suite. Map missing, stale or unusable: the L161b
# order, full suite. The `bilan` job (never required) counts the leaks
# (failures of modules the map did not select) and the provisional green (P0
# and P1 green in every part), kept as the `leaks` artifact for the two-week
# review (L161i).
#
# L161c — pendant la part, `ci-flow.py publish` (arrière-plan) tient le check
# run « tests (flux) <part> » de la tête poussée : chaque échec y entre dès
# qu'il est écrit. `ameesh notify` le relève et l'envoie aussitôt à l'agent du
# lot (ameesh.ci). D'où `checks: write` sur les parts ; sans ce droit (PR d'une
# fourche), rien n'est publié et la part n'en est pas affectée.
name: tests

# #1343 : le titre du run porte la demande de gel — PR, étiquette (mode et SHA
# complet) et base du payload — pour que la commande et la preuve de fusion
# puissent la relire ; une poussée garde le nom de sa branche.
run-name: "tests${{ github.event_name == 'pull_request' && format(' [PR #{0} {1} base {2}]', github.event.pull_request.number, github.event.label.name, github.event.pull_request.base.sha) || (github.event_name == 'push' && format(' [{0}]', github.ref_name) || '') }}"

on:
  # §12 : une poussée sur integration/** ne déclenche plus cette suite
  # directement. Le portier .github/workflows/paquet.yml décide — une tête de
  # paquet n'a qu'une suite, celle de sa PR — et rappelle cette suite
  # (workflow_call) quand aucune PR ouverte ne couvre la tête poussée.
  push:
    branches: [main, "release/**"]
  # #1343 (canon §3, bureau home 66) : une poussée sur une PR de LOT ne lance
  # plus rien. La CI d'un lot part au gel, quand les verdicts requis sont
  # acquis : `ameesh ci run <lot>` pose sur la PR l'étiquette
  # `ci-lot-<40hex>` / `ci-full-<40hex>`, seul déclencheur du parcours PR. Une
  # étiquette étrangère (ni l'une ni l'autre) réveille le workflow mais le job
  # `plan` la refuse : le check requis rougit sans exécuter de tests. Une PR de
  # release (source ou cible release/** ou integration/**) passe aussi par sa
  # demande `ci-full-<sha>` ; les poussées vers integration/** restent portées
  # par le portier de paquet (§12, #1410), pas par ce déclencheur.
  pull_request:
    types: [labeled]
    branches: [main, "release/**", "integration/**"]
  workflow_call:
  workflow_dispatch:

# Une PR dépassée est annulée, mais la concurrency d'une étiquette ÉTRANGÈRE
# est distincte de celle d'une demande de gel (#1343) : ajouter une étiquette
# quelconque ne doit pas annuler un run gelé valide. Les pushes de main
# partagent un groupe : GitHub garde un run en cours et un seul en attente,
# remplacé par le suivant. Release et poussées gardent un groupe par exécution
# (périmètre gelé). `ameesh ci run` annule lui-même les runs périmés d'une
# autre composition avant de reposer son étiquette, jamais celui de la
# composition courante.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.label.name) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # L161b : commit poussé (tête de la PR), à côté du commit de fusion testé
  AMEESH_CI_TETE: ${{ github.event.pull_request.head.sha || github.sha }}
  AMEESH_TEST_DSN: postgresql://ameesh@127.0.0.1:5432/ameesh
  PGPASSWORD: ameesh-ci
  AMEESH_REQUIRE_DB: "1"
  AMEESH_BALANCE_INTERVAL: "0"
  PYTHONPATH: src

# Linux jobs run on the self-hosted ameesh-ci runners (one persistent host,
# four runners): GitHub's free tier caps hosted jobs at 20 for the whole
# organisation. A pull request from a fork never reaches that host (the
# repository is public: its code would run on a shared, persistent machine);
# it stays on ubuntu-latest, like the macOS job and the Pages deployment.
#
# #1468 — priority pool. A few runners (label `ameesh-ci-prio`) are kept for
# package and release runs and for the lots marked unblock/incident: they do
# NOT carry `ameesh-ci`, so an ordinary job (which asks for `ameesh-ci`) can
# never take them — adding a label while keeping `ameesh-ci` would reserve
# nothing. Every runner, general or reserved, carries `ameesh-ci-pool`; a
# priority job asks for it, so it takes the first idle runner of either group.
# A run is priority when the switch `vars.AMEESH_CI_PRIO` is `on` and it is a
# push (or the package gate's workflow_call) on integration/** or release/**,
# a PR whose source or target is one of those branches, or a PR listed in
# `vars.AMEESH_CI_PRIO_PRS` (JSON array of PR numbers: a repository variable,
# writable with repository write access, set by the pilot for an unblock or
# incident lot and recorded with its before/after value; setting it triggers
# no run). Switch off or unset: every job
# asks for `ameesh-ci`, as before. The routing only picks the runner: no
# `if:`, no part, no required check depends on it, and no hosted runner is
# ever added (a fork PR keeps ubuntu-latest, as before). The job-level
# expression is the same everywhere (tests/test_1468_ci_prio.py);
# docs/EXPLOITATION.md, « Runners prioritaires », gives the activation and
# rollback steps; scripts/ci-queue-wait.py measures the queue wait per class.
jobs:
  # L157, L161a, L161f : nature of the change (version or documentation only,
  # lot PR only; merge commit against its target), the branch context
  # (release PRs keep the full suite) and the plan of the run, from the map
  plan:
    name: plan
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      # #833 : sur une poussée, le diff va du commit d'avant la poussée
      # (`github.event.before`; vide hors push) à la tête, pas seulement HEAD^1.
      # La référence distingue main (filtre doc) des branches release (suite
      # complète, quel que soit le contenu).
      # #1343 : sur une PR, la base du diff est celle du payload
      # (`pull_request.base.sha`), la composition même du merge-ref vérifié par
      # la porte ci-dessous — jamais HEAD^1 deviné.
      AMEESH_CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || 'HEAD^1') }}
      AMEESH_CI_REF: ${{ github.ref }}
      # la tête demandée par l'étiquette (payload), tracée et comparée
      AMEESH_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      AMEESH_CI_LABEL: ${{ github.event.label.name }}
    outputs:
      version_only: ${{ steps.plan.outputs.version_only }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      doc_readers: ${{ steps.plan.outputs.doc_readers }}
      code: ${{ steps.plan.outputs.code }}
      psycopg: ${{ steps.plan.outputs.psycopg }}
      psycopg_parts: ${{ steps.plan.outputs.psycopg_parts }}
      psql: ${{ steps.plan.outputs.psql }}
      psql_parts: ${{ steps.plan.outputs.psql_parts }}
      # #1343 : mode, tête et base de la demande de gel, relus par la commande
      # et la preuve de fusion.
      mode: ${{ steps.gel.outputs.mode }}
      sha: ${{ steps.gel.outputs.sha }}
      base: ${{ steps.gel.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the map commit, and whether it is an ancestor
      # #1343 : la demande de gel est une étiquette `ci-lot-<40hex>` ou
      # `ci-full-<40hex>` posée sur la PR par `ameesh ci run`. La porte vérifie,
      # avant tout plan et sans exécuter un test : l'étiquette (motif exact,
      # SHA complet), l'égalité exacte avec `pull_request.head.sha`, le mode
      # imposé par les refs (`release/**`/`integration/**` → full), et que le
      # checkout est bien le merge-ref composé de la base du payload et de
      # cette tête (ses deux parents). Toute autre étiquette est refusée : le
      # check requis rougit, rien ne tourne.
      - name: gel (étiquette ci-lot/ci-full sur la tête gelée — #1343)
        id: gel
        if: github.event_name == 'pull_request'
        # #1237 (N1 de #1211) : un nom de branche est choisi par l'auteur de la
        # PR ; il passe par l'environnement et reste cité, jamais interpolé
        # dans le script.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          label="$AMEESH_CI_LABEL"
          if ! printf '%s' "$label" | grep -Eq '^ci-(lot|full)-[0-9a-f]{40}$'; then
            echo "::error::label '$label' is not a freeze request (ci-lot-<40 hex> or ci-full-<40 hex>): foreign label, nothing run"
            exit 1
          fi
          mode="$(printf '%s' "$label" | sed -E 's/^ci-(lot|full)-.*$/\1/')"
          sha="${label##*-}"
          head="$AMEESH_CI_HEAD"
          if [ "$sha" != "$head" ]; then
            echo "::error::label '$label' names $sha, the pull request head is $head: the freeze does not cover this head, nothing run"
            exit 1
          fi
          base="$AMEESH_CI_BASE"
          case "$base" in
            *[!0-9a-f]*) echo "::error::unusable pull request base: '$base' (full 40-hex expected)"; exit 1 ;;
          esac
          if [ "${#base}" != 40 ]; then
            echo "::error::unusable pull request base: '$base' (${#base} characters, full 40-hex expected)"
            exit 1
          fi
          release=0
          case "$HEAD_REF" in release/*|integration/*) release=1 ;; esac
          case "$BASE_REF" in release/*|integration/*) release=1 ;; esac
          if [ "$release" = 1 ] && [ "$mode" != "full" ]; then
            echo "::error::source or target release/** or integration/** requires ci-full-<sha> (--full): a lot request never covers a release, nothing run"
            exit 1
          fi
          parents="$(git rev-list --parents -n 1 HEAD)"
          if [ "$(printf '%s' "$parents" | wc -w)" != 3 ]; then
            echo "::error::HEAD is not the pull request merge-ref (a merge commit): the composition cannot be checked, nothing run"
            exit 1
          fi
          p1="$(git rev-parse HEAD^1)"
          p2="$(git rev-parse HEAD^2)"
          if [ "$p1" != "$base" ]; then
            echo "::error::the merge-ref base is $p1, the payload base is $base: the composition moved, refreeze the request, nothing run"
            exit 1
          fi
          if [ "$p2" != "$head" ]; then
            echo "::error::the merge-ref head is $p2, the label names $head: the composition moved, refreeze the request, nothing run"
            exit 1
          fi
          echo "freeze request: mode=$mode sha=$sha base=$base head=$head label=$label"
          {
            echo "mode=$mode"
            echo "sha=$sha"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          {
            echo "AMEESH_CI_MODE=$mode"
            echo "AMEESH_CI_GEL=$sha"
          } >> "$GITHUB_ENV"
      # une poussée garde le plan automatique (L1211, L161a) : impactés +
      # contrat sur une branche de lot, suite complète sur main/release.
      - name: poussée (plan automatique)
        if: github.event_name != 'pull_request'
        run: echo "AMEESH_CI_MODE=auto" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the most recent map of main (a PR reads the caches of its base branch)
      - uses: actions/cache/restore@v4
        with:
          path: carte/carte.json.gz
          key: carte-${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          restore-keys: carte-
      - id: plan
        name: plan of the run
        # #1237 (N1 of #1211): a branch name travels through the environment,
        # never interpolated into the script — the merge gate does not run a
        # `$(…)` written in a ref.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 scripts/test-plan.py plan --out plan.json --map carte/carte.json.gz \
            --event "${{ github.event_name }}" \
            --base "$AMEESH_CI_BASE" --ref "$AMEESH_CI_REF" \
            --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --mode "$AMEESH_CI_MODE" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" --annotations
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 3

  psycopg:
    name: psycopg ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
    needs: plan
    if: needs.plan.outputs.psycopg != '[]'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.psycopg) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]  # host port chosen by docker: several runners share the host
        # base jetable : données en mémoire
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    permissions:
      contents: read
      checks: write  # L161c : check run « tests (flux) »
    env:
      AMEESH_DRIVER: psycopg
      FLUX_NOM: tests (flux) psycopg ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
      # #899 : le plafond du job, tenu à timeout-minutes (contrat test_899)
      AMEESH_PLAFOND_MIN: "30"
    steps:
      - &debut
        name: début du job (mesure du plafond, #899)
        run: echo "AMEESH_JOB_DEBUT=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - &dsn
        name: port de la base jetable
        run: echo "AMEESH_TEST_DSN=postgresql://ameesh@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ameesh" >> "$GITHUB_ENV"
      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # environnement Python en cache : la clé suit pyproject.toml et le runner
      # qui l'a construit (#932 — un venv de runner auto-hébergé porte un lien
      # absolu vers /home/runner/r<X>/_work/_tool/Python/... : la clé par
      # `runner.name` empêche un runner de restaurer le venv d'un autre ; les
      # runners hébergés, au cache commun /opt/hostedtoolcache et au nom
      # variable (« GitHub Actions N »), partagent la clé `hosted`, #1294).
      #
      # #1293 : la clé primaire est celle du run, donc unique ; la
      # restauration passe par les clés partielles (`restore-keys`). Un venv
      # restauré invalide est reconstruit **puis resauvé sous une clé neuve**
      # (étape suivante) : `actions/cache` ne resauve pas sous une clé
      # identique, si bien qu'un venv devenu invalide était reconstruit à
      # chaque exécution sur ce runner.
      - id: venv
        uses: actions/cache/restore@v4
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-${{ hashFiles('pyproject.toml') }}-run${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-${{ hashFiles('pyproject.toml') }}-
      # Le contrôle vaut aussi pour un cache de même runner devenu périmé (outil
      # Python déplacé) : un venv restauré n'est utilisé que s'il sait encore
      # importer ses dépendances, sinon il est reconstruit (#932, #1293).
      - id: deps
        name: dépendances (pilote psycopg)
        run: |
          if .venv-ci/bin/python -c 'import psycopg, cryptography, psutil' >/dev/null 2>&1; then
            echo "venv restauré du cache : valide"
          else
            rm -rf .venv-ci
            python -m venv .venv-ci
            .venv-ci/bin/pip install 'psycopg[binary]>=3.1' 'cryptography>=41' 'psutil>=5.9'
            echo "reconstruit=1" >> "$GITHUB_OUTPUT"
          fi
      # #1293 : le venv reconstruit est sauvé sous la clé du run, que la
      # prochaine exécution retrouve par `restore-keys`. Un sauvetage refusé
      # (quota, course entre parts) ne fait pas rougir la part : la
      # reconstruction reste correcte, seule la prochaine exécution repaie.
      - if: steps.deps.outputs.reconstruit == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-py${{ steps.py.outputs.python-version }}-psycopg-${{ hashFiles('pyproject.toml') }}-run${{ github.run_id }}-${{ github.run_attempt }}
      - &base
        name: base jetable (sans fsync) et client psql
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql "$AMEESH_TEST_DSN" -q -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - &git
        name: identité git des tests (dépôts temporaires)
        run: |
          # own global config per job: runners sharing the host never race on ~/.gitconfig
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "ameesh ci"
          git config --global user.email "ci@ameesh.invalid"
          git config --global init.defaultBranch main
      - &plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}
      - &publier
        name: publication du flux en direct (check run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nohup python3 scripts/ci-flow.py publish "$RUNNER_TEMP/flux.jsonl" --name "$FLUX_NOM"
          --plafond-min "$AMEESH_PLAFOND_MIN" --debut "$AMEESH_JOB_DEBUT"
          > "$RUNNER_TEMP/publier.log" 2>&1 &
      - name: part ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
        run: >-
          .venv-ci/bin/python scripts/test-parts.py run --plan "$RUNNER_TEMP/plan.json"
          --part ${{ matrix.part }} --driver psycopg --flow "$RUNNER_TEMP/flux.jsonl"
      - &fermer
        name: fin du check run du flux
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci-flow.py close "$RUNNER_TEMP/flux.jsonl" --name "$FLUX_NOM"
          cat "$RUNNER_TEMP/publier.log" 2>/dev/null || true
      - &resume
        name: résumé du flux
        if: always()
        run: python scripts/ci-flow.py summary "$RUNNER_TEMP/flux.jsonl" >> "$GITHUB_STEP_SUMMARY"
      - name: flux en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-psycopg-${{ matrix.part }}
          path: ${{ runner.temp }}/flux.jsonl
          if-no-files-found: ignore
          retention-days: 1  # read by bilan in the same run; 8 400 artifacts filled the org quota (13/10)

  psql:
    name: psql ${{ matrix.part }}/${{ needs.plan.outputs.psql_parts }}
    needs: plan
    if: needs.plan.outputs.psql != '[]'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    # #880 : sur une PR, la part psql est une seule part « pilote » ; mesurée
    # 21,7-26,1 min au repos et 30,4-31,0 min sous saturation (8/8 runners),
    # elle était annulée par le plafond de 30 min sans échec de test (PR #640,
    # run 38381239685). 45 min laisse la marge sous charge et reste un plafond
    # borné (§3 du processus de lot : aucun job ne retient un runner des heures).
    # psycopg garde 30 min : ses parts tournent en 6-8 min, même à 3× plus lent
    # elles tiennent dans le plafond.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # sur une PR de lot (L1211) : les modules « pilote » parmi les
        # impactés et le contrat, plus la liste « always » déclenchée (#749) ;
        # une part, deux ou trois selon l'estimation (scripts/test-plan.py,
        # lot_part_count), trois au plus (#947 : sous saturation, une part
        # unique atteignait le plafond de 30 min) ; suite complète en 6 parts
        # sur push et sur une PR de release (sans liste pilote).
        part: ${{ fromJSON(needs.plan.outputs.psql) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]  # host port chosen by docker: several runners share the host
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    permissions:
      contents: read
      checks: write  # L161c
    env:
      AMEESH_DRIVER: psql
      FLUX_NOM: tests (flux) psql ${{ matrix.part }}/${{ needs.plan.outputs.psql_parts }}
      # #899 : le plafond du job, tenu à timeout-minutes (contrat test_899) ;
      # 45 depuis #880, qui a relevé le plafond de la part psql sous saturation.
      AMEESH_PLAFOND_MIN: "45"
    steps:
      - *debut
      - uses: actions/checkout@v4
      - *dsn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - *base
      - *git
      - *plan
      - *publier
      - name: part ${{ matrix.part }}
        run: >-
          python scripts/test-parts.py run --plan "$RUNNER_TEMP/plan.json"
          --part ${{ matrix.part }} --driver psql --flow "$RUNNER_TEMP/flux.jsonl"
      - *fermer
      - *resume
      - name: flux en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-psql-${{ matrix.part }}
          path: ${{ runner.temp }}/flux.jsonl
          if-no-files-found: ignore
          retention-days: 1  # read by bilan in the same run; 8 400 artifacts filled the org quota (13/10)

  # L63 : la couche plateforme (ameesh.platform) et son lint, sans base, sous
  # macOS avec psutil. Sous Linux, les parts psycopg passent par psutil et les
  # parts psql (sans psutil) par le repli /proc.
  # #987 : image x64 explicite (`macos-26-intel`), pas `macos-latest` (macOS 26
  # arm64) — le 13/10/2026, la capacité arm64 a annulé ce job après ~15 min
  # sans runner (« not acquired by Runner of type hosted »), ce qui rougissait
  # le check requis sans défaut de code. L'image est un runner standard
  # (gratuit), pas un runner « large » payant (canon §3) ; le job ne teste que
  # psutil et la couche plateforme, indifférents à l'architecture. Défense en
  # profondeur : .github/workflows/relance-hosted.yml rejoue les jobs annulés
  # faute de runner.
  platform-macos:
    name: plateforme macOS
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 10
    env:
      AMEESH_REQUIRE_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: psutil
        run: python -m pip install 'psutil>=5.9'
      - name: couche plateforme et lint
        run: python -m unittest -v tests.test_l63_platform.PlatformTest tests.test_l63_platform.LintTest

  # L161a : PR de documentation seule, ses lecteurs déclarés seulement, sans base
  doc-readers:
    name: lecteurs de la doc
    needs: plan
    if: needs.plan.outputs.docs_only == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      AMEESH_REQUIRE_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lecteurs de la doc
        run: python -m unittest -v ${{ needs.plan.outputs.doc_readers }}

  # L161f : leaks (failures of modules the map did not select) and the
  # provisional green, for the two-week review (L161i); never required
  bilan:
    name: bilan des impactés
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.code == 'true'
    needs: [plan, psycopg, psql]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: flux-*
          path: flux
      - name: leaks and provisional green
        run: |
          python3 scripts/test-plan.py leaks plan.json flux/*/flux.jsonl --out leaks.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: leaks
          path: leaks.json
          retention-days: 15  # the two-week tally (L161i)

  # L158: a PR that changes the version number carries the number its content
  # needs (CONTRIBUTING.md, "Numérotation des versions"): scripts/version-level.py
  # compares it with the content since the last tag. Any other PR: nothing to check.
  # #1343 : chaque PR de tests est une demande de gel (étiquette ci-lot/ci-full) ;
  # le numéro est vérifié sur la base du merge-ref (HEAD^1, exactement la base du
  # payload — la porte de gel du job plan vérifie ses deux parents), sans quoi un
  # lot qui change la version obtiendrait un `tests` vert sans que le numéro soit
  # regardé.
  version:
    name: version number
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, and the range since the last one
      - name: number against content
        # #1343 : la porte `gel` du job plan vérifie que HEAD est le merge-ref
        # composé de la base du payload (HEAD^1) et de la tête étiquetée (HEAD^2),
        # et refuse sinon ; `HEAD^1` est donc la base exacte, et la commande garde
        # la forme du contrat L158 (tests/test_l158_version_level.py).
        run: python3 scripts/version-level.py pr HEAD^1 HEAD

  # nom de vérification stable : vert seulement si toutes les parts le sont
  # (L161a : une poussée de documentation seule sur main, ses lecteurs verts ;
  # L161f : une part que le plan n'a pas prévue est sautée ;
  # L158: on a PR, the version number check must pass ;
  # #1343 : sur une demande de gel (toute PR), jamais de voie qui saute les
  # tests — un check `tests` vert veut dire que des tests ont tourné)
  tests:
    name: tests
    if: always()
    needs: [plan, version, psycopg, psql, platform-macos, doc-readers]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_CI_PRIO == 'on' && (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'integration/') || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/') || (github.event_name == 'pull_request' && contains(fromJSON(vars.AMEESH_CI_PRIO_PRS || '[]'), github.event.pull_request.number))) && '["self-hosted", "linux", "ameesh-ci-pool"]' || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: bilan des parts
        run: |
          # #940 : le contrat (tests/test_940_agregat_bash.py) exige cet
          # enchaînement exact « - name: bilan des parts » puis « run: | »
          # (pas d'`env:` intercalé) et refuse toute expression qu'il ne couvre
          # pas ; `${{ github.event_name }}` reste donc dans le script.
          echo "plan    : ${{ needs.plan.result }} (version seule : ${{ needs.plan.outputs.version_only }}, doc seule : ${{ needs.plan.outputs.docs_only }})"
          echo "doc     : ${{ needs.doc-readers.result }}"
          echo "psycopg : ${{ needs.psycopg.result }} (parts ${{ needs.plan.outputs.psycopg }})"
          echo "psql    : ${{ needs.psql.result }} (parts ${{ needs.plan.outputs.psql }})"
          echo "macOS   : ${{ needs.platform-macos.result }}"
          echo "version : ${{ needs.version.result }}"
          # un plan refusé (étiquette étrangère, SHA qui ne nomme pas la tête,
          # composition qui a bougé) rougit ici : rien n'a tourné, jamais vert.
          test "${{ needs.plan.result }}" = success
          # L158 : la version est vérifiée sur chaque PR (demande de gel) ;
          # ailleurs elle est sautée, et c'est légitime. #940 : sous `bash -e`,
          # l'échec de la branche gauche du `&&` interne est exempté — sortie
          # explicite après le repli légitime.
          test "${{ needs.version.result }}" = success || { test "${{ github.event_name }}" != pull_request && test "${{ needs.version.result }}" = skipped; } || exit 1
          # #1343 : une demande de gel ne prend jamais les voies version seule
          # (#L157) ou documentation seule (L161a) ; si le plan en produisait
          # une, le check requis rougit au lieu de verdir sans tests.
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "${{ needs.plan.outputs.version_only }}" = "false"
            test "${{ needs.plan.outputs.docs_only }}" = "false"
          fi
          if [ "${{ needs.plan.outputs.version_only }}" = "true" ]; then
            echo "PR de version seule : suite déjà validée sur main, parts sautées"
            exit 0
          fi
          if [ "${{ needs.plan.outputs.docs_only }}" = "true" ]; then
            echo "PR de documentation seule : ses lecteurs seulement, parts sautées"
            test "${{ needs.doc-readers.result }}" = success
            exit 0
          fi
          # code changed: psycopg always runs (an empty matrix, e.g. tests moved to
          # a subfolder, is an error); psql may be skipped when the plan gave it no part.
          # #940 : même piège que ci-dessus ; un psql en échec ou annulé (parts non
          # vides) doit rougir le check requis, jamais conclure SUCCESS.
          test "${{ needs.psycopg.result }}" = success
          test "${{ needs.psql.result }}" = success || { test '${{ needs.plan.outputs.psql }}' = '[]' && test "${{ needs.psql.result }}" = skipped; } || exit 1
          test "${{ needs.platform-macos.result }}" = success
