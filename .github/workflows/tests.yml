# SPDX-License-Identifier: AGPL-3.0-only
# Intégration continue d'ameesh : la suite sur un vrai Postgres 17, avec les
# deux pilotes de base (psql et psycopg). Aucun secret n'est utilisé : chaque
# base de service n'existe que le temps de sa part.
#
# L116 — la suite est découpée en parts parallèles par scripts/test-parts.py
# (par module, équilibré par tests/parts/durees.json), chaque part avec son
# propre Postgres :
#   - psycopg : la suite complète, en 4 parts, sur chaque PR et chaque push ;
#   - psql    : sur une PR, seulement les modules « pilote »
#               (tests/parts/pilote-psql.txt) ; la suite complète, en 6 parts,
#               sur push vers main ou release/*, et à la main (workflow_dispatch).
# Le job final « tests » agrège les parts : c'est le nom de vérification stable.
#
# L157 — une PR qui ne change QUE le numéro de version (pyproject.toml seul, la
# seule ligne `version = "…"`) ne relance pas la suite : `main` l'a déjà
# validée pour ce contenu. Le job « changements » le détecte
# (scripts/version-only.py) ; les parts sont alors sautées et « tests » reste
# vert. Au moindre doute, la suite tourne ; jamais sur un push ni à la main.
#
# L161a — même chose pour une PR de documentation seule (docs/, site/, *.md
# hors src/, tests/, .github/ et examples/) : seuls ses lecteurs déclarés
# (tests/parts/lecteurs-doc.txt) tournent, sans base, dans « lecteurs de la
# doc ». Et une exécution de main n'est jamais annulée par la suivante : chaque
# fusion garde son verdict.
#
# L161b — chaque part écrit ses résultats au fil de l'eau (--flux, JSON lignes,
# un test par ligne, schéma ameesh-test-event/1), publiés en artefact
# (flux-<pilote>-<part>) et résumés dans le résumé du job (scripts/ci-flux.py).
# Les modules de test touchés par les fichiers changés (--depuis HEAD^1 : la
# cible pour une PR, le commit précédent sur main) passent en premier dans
# chaque part. Rien n'est sauté ; le découpage en parts ne change pas.
name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

# une exécution de PR dépassée (nouveau commit sur la PR) est annulée ; hors
# PR, chaque exécution a son propre groupe : ni annulée, ni écartée en attente
# (GitHub n'en garde qu'une en attente par groupe), même sans cancel-in-progress
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # L161b : commit poussé (tête de la PR), à côté du commit de fusion testé
  AMEESH_CI_TETE: ${{ github.event.pull_request.head.sha || github.sha }}
  AMEESH_TEST_DSN: postgresql://ameesh@127.0.0.1:5432/ameesh
  PGPASSWORD: ameesh-ci
  AMEESH_REQUIRE_DB: "1"
  AMEESH_BALANCE_INTERVAL: "0"
  PYTHONPATH: src

jobs:
  # L157, L161a : PR de version seule, de documentation seule ? (commit de
  # fusion de la PR face à sa cible)
  changes:
    name: changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.diff.outputs.version_only }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
      doc_readers: ${{ steps.diff.outputs.doc_readers }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        name: PR de version ou de documentation seule ?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "version_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/version-only.py HEAD^1 HEAD >> "$GITHUB_OUTPUT"

  psycopg:
    name: psycopg ${{ matrix.part }}/4
    needs: changes
    if: needs.changes.outputs.version_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432:5432"]
        # base jetable : données en mémoire
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      AMEESH_DRIVER: psycopg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # L161b : HEAD^1, pour l'ordre
      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # environnement Python en cache : la clé suit pyproject.toml
      - id: venv
        uses: actions/cache@v4
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-psycopg-${{ hashFiles('pyproject.toml') }}
      - name: dépendances (pilote psycopg)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install 'psycopg[binary]>=3.1' 'cryptography>=41' 'psutil>=5.9'
      - &base
        name: base jetable (sans fsync) et client psql
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql "$AMEESH_TEST_DSN" -q -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - &git
        name: identité git des tests (dépôts temporaires)
        run: |
          git config --global user.name "ameesh ci"
          git config --global user.email "ci@ameesh.invalid"
          git config --global init.defaultBranch main
      - name: part ${{ matrix.part }}/4
        run: >-
          .venv-ci/bin/python scripts/test-parts.py lancer --parts 4 --part ${{ matrix.part }}
          --pilote psycopg --depuis HEAD^1 --flux "$RUNNER_TEMP/flux.jsonl"
      - &resume
        name: résumé du flux
        if: always()
        run: python scripts/ci-flux.py resume "$RUNNER_TEMP/flux.jsonl" >> "$GITHUB_STEP_SUMMARY"
      - name: flux en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-psycopg-${{ matrix.part }}
          path: ${{ runner.temp }}/flux.jsonl
          if-no-files-found: ignore
          retention-days: 14

  psql:
    name: psql ${{ matrix.part }}/${{ github.event_name == 'pull_request' && 1 || 6 }}
    needs: changes
    if: needs.changes.outputs.version_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      AMEESH_DRIVER: psql
      PARTS: ${{ github.event_name == 'pull_request' && 1 || 6 }}
      # sur une PR : les modules « pilote » seulement
      LISTE: ${{ github.event_name == 'pull_request' && 'tests/parts/pilote-psql.txt' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - *base
      - *git
      - name: part ${{ matrix.part }}
        run: >-
          python scripts/test-parts.py lancer --parts "$PARTS" --part ${{ matrix.part }}
          --pilote psql ${LISTE:+--liste "$LISTE"} --depuis HEAD^1 --flux "$RUNNER_TEMP/flux.jsonl"
      - *resume
      - name: flux en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-psql-${{ matrix.part }}
          path: ${{ runner.temp }}/flux.jsonl
          if-no-files-found: ignore
          retention-days: 14

  # L63 : la couche plateforme (ameesh.platform) et son lint, sans base, sous
  # macOS avec psutil. Sous Linux, les parts psycopg passent par psutil et les
  # parts psql (sans psutil) par le repli /proc.
  platform-macos:
    name: plateforme macOS
    needs: changes
    if: needs.changes.outputs.version_only != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      AMEESH_REQUIRE_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: psutil
        run: python -m pip install 'psutil>=5.9'
      - name: couche plateforme et lint
        run: python -m unittest -v tests.test_l63_platform.PlatformTest tests.test_l63_platform.LintTest

  # L161a : PR de documentation seule, ses lecteurs déclarés seulement, sans base
  doc-readers:
    name: lecteurs de la doc
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AMEESH_REQUIRE_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lecteurs de la doc
        run: python -m unittest -v ${{ needs.changes.outputs.doc_readers }}

  # nom de vérification stable : vert seulement si toutes les parts le sont
  # (L157 : ou si la PR ne change que le numéro de version, parts sautées ;
  # L161a : ou que de la documentation, et ses lecteurs sont verts)
  tests:
    name: tests
    if: always()
    needs: [changes, psycopg, psql, platform-macos, doc-readers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: bilan des parts
        run: |
          echo "changements : ${{ needs.changes.result }} (version seule : ${{ needs.changes.outputs.version_only }}, doc seule : ${{ needs.changes.outputs.docs_only }})"
          echo "doc     : ${{ needs.doc-readers.result }}"
          echo "psycopg : ${{ needs.psycopg.result }}"
          echo "psql    : ${{ needs.psql.result }}"
          echo "macOS   : ${{ needs.platform-macos.result }}"
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.version_only }}" = "true" ]; then
            echo "PR de version seule : suite déjà validée sur main, parts sautées"
            exit 0
          fi
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            echo "PR de documentation seule : ses lecteurs seulement, parts sautées"
            test "${{ needs.doc-readers.result }}" = success
            exit 0
          fi
          test "${{ needs.psycopg.result }}" = success
          test "${{ needs.psql.result }}" = success
          test "${{ needs.platform-macos.result }}" = success
