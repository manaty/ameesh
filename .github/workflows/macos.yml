# SPDX-License-Identifier: AGPL-3.0-only
# #3198 — la suite complète sous macOS, hors du chemin du paquet.
#
# Le job `platform-macos` de « tests » exécutait la suite du plan sous macOS
# (8 parts psycopg, PostgreSQL installé dans une étape) : 2 h 40 à 3 h 50 par
# tête (runs 39934625577, 39919541641, 39895964473). `fire.ready_pr` et
# `packet_automerge` attendent tout le rollup, donc la PR de paquet ne partait
# pas seule (#2415, run 39983066190), et les minutes macOS pèsent ~10× le
# Linux sur le budget Actions. Ce workflow sort cette suite du `pull_request`
# des paquets :
#   - `schedule` : une fois par nuit sur main, la preuve de portabilité
#     complète, sans retenir aucun paquet ;
#   - `workflow_dispatch` : la même suite à la main (main, release/**,
#     integration/**), pour mesurer ou rejouer sans attendre la nuit ;
#   - label `ci-macos` sur une PR : la suite complète sur la tête de cette PR.
#
# `pull_request_target` et non `pull_request` (décision #3198) : l'évènement
# `labeled` de `pull_request` est déjà le déclencheur de la CI de gel de
# tests.yml, et toute autre étiquette y est refusée. Poser `ci-macos` réveille
# donc AUSSI tests.yml : ses jobs portent tous `github.event.label.name !=
# 'ci-macos'`, et son agrégat change de nom sur cette étiquette — le check
# requis `tests` n'est ni rougi ni verdi sans tests, le check de la demande de
# gel reste seul à porter ce nom (témoin `CiMacosCoexistenceTest`). Le
# déclencheur `pull_request_target` évite en plus que ce workflow soit réveillé
# par une étiquette de gel `ci-lot`/`ci-full`. La tête doit appartenir au
# dépôt (jamais une fourche), le code exécuté est celui de la PR, le jeton est
# `contents: read` et aucun secret n'est utilisé.
#
# Le job court `platform-macos` de tests.yml (couche plateforme L63/L66, sans
# base, borné à 20 min) reste le verdict rapide de chaque PR de paquet ;
# #3026 (macOS vert) décidera de la désignation du check requis macOS, sans
# ramener la suite longue dans le chemin du paquet.
#
# #4063 : le plan une fois (job `plan`, Linux), puis une part psycopg par job
# macOS, côte à côte ; les huit parts en série dans un job dépassaient 240 min.
#
# #3042 : PostgreSQL n'est pas un `service:` — macOS n'a pas de conteneurs —
# et les outils GNU (findutils pour `find -printf`) viennent de Homebrew, pour
# donner à la suite le même socle shell que les hôtes Linux qu'elle teste.
name: macos

on:
  schedule:
    # 03:17 UTC (05:17 Europe/Paris en été) : hors des coupures horaires de
    # paquet, une seule suite macOS complète par nuit.
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request_target:
    types: [labeled]
    branches: [main, "release/**", "integration/**"]

permissions:
  contents: read

# #4567 : les suites longues (nocturne, dispatch, étiquette `ci-macos`)
# partagent UN groupe. `max-parallel` ne borne qu'un run : le nocturne, un
# dispatch sur un autre réf et une étiquette `ci-macos` pouvaient tenir trois
# suites à la fois (six parts), au-delà des cinq jobs macOS hébergés — dont le
# job court requis `platform-macos` de tests.yml. Une seule suite longue tient
# donc la capacité ; un run en cours n'est jamais annulé
# (`cancel-in-progress: false`) et les suivants attendent leur tour — seul un
# run encore en attente peut être remplacé par un plus récent.
#
# Une étiquette de gel `ci-lot`/`ci-full` réveille aussi ce workflow : elle
# reçoit un groupe unique (son run ne fait rien, ses jobs sont sautés) et ne
# peut donc ni annuler ni retarder une suite en cours. Poser `ci-macos` deux
# fois remplace le run encore en attente, jamais celui qui tourne.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' && github.event.label.name == 'ci-macos')) && 'macos-suite' || github.run_id }}
  cancel-in-progress: false

jobs:
  # #4063 : le plan une fois, sur Linux (la sélection `--mode full` ne dépend
  # pas de l'OS), puis une part psycopg par job macOS. Les huit parts en série
  # dans un seul job dépassaient le plafond : runs 40295524043 (part 8 coupée
  # à 240 min) et 40477342997 (runner perdu après 3 h 34, part 5).
  plan:
    name: plan
    # `labeled` se déclenche pour toute étiquette : ici seulement `ci-macos`,
    # sur une tête du dépôt (une fourche n'exécute pas notre code sur un
    # runner hébergé avec le jeton du dépôt).
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_target'
          && github.event.label.name == 'ci-macos'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      psycopg: ${{ steps.plan.outputs.psycopg }}
      psycopg_parts: ${{ steps.plan.outputs.psycopg_parts }}
      plan_sha256: ${{ steps.plan_digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # La tête de la PR pour `ci-macos`, le commit du déclencheur sinon.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # carte et ascendance pour le plan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # #3207 : pas de cache pip — sous `pull_request_target`,
          # setup-python écrirait un cache dans la portée de la branche de
          # base à partir du pyproject de la PR (l'auditeur de #3198 l'a
          # écarté ; une suite par nuit ou à la demande n'en a pas besoin).
      - id: plan
        name: plan complet (toute la suite, quel que soit le diff)
        # `--mode full` : la preuve macOS ne dépend pas de la sélection
        # impactés du lot ; même une PR de documentation passe toute la suite.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 scripts/test-plan.py plan --out plan.json --mode full \
            --event "$EVENT" --base HEAD^1 --ref "$GITHUB_REF" \
            --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: le plan donne des parts psycopg
        env:
          PARTS: ${{ steps.plan.outputs.psycopg_parts }}
        run: |
          case "$PARTS" in
            ''|0)
              echo "::error::le plan complet ne donne aucune part psycopg" >&2
              exit 1 ;;
          esac
      - id: plan_digest
        name: empreinte du plan (canal artefacts, #1256 B4)
        run: echo "sha256=$(sha256sum plan.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 3

  suite:
    name: suite macOS complète ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }}
    needs: plan
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_target'
          && github.event.label.name == 'ci-macos'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26-intel
    strategy:
      # #4557 : deux parts longues au plus par run, même la nuit : le job
      # court requis platform-macos doit pouvoir accéder aux runners hébergés.
      max-parallel: 2
      # N1 de la revue #393 : toutes les parts tournent avant l'échec ; une
      # part rouge n'annule pas les autres.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.psycopg) }}
    # Une part : 20 à 47 min mesurées sous macOS (runs 40176501547,
    # 40477342997), plus ~5 min d'installation. 90 min laissent la marge d'un
    # runner lent sans retenir une part bloquée pendant des heures.
    timeout-minutes: 90
    env:
      AMEESH_REQUIRE_DB: "1"
      AMEESH_CI_TETE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # des tests lisent l'historique du dépôt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # #3207 : pas de cache pip (voir le job plan).
      - name: PostgreSQL et outils GNU (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          # #3130 : `flock` (staging.sh, verrou d'opérateur unique #2448) est
          # util-linux, absent de macOS ; la formule `flock` fournit la même
          # commande (flock(2), `-n` sur un descripteur) dans son bin/.
          brew install postgresql@17 bash coreutils gnu-sed findutils flock
          {
            echo "$(brew --prefix postgresql@17)/bin"
            echo "$(brew --prefix bash)/bin"
            echo "$(brew --prefix coreutils)/libexec/gnubin"
            echo "$(brew --prefix gnu-sed)/libexec/gnubin"
            echo "$(brew --prefix findutils)/libexec/gnubin"
            echo "$(brew --prefix flock)/bin"
          } >> "$GITHUB_PATH"
      - name: base jetable (PostgreSQL dans une étape, pas un service)
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          PGDATA="$RUNNER_TEMP/pgdata"
          rm -rf -- "$PGDATA"
          initdb -D "$PGDATA" -U ameesh --auth=trust --encoding=UTF8 --locale=en_US.UTF-8 --no-sync
          pg_ctl -D "$PGDATA" -l "$RUNNER_TEMP/postgres.log" -o \
            "-p 5432 -k $RUNNER_TEMP -c listen_addresses=127.0.0.1 -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \
            start
          tries=0
          until pg_isready -h 127.0.0.1 -p 5432 -U ameesh >/dev/null 2>&1; do
            tries=$((tries + 1))
            if [ "$tries" -ge 30 ]; then
              cat "$RUNNER_TEMP/postgres.log" >&2 || true
              echo "::error::PostgreSQL n'a pas démarré sous 30 s" >&2
              exit 1
            fi
            sleep 1
          done
          createdb -h 127.0.0.1 -p 5432 -U ameesh ameesh
          psql -h 127.0.0.1 -p 5432 -U ameesh -d ameesh -v ON_ERROR_STOP=1 -c 'select version()'
      - name: dépendances Python (psutil, psycopg, chiffrement, PyYAML)
        run: >-
          python -m pip install 'psutil>=5.9' 'psycopg[binary]>=3.1'
          'cryptography>=41' 'pyyaml>=6' 'coverage>=7.10'
      - name: paquet importable par les sous-processus hors du dépôt
        run: python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}
      - name: le plan téléchargé est celui du plan (empreinte, #1256 B4)
        # L'empreinte vient de la sortie du job plan, qu'aucun autre job ne
        # réécrit : une part dont le plan ne correspond pas n'exécute rien.
        run: echo "${{ needs.plan.outputs.plan_sha256 }}  $RUNNER_TEMP/plan.json" | shasum -a 256 -c -
      - name: part ${{ matrix.part }}/${{ needs.plan.outputs.psycopg_parts }} (pilote psycopg)
        env:
          AMEESH_DRIVER: psycopg
          AMEESH_TEST_DSN: postgresql://ameesh@127.0.0.1:5432/ameesh
          # socket Unix court : macOS place TMPDIR sous /var/folders, au-delà
          # de la limite AF_UNIX pour les tests qui ouvrent un socket.
          TMPDIR: /tmp/ameesh-ci
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          python3 scripts/test-parts.py run --plan "$RUNNER_TEMP/plan.json" \
            --part ${{ matrix.part }} --driver psycopg
