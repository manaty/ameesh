# SPDX-License-Identifier: AGPL-3.0-only
# L161e — carte test → code mesurée (scripts/map.py), régénérée à chaque
# fusion sur main, hors du chemin critique : ce workflow n'est jamais une
# vérification requise, et un test en échec sous mesure est noté dans la
# carte, pas reporté.
#
# La suite passe sous mesure (couverture par test, sous-processus compris,
# fichiers lus, tables touchées) : psycopg en 6 parts, plus les modules
# « pilote » en psql en 4 parts (le code propre au pilote psql n'est exécuté
# que là).
# Le job « carte » fusionne les mesures en carte.json.gz (ameesh-carte/1) :
#   - cache GitHub Actions `carte-<sha>` (une PR lit les caches de sa branche
#     de base ; clé de repli `carte-`), sur main et à la main seulement ;
#   - artefact `carte` de l'exécution (30 jours), pour ameesh et les agents.
# Jamais dans le dépôt : elle changerait à chaque fusion.
#
# Sur une PR qui touche la mesure elle-même, la carte est produite pour
# contrôle (artefact seulement, pas de cache).
#
# #1341 — répartition et complétude de la mesure :
#   - A : le découpage des parts sous mesure est pondéré par les durées de la
#     carte précédente (`--map`), pas par la table statique mesurée sans
#     couverture : le surcoût de la mesure varie de 1,2× à 9,3× selon les
#     modules, et la table statique ne couvre que 76 modules sur 250 ;
#   - B : les modules « pilote » psql sont mesurés en 4 parts, et les modules
#     psycopg en 6 (une seule part de 45 modules pesait 38 min de mur pour un
#     plafond de 40, annulée deux fois ; le run 38845518821 du 16/10 a encore
#     annulé psycopg 2/4, 3/4 et psql 1/2, 2/2 à 40m30, d'où le resserrage à
#     plafond conservé — arbitrage pilote du 16/10) ;
#   - D : la fusion refuse de publier une carte si une part attendue manque ou
#     n'a pas écrit ses `durees.json` (part annulée), ou si la matrice de
#     mesure n'est pas verte ; elle vérifie aussi la couverture *effective*
#     (`--plan`) : chaque module du plan mesuré une seule fois, dans la part
#     que le plan lui assigne, aucun omis ni doublé. Une carte incomplète ne
#     remplace pas la précédente : elle en perdrait les durées (la fusion
#     n'hérite que des échecs), et le découpage des runs suivants retomberait
#     sur la table statique. `PARTS_MESURE` est le miroir de la matrice
#     `mesure`, tenu par tests/test_carte_parts_completes.py.
#   - R1 (#1341, relecture Codex indépendante) : la carte est lue et le
#     découpage calculé UNE seule fois par run, par le job `plan-mesure` ; le
#     plan obtenu est publié en artefact et toutes les parts le lisent
#     (`test-parts.py run --plan`). Avant, chaque part restaurait la carte du
#     cache et recalculait son découpage : deux jobs pouvaient lire deux cartes
#     différentes (cache écrit entre-temps par une PR ou main), produire des
#     parts disjointes — un module omis, un autre doublé — toutes avec des
#     `durees.json` non vides, et D publiait une carte incomplète avec une
#     matrice verte (témoin K1/K2 de la R1).
name: carte

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/map.py
      - scripts/map_measure.py
      - scripts/test-parts.py
      - tests/support.py
      - .github/workflows/carte.yml
  workflow_dispatch:

# #1314 — une carte de main n'est jamais annulée par la poussée suivante : la
# mesure est longue, la main bouge toutes les quelques minutes, et
# `cancel-in-progress: true` ne publiait presque jamais de carte (runs
# 38558057012, 38560201871, 38570320372 annulés), d'où des PR qui ne
# sélectionnaient plus rien. Même règle que tests.yml (#824) : GitHub garde un
# run en cours et un seul en attente, remplacé par le suivant, donc la carte
# publiée est toujours celle de la main la plus récente. Une PR qui touche la
# mesure garde son propre groupe, annulé quand une poussée le dépasse : une
# mesure dépassée n'a plus d'objet.
#
# #1316 — le dispatch ne partage plus le groupe de main : GitHub annule le run
# en attente d'un groupe quand un nouveau run y entre, donc un dispatch (même
# hors main) pouvait remplacer la carte de main en attente et la perdre. Comme
# tests.yml (#824, décision owner #17605), le dispatch garde une identité par
# run : il ne remplace plus rien. Contrepartie assumée : un dispatch manuel
# peut courir à côté d'une mesure de main.
concurrency:
  group: carte-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AMEESH_TEST_DSN: postgresql://ameesh@127.0.0.1:5432/ameesh
  PGPASSWORD: ameesh-ci
  AMEESH_REQUIRE_DB: "1"
  AMEESH_BALANCE_INTERVAL: "0"
  PYTHONPATH: src
  # #1341 D — miroir de jobs.mesure.strategy.matrix.include : toute part
  # ajoutée, retirée ou renumérotée là-bas doit l'être ici, et
  # tests/test_carte_parts_completes.py refuse la divergence. Le plan unique
  # du run (job `plan-mesure`) et la fusion (job `carte`) lisent la même
  # liste : une seule source pour les parts attendues.
  PARTS_MESURE: >-
    mesure-psycopg-1 mesure-psycopg-2 mesure-psycopg-3 mesure-psycopg-4
    mesure-psycopg-5 mesure-psycopg-6
    mesure-psql-1 mesure-psql-2 mesure-psql-3 mesure-psql-4

# Linux jobs run on the self-hosted ameesh-ci runners (one persistent host,
# four runners): GitHub's free tier caps hosted jobs at 20 for the whole
# organisation. A pull request from a fork never reaches that host (the
# repository is public: its code would run on a shared, persistent machine);
# it stays on ubuntu-latest, like the macOS job and the Pages deployment.
jobs:
  # #1341 R1 — le plan de la mesure, calculé une seule fois par run : toutes
  # les parts lisent le même découpage (`--plan`). Le découpage ne dépend donc
  # plus de la carte présente sur chaque runner au moment où le job démarre.
  plan-mesure:
    name: plan de mesure
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # une seule lecture de la carte par run ; la table statique est le repli
      - uses: actions/cache/restore@v4
        with:
          path: carte/carte.json.gz
          key: carte-${{ github.sha }}
          restore-keys: carte-
      - name: plan unique du run
        run: |
          mkdir -p plan
          CARTE=carte/carte.json.gz
          [ -f "$CARTE" ] || CARTE=""
          python3 scripts/test-parts.py plan --out plan/plan.json \
            --parts "$PARTS_MESURE" --list-psql tests/parts/pilote-psql.txt \
            ${CARTE:+--map "$CARTE"} --summary "$GITHUB_STEP_SUMMARY"
          # la fusion réutilise la carte qui a servi au plan (historique des
          # échecs) : le plan et la carte publiée décrivent le même run.
          if [ -f "$CARTE" ]; then cp "$CARTE" plan/carte-source.json.gz; fi
      - uses: actions/upload-artifact@v4
        with:
          name: plan-mesure
          path: plan
          retention-days: 3

  mesure:
    name: mesure ${{ matrix.pilote }} ${{ matrix.part }}/${{ matrix.parts }}
    needs: plan-mesure
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    # 16/10 — arbitrage pilote sur le run 38845518821 (main fae0df2b3) :
    # plafond 40 min conservé, répartition resserrée à 6 parts psycopg et
    # 4 parts psql (psycopg 2/4, 3/4 et psql 1/2, 2/2 annulées à 40m30).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pilote: psycopg, part: 1, parts: 6 }
          - { pilote: psycopg, part: 2, parts: 6 }
          - { pilote: psycopg, part: 3, parts: 6 }
          - { pilote: psycopg, part: 4, parts: 6 }
          - { pilote: psycopg, part: 5, parts: 6 }
          - { pilote: psycopg, part: 6, parts: 6 }
          - { pilote: psql, part: 1, parts: 4 }
          - { pilote: psql, part: 2, parts: 4 }
          - { pilote: psql, part: 3, parts: 4 }
          - { pilote: psql, part: 4, parts: 4 }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]  # host port chosen by docker: several runners share the host
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      AMEESH_DRIVER: ${{ matrix.pilote }}
    steps:
      - uses: actions/checkout@v4
      # #1341 R1 : le plan unique du run, calculé par `plan-mesure` — chaque
      # part lit le même découpage et ne restaure plus la carte elle-même.
      - uses: actions/download-artifact@v4
        with:
          name: plan-mesure
          path: ${{ runner.temp }}
      - name: port de la base jetable
        run: echo "AMEESH_TEST_DSN=postgresql://ameesh@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ameesh" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: environnement de mesure
        run: |
          python -m venv .venv-carte
          if [ "$AMEESH_DRIVER" = psycopg ]; then
            # #1476 : PyYAML est la dépendance des tests qui lisent
            # deploy/k8s (tests/test_cluster.py, ManifestesTest) ; sans elle,
            # ces manifestes n'étaient lus par aucun test mesuré et un diff
            # qui les touchait renvoyait le lot à la suite complète.
            .venv-carte/bin/pip install -q 'coverage>=7.10' 'psycopg[binary]>=3.1' 'cryptography>=41' 'psutil>=5.9' 'pyyaml>=6'
          else
            .venv-carte/bin/pip install -q 'coverage>=7.10' 'pyyaml>=6'
          fi
          .venv-carte/bin/python scripts/map.py install
      - name: base jetable (sans fsync) et client psql
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql "$AMEESH_TEST_DSN" -q -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - name: identité git des tests (dépôts temporaires)
        run: |
          # own global config per job: runners sharing the host never race on ~/.gitconfig
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "ameesh ci"
          git config --global user.email "ci@ameesh.invalid"
          git config --global init.defaultBranch main
      - name: part sous mesure
        run: |
          M="$RUNNER_TEMP/mesure"
          mkdir -p "$M"
          debut=$(date +%s)
          # #1341 R1 : plan unique du run (job `plan-mesure`), le même pour
          # toutes les parts ; plus de carte restaurée ni de découpage
          # recalculé ici.
          # jamais bloquant : un échec sous mesure est noté dans la carte
          .venv-carte/bin/python scripts/test-parts.py run --plan "$RUNNER_TEMP/plan.json" \
            --part ${{ matrix.part }} --driver "$AMEESH_DRIVER" \
            --measure "$M" --output-durations "$M/durees.json" --flow "$M/flux.jsonl" \
            || echo "::warning::tests en échec sous mesure (notés dans la carte)"
          echo "durée sous mesure : $(( $(date +%s) - debut )) s" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesure-${{ matrix.pilote }}-${{ matrix.part }}
          path: ${{ runner.temp }}/mesure
          include-hidden-files: true  # cov/.coverage.*
          if-no-files-found: ignore
          retention-days: 1

  carte:
    name: carte
    needs: mesure
    # #876 : la mesure n'est jamais bloquante, mais une exécution annulée ne
    # doit pas laisser cet agrégat en file des heures (always() seul le recrée).
    if: always() && !cancelled()
    # supprimer les mesures du run (étape finale) ; le reste du workflow reste en lecture
    permissions:
      contents: read
      actions: write
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q 'coverage>=7.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: mesure-*
          path: mesures
      # #1341 R1 : le plan unique du run, et la carte qui l'a produit (même
      # historique d'échecs que le plan, pas une carte relue plus tard).
      - uses: actions/download-artifact@v4
        with:
          name: plan-mesure
          path: plan
      - name: fusion des mesures
        env:
          RESULTAT_MESURE: ${{ needs.mesure.result }}
        run: |
          # #1341 D : aucune carte n'est publiée à partir d'une mesure
          # incomplète. Le résultat de la matrice attrape la part annulée
          # (plafond, runner perdu) ; --attendu attrape l'artefact publié sans
          # durées et la part absente du disque ; --plan vérifie la couverture
          # effective : aucun module du plan omis, doublé ou hors de sa part.
          if [ "$RESULTAT_MESURE" != "success" ]; then
            echo "::error::mesure $RESULTAT_MESURE : carte non publiée (part en échec ou annulée)"
            exit 1
          fi
          mkdir -p carte
          if [ -f plan/carte-source.json.gz ]; then
            cp plan/carte-source.json.gz carte/precedente.json.gz
          fi
          python scripts/map.py merge --output carte/carte.json.gz \
            --previous carte/precedente.json.gz --plan plan/plan.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --attendu "$PARTS_MESURE" mesures/*
          rm -f carte/precedente.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: carte
          path: carte/carte.json.gz
          retention-days: 30
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: carte/carte.json.gz
          key: carte-${{ github.sha }}
      # Quota d'artefacts de l'organisation, plein le 15/10 (2,4 Go de mesures
      # gardées un jour) : les mesures ne servent qu'à ce job, on les supprime
      # dès la carte faite. Seule la carte (30 jours) reste. Jamais bloquant ;
      # pas de condition « toujours » (#1341 : rien ne tourne sur échec de la fusion,
      # les mesures d'un échec expirent seules en un jour).
      - name: supprimer les mesures intermédiaires
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/actions
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/runs/${{ github.run_id }}/artifacts?per_page=100" |
            python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin).get("artifacts", []) if a["name"].startswith("mesure-")]' |
            while read -r id; do
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/artifacts/$id" && echo "mesure $id supprimée"
            done
