# SPDX-License-Identifier: AGPL-3.0-only
# L161e — carte test → code mesurée (scripts/map.py), régénérée à chaque
# fusion sur main, hors du chemin critique : ce workflow n'est jamais une
# vérification requise, et un test en échec sous mesure est noté dans la
# carte, pas reporté.
#
# La suite passe sous mesure (couverture par test, sous-processus compris,
# fichiers lus, tables touchées) : psycopg en 4 parts, plus les modules
# « pilote » en psql (le code propre au pilote psql n'est exécuté que là).
# Le job « carte » fusionne les mesures en carte.json.gz (ameesh-carte/1) :
#   - cache GitHub Actions `carte-<sha>` (une PR lit les caches de sa branche
#     de base ; clé de repli `carte-`), sur main et à la main seulement ;
#   - artefact `carte` de l'exécution (30 jours), pour ameesh et les agents.
# Jamais dans le dépôt : elle changerait à chaque fusion.
#
# Sur une PR qui touche la mesure elle-même, la carte est produite pour
# contrôle (artefact seulement, pas de cache).
#
# #1341 — répartition et complétude de la mesure :
#   - A : le découpage des parts sous mesure est pondéré par les durées de la
#     carte précédente (`--map`), pas par la table statique mesurée sans
#     couverture : le surcoût de la mesure varie de 1,2× à 9,3× selon les
#     modules, et la table statique ne couvre que 76 modules sur 250 ;
#   - B : les modules « pilote » psql sont mesurés en 2 parts (une seule part
#     de 45 modules pesait 38 min de mur pour un plafond de 40, annulée deux
#     fois) ;
#   - D : la fusion refuse de publier une carte si une part attendue manque ou
#     n'a pas écrit ses `durees.json` (part annulée), ou si la matrice de
#     mesure n'est pas verte. Une carte incomplète ne remplace pas la
#     précédente : elle en perdrait les durées (la fusion n'hérite que des
#     échecs), et le découpage des runs suivants retomberait sur la table
#     statique. `PARTS_MESURE` est le miroir de la matrice `mesure`, tenu par
#     tests/test_carte_parts_completes.py.
name: carte

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/map.py
      - scripts/map_measure.py
      - scripts/test-parts.py
      - tests/support.py
      - .github/workflows/carte.yml
  workflow_dispatch:

# #1314 — une carte de main n'est jamais annulée par la poussée suivante : la
# mesure est longue, la main bouge toutes les quelques minutes, et
# `cancel-in-progress: true` ne publiait presque jamais de carte (runs
# 38558057012, 38560201871, 38570320372 annulés), d'où des PR qui ne
# sélectionnaient plus rien. Même règle que tests.yml (#824) : GitHub garde un
# run en cours et un seul en attente, remplacé par le suivant, donc la carte
# publiée est toujours celle de la main la plus récente. Le dispatch partage le
# groupe de main : une seule mesure à la fois sur la flotte. Une PR qui touche
# la mesure garde son propre groupe, annulé quand une poussée le dépasse : une
# mesure dépassée n'a plus d'objet.
concurrency:
  group: carte-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AMEESH_TEST_DSN: postgresql://ameesh@127.0.0.1:5432/ameesh
  PGPASSWORD: ameesh-ci
  AMEESH_REQUIRE_DB: "1"
  AMEESH_BALANCE_INTERVAL: "0"
  PYTHONPATH: src

# Linux jobs run on the self-hosted ameesh-ci runners (one persistent host,
# four runners): GitHub's free tier caps hosted jobs at 20 for the whole
# organisation. A pull request from a fork never reaches that host (the
# repository is public: its code would run on a shared, persistent machine);
# it stays on ubuntu-latest, like the macOS job and the Pages deployment.
jobs:
  mesure:
    name: mesure ${{ matrix.pilote }} ${{ matrix.part }}/${{ matrix.parts }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pilote: psycopg, part: 1, parts: 4 }
          - { pilote: psycopg, part: 2, parts: 4 }
          - { pilote: psycopg, part: 3, parts: 4 }
          - { pilote: psycopg, part: 4, parts: 4 }
          - { pilote: psql, part: 1, parts: 2, liste: tests/parts/pilote-psql.txt }
          - { pilote: psql, part: 2, parts: 2, liste: tests/parts/pilote-psql.txt }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]  # host port chosen by docker: several runners share the host
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      AMEESH_DRIVER: ${{ matrix.pilote }}
      LISTE: ${{ matrix.liste }}
    steps:
      - uses: actions/checkout@v4
      # #1341 A : la carte précédente donne les durées *sous mesure* qui
      # pondèrent le découpage ; la table statique reste le repli.
      - uses: actions/cache/restore@v4
        with:
          path: carte/carte.json.gz
          key: carte-${{ github.sha }}
          restore-keys: carte-
      - name: port de la base jetable
        run: echo "AMEESH_TEST_DSN=postgresql://ameesh@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ameesh" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: environnement de mesure
        run: |
          python -m venv .venv-carte
          if [ "$AMEESH_DRIVER" = psycopg ]; then
            .venv-carte/bin/pip install -q 'coverage>=7.10' 'psycopg[binary]>=3.1' 'cryptography>=41' 'psutil>=5.9'
          else
            .venv-carte/bin/pip install -q 'coverage>=7.10'
          fi
          .venv-carte/bin/python scripts/map.py install
      - name: base jetable (sans fsync) et client psql
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql "$AMEESH_TEST_DSN" -q -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - name: identité git des tests (dépôts temporaires)
        run: |
          # own global config per job: runners sharing the host never race on ~/.gitconfig
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "ameesh ci"
          git config --global user.email "ci@ameesh.invalid"
          git config --global init.defaultBranch main
      - name: part sous mesure
        run: |
          M="$RUNNER_TEMP/mesure"
          mkdir -p "$M"
          debut=$(date +%s)
          CARTE=carte/carte.json.gz
          [ -f "$CARTE" ] || CARTE=""
          # jamais bloquant : un échec sous mesure est noté dans la carte
          .venv-carte/bin/python scripts/test-parts.py run --parts ${{ matrix.parts }} \
            --part ${{ matrix.part }} --driver "$AMEESH_DRIVER" ${LISTE:+--list "$LISTE"} \
            ${CARTE:+--map "$CARTE"} \
            --measure "$M" --output-durations "$M/durees.json" --flow "$M/flux.jsonl" \
            || echo "::warning::tests en échec sous mesure (notés dans la carte)"
          echo "durée sous mesure : $(( $(date +%s) - debut )) s" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesure-${{ matrix.pilote }}-${{ matrix.part }}
          path: ${{ runner.temp }}/mesure
          include-hidden-files: true  # cov/.coverage.*
          if-no-files-found: ignore
          retention-days: 1

  carte:
    name: carte
    needs: mesure
    if: always()
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # #1341 D — miroir de jobs.mesure.strategy.matrix.include : toute part
      # ajoutée, retirée ou renumérotée là-bas doit l'être ici, et
      # tests/test_carte_parts_completes.py refuse la divergence.
      PARTS_MESURE: >-
        mesure-psycopg-1 mesure-psycopg-2 mesure-psycopg-3 mesure-psycopg-4
        mesure-psql-1 mesure-psql-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q 'coverage>=7.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: mesure-*
          path: mesures
      # carte précédente : historique des échecs sous mesure (14 jours)
      - uses: actions/cache/restore@v4
        with:
          path: carte/carte.json.gz
          key: carte-${{ github.sha }}
          restore-keys: carte-
      - name: fusion des mesures
        env:
          RESULTAT_MESURE: ${{ needs.mesure.result }}
        run: |
          # #1341 D : aucune carte n'est publiée à partir d'une mesure
          # incomplète. Le résultat de la matrice attrape la part annulée
          # (plafond, runner perdu) ; --attendu attrape l'artefact publié sans
          # durées et la part absente du disque.
          if [ "$RESULTAT_MESURE" != "success" ]; then
            echo "::error::mesure $RESULTAT_MESURE : carte non publiée (part en échec ou annulée)"
            exit 1
          fi
          if [ -f carte/carte.json.gz ]; then mv carte/carte.json.gz carte/precedente.json.gz; fi
          mkdir -p carte
          python scripts/map.py merge --output carte/carte.json.gz \
            --previous carte/precedente.json.gz --summary "$GITHUB_STEP_SUMMARY" \
            --attendu "$PARTS_MESURE" mesures/*
          rm -f carte/precedente.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: carte
          path: carte/carte.json.gz
          retention-days: 30
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: carte/carte.json.gz
          key: carte-${{ github.sha }}
