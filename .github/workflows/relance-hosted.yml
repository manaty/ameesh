# SPDX-License-Identifier: AGPL-3.0-only
# #987 — relance d'un job hébergé annulé faute de runner, ou d'un job
# auto-hébergé ayant perdu son runner (#2954).
#
# GitHub annule un job hébergé quand aucun runner ne l'a pris après plusieurs
# tentatives (« The job was not acquired by Runner of type hosted », contrainte
# de capacité macOS arm64 : run 38428931108, job 115427733668, 13/10/2026). Le
# job `platform-macos` de « tests » conclut alors `cancelled` sans qu'une seule
# étape tourne ; il n'est pas encore requis par l'agrégat `tests` (décision de
# la revue #393), mais une annulation de capacité doit rester visible et reprise.
# L'API refuse de rejouer le job tant que l'exécution tourne : la reprise doit
# venir d'ici, APRÈS la conclusion — d'où le déclencheur `workflow_run`, et non
# une étape de « tests ».
#
# Un groupe de runners auto-hébergés peut aussi disparaître en cours de part
# (incident du 21/10/2026, run 39554271532 : huit parts de `ameesh-ci-1`
# interrompues, aucun test rouge). Le job conclut `failure`, l'étape utile
# `cancelled`, aucune étape `failure` : la garde reconnaît cette signature
# (#2954), jamais une annulation de concurrence (job `cancelled`).
#
# La garde relit les jobs de l'exécution terminée (scripts/ci-relance-hosted.py)
# et, si les seuls jobs en échec sont des jobs hébergés annulés avant leur
# premier pas ou des jobs auto-hébergés ayant perdu leur runner, rejoue les
# jobs en échec et leurs dépendants
# (`rerun-failed-jobs`), une seule fois : la tentative suivante prouve si la
# capacité ou la flotte est revenue. Un échec réel, une annulation de
# concurrence, une deuxième annulation ou une tentative déjà relancée ne sont
# jamais masqués — le check reste rouge, un humain tranche.
#
# #1002 : un événement `workflow_run` peut être rejoué à la main ; la garde
# relit alors `run_attempt` courant et refuse un événement périmé. Le groupe de
# concurrence sérialise en plus les gardes d'une même exécution, pour que deux
# événements (tentative 1 puis 2) ne se croisent pas.
#
# #2119 : `paquet.yml` appelle cette suite par `workflow_call` (portier §12).
# GitHub n'émet pas d'événement `workflow_run` pour le workflow réutilisable
# appelé : l'exécution terminée est celle de « paquet ». Sans ce nom dans la
# liste, un job hébergé annulé faute de runner dans un paquet n'est jamais
# relancé, et son check requis y reste rouge par capacité, pas par code
# (discussion community 72631). La décision du script, elle, est générique sur
# les jobs du run : aucun nom de workflow n'y est en dur.
#
# Ce workflow s'exécute depuis la branche par défaut (le fichier doit y être
# pour que `workflow_run` se déclenche) ; `actions/checkout` y prend donc le
# code de la branche par défaut, jamais celui de la PR : le jeton `actions:
# write` n'exécute que du code de confiance. Il tourne sur `ubuntu-latest`,
# pas sur la flotte auto-hébergée saturée (#824) ni sur les runners macOS dont
# la capacité manque.
name: relance hosted

on:
  workflow_run:
    workflows: ["tests", "paquet"]
    types: [completed]

permissions:
  contents: read

# #1002 : les gardes d'une même exécution « tests » ne se croisent pas ; une
# tentative 2 attend la fin de la garde de la tentative 1 (jamais annulée).
concurrency:
  group: relance-hosted-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  relance:
    name: relance des jobs annulés faute de runner
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # actions/checkout, branche par défaut
      actions: write   # rerun-failed-jobs
    steps:
      - uses: actions/checkout@v4
      - name: décision et relance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci-relance-hosted.py
          --run-id "${{ github.event.workflow_run.id }}"
          --tentative "${{ github.event.workflow_run.run_attempt }}"
          --conclusion "${{ github.event.workflow_run.conclusion }}"
          --apply
