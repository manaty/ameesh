# SPDX-License-Identifier: AGPL-3.0-only
# L88 — the embeddable interface (ui/, docs/design/etudes/ui-integrable.md §5):
# its build is committed under src/ameesh/ui/static/ so that `pip install`
# delivers it without Node. This job checks, with Node:
#   - the client types match docs/api/openapi-v1.json (`npm run gen`);
#   - the sources type-check;
#   - the unit and component tests, axe-core on every component (jsdom);
#   - the committed build is the build of the sources, byte for byte, and the
#     whole stays under 80 KB compressed (`npm run check`).
# The Python side (the /ui/ page of `ameesh serve`, its CSP, the components'
# contract on the sources, the theme's contrasts) is in tests/test_l88_ui.py.
name: ui

on:
  push:
    branches: [main, "release/**"]
    paths: ["ui/**", "src/ameesh/ui/**", "docs/api/openapi-v1.json", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["ui/**", "src/ameesh/ui/**", "docs/api/openapi-v1.json", ".github/workflows/ui.yml"]
  workflow_dispatch:

concurrency:
  group: ui-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Linux jobs run on the self-hosted ameesh-ci runners (one persistent host,
# four runners): GitHub's free tier caps hosted jobs at 20 for the whole
# organisation. A pull request from a fork never reaches that host (the
# repository is public: its code would run on a shared, persistent machine);
# it stays on ubuntu-latest, like the macOS job and the Pages deployment.
#
# Borrowed capacity (lot #1256, option A of the R2 B1 arbitration): a lending
# host runs SINGLE-USE runners under the DISTINCT label `ameesh-lent`, never
# `ameesh-ci`, so no job of the fleet — in particular the required check
# `tests` of tests.yml and everything it needs — can land there. This job is
# not a required check (branch protection requires `tests` only), is not
# needed by it, holds no write permission and feeds nothing the required path
# reads, so it may target the borrowed label when a loan is armed; the
# admissible list and the residual risk are in deploy/guest/PILOT-ci-nexlink.md
# §3. `vars.AMEESH_LENT_RUNS_ON` is unset outside a loan, and the job stays on
# the fleet.
jobs:
  ui:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.AMEESH_LENT_RUNS_ON || '["self-hosted", "linux", "ameesh-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
