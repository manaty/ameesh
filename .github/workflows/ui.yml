# SPDX-License-Identifier: AGPL-3.0-only
# L88 — the embeddable interface (ui/, docs/design/etudes/ui-integrable.md §5):
# its build is committed under src/ameesh/ui/static/ so that `pip install`
# delivers it without Node. This job checks, with Node:
#   - the client types match docs/api/openapi-v1.json (`npm run gen`);
#   - the sources type-check;
#   - the unit and component tests, axe-core on every component (jsdom);
#   - the committed build is the build of the sources, byte for byte, and the
#     whole stays under 80 KB compressed (`npm run check`).
# The Python side (the /ui/ page of `ameesh serve`, its CSP, the components'
# contract on the sources, the theme's contrasts) is in tests/test_l88_ui.py.
#
# #2449 — canon §3/§11 bis : aucune suite sur une branche de lot. Le
# déclencheur `pull_request` est retiré (une PR de lot touchant `ui/**` ne
# lançait pas seulement ce job : elle le relançait à chaque poussée). Le
# paquet (`integration/**`), `release/**` et `main` gardent le contrôle quand
# les chemins changent ; un dispatch manuel reste possible, borné à une tête
# admise par le pas ci-dessous. La porte de fusion de `main` exige `tests`
# seul (protection de branche relue le 18/10/2026) : `ui` n'est pas un check
# requis et son retrait ne laisse aucune validation requise sans porteur.
# #4036 : la fraîcheur des types clients est aussi contrôlée dans le job
# plan de tests.yml, porté par l'agrégat requis `tests`, sans build UI.
name: ui

on:
  push:
    branches: [main, "release/**", "integration/**"]
    paths: ["ui/**", "src/ameesh/ui/**", "docs/api/openapi-v1.json", ".github/workflows/ui.yml"]
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/integration/') }}

permissions:
  contents: read

# Linux jobs run on the self-hosted ameesh-ci runners (one persistent host,
# four runners): GitHub's free tier caps hosted jobs at 20 for the whole
# organisation. Without a `pull_request` trigger, only this repository's own
# pushes and a manual dispatch reach the job (a fork has none of them): no
# forked code runs on the shared, persistent host.
#
# Borrowed capacity (lot #1256, option A of the R2 B1 arbitration): a lending
# host runs SINGLE-USE runners under the DISTINCT label `ameesh-lent`, never
# `ameesh-ci`, so no job of the fleet — in particular the required check
# `tests` of tests.yml and everything it needs — can land there. This job is
# not a required check (branch protection requires `tests` only), is not
# needed by it, holds no write permission and feeds nothing the required path
# reads, so it may target the borrowed label when a loan is armed; the
# admissible list and the residual risk are in deploy/guest/PILOT-ci-nexlink.md
# §3. `vars.AMEESH_LENT_RUNS_ON` is unset outside a loan, and the job stays on
# the fleet.
jobs:
  ui:
    runs-on: ${{ fromJSON(vars.AMEESH_LENT_RUNS_ON || '["self-hosted", "linux", "ameesh-ci"]') }}
    # Borrowed host: the run's runtime token must not be able to save cache
    # entries. `permissions:` does not bound that token; `cache-mode` does, in
    # the cache service (R1 Codex B3, #1256). `read` keeps setup-node's npm
    # restore and forbids the save.
    cache-mode: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      # #2449 : un dispatch manuel reste possible, jamais depuis une branche de
      # lot (canon §3/§11 bis). Mêmes têtes admises que tests.yml ; la ref est
      # refusée avant tout checkout, sans lancer Node.
      - name: dispatch depuis une tête admise
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/release/*|refs/heads/integration/*|refs/heads/validation/*) ;;
            *)
              echo "::error::workflow_dispatch on '$GITHUB_REF': only main, release/**, integration/** and validation/** may be run by hand (#2449); a lot branch gets no suite"
              exit 1
              ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
