# SPDX-License-Identifier: AGPL-3.0-only
# #8246 (TPK #2202 S6a) — qualification de bout en bout du chemin sandbox sur
# un cluster kind JETABLE.
#
# Ce workflow ne se déclenche QUE manuellement (`workflow_dispatch`) : un lot
# ne pousse pas de CI sur sa branche, la CI tourne sur la tête gelée avant la
# fusion (canon §3/§11 bis). Le pilote le lance sur la tête gelée ou sur la
# branche d'intégration avant le paquet.
#
# Il exécute `deploy/k8s/sandbox-witness/preuve-sandbox-kind.sh` : canon de
# test, admission S2, réservations S3, superviseur S4 réel, Job Kubernetes
# réel, jeton de relais lié au tour (S4d-3) et appel du relais DEPUIS le Job,
# résultat accepté une seule fois par S1, reçu relu par `ameesh sandbox show`
# et `/api/v1/sandbox`. Les cas annulation, redémarrage du superviseur, bail
# perdu, doublon et Job orphelin sont joués sur le même cluster.
#
# Runner GitHub rootful : le Job joint le relais de l'hôte par la passerelle
# du réseau Docker `kind`. En local rootless (slirp4netns), lancer le script
# avec `--no-host-relay` (le jeton reste qualifié, le coût est `kept`).
name: sandbox-kind

on:
  workflow_dispatch:

concurrency:
  group: sandbox-kind-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PGPASSWORD: ameesh-ci
  AMEESH_REQUIRE_DB: "1"
  PYTHONPATH: src
  #: épinglés : kind v0.27.0 (nœud Kubernetes 1.32) et kubectl 1.32.2,
  #: téléchargés avec leur empreinte SHA-256 publiée.
  KIND_VERSION: v0.27.0
  KUBECTL_VERSION: v1.32.2
  #: nom du cluster jetable, réutilisé par le nettoyage final
  KIND_CLUSTER: ameesh-sandbox-witness

jobs:
  temoin:
    name: témoin kind sandbox (#8246)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ameesh
          POSTGRES_PASSWORD: ameesh-ci
          POSTGRES_DB: ameesh
        ports: ["5432"]  # le port hôte est choisi par Docker (plusieurs runners par hôte)
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U ameesh"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: port de la base jetable
        run: echo "AMEESH_TEST_DSN=postgresql://ameesh@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/ameesh" >> "$GITHUB_ENV"
      - name: dépendances Python (psycopg, PyYAML)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check . pyyaml
      - name: kind et kubectl (versions épinglées, empreinte vérifiée)
        run: |
          set -euo pipefail
          dl=https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION
          curl -fsSL --retry 3 -o /tmp/kind-linux-amd64 "$dl/kind-linux-amd64"
          curl -fsSL --retry 3 -o /tmp/kind-linux-amd64.sha256sum "$dl/kind-linux-amd64.sha256sum"
          ( cd /tmp && sha256sum --check kind-linux-amd64.sha256sum )
          sudo install -m 0755 /tmp/kind-linux-amd64 /usr/local/bin/kind
          curl -fsSL --retry 3 -o /tmp/kubectl \
            "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -fsSL --retry 3 -o /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
          ( cd /tmp && echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check )
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client=true
      - name: qualification complète (#8246)
        run: |
          set -euo pipefail
          echo "trace: sha=$(git rev-parse HEAD)"
          echo "trace: branche=${GITHUB_REF_NAME}"
          #: --keep : le cluster survit à un échec pour les journaux ci-dessous ;
          #: le nettoyage final le supprime dans tous les cas.
          deploy/k8s/sandbox-witness/preuve-sandbox-kind.sh --keep
      - name: journaux kind en échec
        if: failure()
        run: |
          kind export logs /tmp/kind-logs --name "$KIND_CLUSTER" || true
      - name: artefact des journaux en échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: kind-logs-sandbox
          path: /tmp/kind-logs
          if-no-files-found: ignore
          retention-days: 3
      - name: suppression du cluster jetable
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true
