# #6002 : compte de transfert seul pour l'adaptateur VM (bureau-goal -> base centrale).
Match User ameesh-vmtunnel
    AllowTcpForwarding local
    PermitOpen 10.77.0.1:5432
    PermitListen none
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    GatewayPorts no
    ForceCommand /bin/false
Match all
