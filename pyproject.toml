[build-system]
requires = ["setuptools>=77"]  # licence SPDX (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "agent-mesh"
version = "0.1.0"
description = "Mesh multi-harnais : boîte aux lettres durable sur Postgres, un exécuteur par machine, baux d'agents."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# Pas de classifier `License ::` : depuis PEP 639, il est incompatible avec
# l'expression SPDX ci-dessus (setuptools refuse le build — verdict codex3 B1).
# psycopg est optionnel : sans lui, la couche db utilise le binaire psql.
dependencies = []

[project.optional-dependencies]
psycopg = ["psycopg[binary]>=3.1"]

[project.scripts]
ameesh = "ameesh.main:main"
#: alias conservés : les hooks des trois harnais appellent agent-mail
agent-mail = "ameesh.cli:main"
agent-runner = "ameesh.runner:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ameesh = ["migrations/*.sql"]
