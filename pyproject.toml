[build-system]
requires = ["setuptools>=77"]  # licence SPDX (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "ameesh"
version = "1.31.0"
description = "Coordination d'équipes mixtes humains et agents IA : exécuteur multi-harnais, canon OKF, fil lisible, actions sous porte et approbations signées."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# Pas de classifier `License ::` : depuis PEP 639, il est incompatible avec
# l'expression SPDX ci-dessus (setuptools refuse le build — verdict codex3 B1).
# L61 : psycopg est la voie normale, donc une dépendance. Une « extra par
# défaut » n'existe pas pour pip (PEP 771 non adoptée) : `pip install ameesh`
# n'installerait pas l'extra, et le pilote psql — un sous-processus et une
# connexion TLS par requête, 1 à 2 s chacune vers une base distante — deviendrait
# la voie de fait. Les roues binaires couvrent x86_64 et aarch64 (Linux, macOS,
# Windows) ; ailleurs, psycopg pur Python utilise la libpq du système, et sans
# elle l'import échoue proprement : la couche db retombe alors sur `psql`
# (repli conservé, `ameesh doctor` le signale si la base est distante).
# LISTEN/NOTIFY uses Connection.notifies(timeout=), available since psycopg 3.2.
dependencies = [
    "psycopg[binary]>=3.2; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'arm64'",
    "psycopg>=3.2; platform_machine != 'x86_64' and platform_machine != 'AMD64' and platform_machine != 'aarch64' and platform_machine != 'arm64'",
    # L63 : la couche plateforme (`ameesh.platform`) lit processus, heure de
    # démarrage et mesures de l'hôte par psutil (roues Linux, macOS, Windows).
    # Sous Linux, un repli par /proc reste en place si psutil manque ; ailleurs,
    # sans psutil, les garanties refusent (NotAvailable) au lieu de passer.
    "psutil>=5.9",
]

[project.optional-dependencies]
#: conservée pour les commandes d'installation existantes (`ameesh[psycopg]`)
psycopg = ["psycopg[binary]>=3.2"]
crypto = ["cryptography>=41"]

[project.scripts]
ameesh = "ameesh.main:main"
#: alias conservés : les hooks des trois harnais appellent agent-mail.
#: #1604 : l'entrée passe par `ameesh.entry`, qui sert `hook` et `statusline`
#: sans importer le paquet complet (`ameesh.cli` reste la porte de tout le reste).
agent-mail = "ameesh.entry:main"
agent-runner = "ameesh.runner:main"
#: service d'approbation humaine (spec §9), lancé sous son propre utilisateur
ameesh-approve = "ameesh.approve.cli:main"
# Isolated, one-shot IT execution proof producer; never an agent credential.
ameesh-it-proof = "ameesh.modules.it.proof_service:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ameesh = ["migrations/*.sql", "progress_page.html", "harness_descriptors/*.json",
          "consignes/*.md", "deepseek_cgroup.cjs", "ui/static/*"]
"ameesh.mediated_executor" = ["contract.json"]
"ameesh.approve" = ["static/*.js", "static/*.css"]

# H7: keep the pinned factory and its complete relative import chain in wheels.
[tool.setuptools.data-files]
"share/ameesh/mise-a-jour" = [
    "deploy/mise-a-jour/canari-handoff.py",
    "deploy/mise-a-jour/dispatch-local-handoff.py",
    "deploy/mise-a-jour/installer-local-handoff.py",
    "deploy/mise-a-jour/scellement-runtime.py",
    "deploy/mise-a-jour/*.py",
    "deploy/mise-a-jour/fabrique-handoff.py",
    "deploy/mise-a-jour/hote-handoff.py",
    "deploy/mise-a-jour/pont-handoff.py",
    "deploy/mise-a-jour/secrets-handoff.py",
    "deploy/mise-a-jour/coffre-release.py",
    "deploy/mise-a-jour/transport-secrets.py",
    "deploy/mise-a-jour/transport-release.py",
    "deploy/mise-a-jour/controleur-release.py",
    "deploy/mise-a-jour/environnement-versionne.py",
]

"share/ameesh/mise-a-jour/systemd" = [
    "deploy/mise-a-jour/systemd/ameesh-handoff-local.socket",
    "deploy/mise-a-jour/systemd/ameesh-handoff-local@.service",
]
