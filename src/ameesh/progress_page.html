<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<!-- Vue de référence d'ameesh progress (L24, décision 0024 ; feuille de route L96 ;
     onglets, fenêtres de détail et rafraîchissement L304) : page autonome, sans
     ressource externe. Les données (schéma ameesh-progress/1) sont embarquées plus
     bas par `ameesh progress --html` ; servie par `ameesh progress --serve`, le
     bouton Refresh relit /api/progress.json (connect-src 'self' ajouté alors). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="referrer" content="no-referrer">
<title>ameesh progress</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --phase-build: #2a78d6; --phase-review: #eb6834; --phase-merge: #1baf7a;
  --good: #0ca30c; --warning: #b57a00; --critical: #d03b3b; --neutral: #898781;
  --now: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #a3a29b;
    --grid: #2c2c2a; --axis: #383835;
    --phase-build: #3987e5; --phase-review: #d95926; --phase-merge: #199e70;
    --good: #0ca30c; --warning: #fab219; --critical: #e66767; --neutral: #898781;
    --now: #ffffff;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #a3a29b;
  --grid: #2c2c2a; --axis: #383835;
  --phase-build: #3987e5; --phase-review: #d95926; --phase-merge: #199e70;
  --good: #0ca30c; --warning: #fab219; --critical: #e66767; --neutral: #898781;
  --now: #ffffff;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 1200px; margin: 0 auto; padding: 0 16px 16px; }
h1 { font-size: 1.25rem; margin: 0 0 2px; }
h2 { font-size: 1rem; margin: 0 0 10px; letter-spacing: .02em; }
.sub { color: var(--ink-2); font-size: .85rem; }
section { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px;
          padding: 14px; margin-top: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--ink-2);
          margin-bottom: 10px; }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 2px;
            margin-right: 5px; vertical-align: middle; }
.axis { position: relative; height: 18px; margin-left: 0; font-size: .7rem; color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.lot { border-top: 1px solid var(--grid); padding: 8px 0; }
.lot:first-of-type { border-top: 0; }
.lot-head { display: flex; gap: 8px; align-items: baseline; cursor: pointer;
            background: none; border: 0; padding: 0; color: inherit; font: inherit;
            width: 100%; text-align: left; }
.lot-id { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.lot-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { flex: none; font-size: .72rem; padding: 1px 7px; border-radius: 9px;
        border: 1px solid currentColor; white-space: nowrap; }
.st-active { color: var(--phase-build); } .st-review { color: var(--warning); }
.st-blocked { color: var(--critical); } .st-approved { color: var(--good); }
.st-merged { color: var(--neutral); } .st-closed { color: var(--neutral); }
.st-stale { color: var(--warning); border-style: dashed; }
.seg.stale { background: repeating-linear-gradient(90deg, var(--neutral) 0 3px, transparent 3px 7px) !important; opacity: .7; }
.waiting { color: var(--ink-2); font-size: .8rem; margin-top: 3px; }
.epic { border-top: 1px solid var(--grid); padding: 8px 0; }
.epic:first-of-type { border-top: 0; }
.epic .bar { position: relative; height: 8px; background: var(--grid); border-radius: 4px; margin-top: 4px; }
.epic .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--phase-merge); }
.st-working { color: var(--good); } .st-idle { color: var(--neutral); }
.st-paused { color: var(--warning); } .st-stopped { color: var(--critical); }
.track { position: relative; height: 14px; margin-top: 6px; }
.tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
.seg { position: absolute; top: 3px; height: 8px; }
.seg + .seg { border-left: 2px solid var(--surface); }
.seg.first { border-radius: 4px 0 0 4px; } .seg.last { border-radius: 0 4px 4px 0; }
.seg.first.last { border-radius: 4px; }
.seg.open { opacity: .55; }
.mark { position: absolute; top: 0; width: 2px; height: 14px; background: var(--ink); }
.nowline { position: absolute; top: -2px; bottom: -2px; width: 0;
           border-left: 1px dashed var(--now); opacity: .6; }
.lot-detail { display: none; font-size: .8rem; color: var(--ink-2); margin-top: 6px; }
.lot.open .lot-detail { display: block; }
.lot-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0; }
.lot-detail dt { color: var(--muted); }
.lot-detail dd { margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--grid); border-radius: 8px; padding: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { color: var(--ink-2); font-size: .8rem; }
.task { font-size: .82rem; margin-top: 4px; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile .v { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--ink-2); font-size: .78rem; }
.gauge { margin-top: 12px; }
.gauge .bar { position: relative; height: 10px; background: var(--grid); border-radius: 5px; margin-top: 4px; }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--phase-build); }
.gauge .fill.over { background: var(--critical); }
.gauge .cap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
table { border-collapse: collapse; width: 100%; font-size: .8rem; margin-top: 10px; }
th, td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--grid); }
th { color: var(--muted); font-weight: 500; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.empty { color: var(--muted); font-size: .85rem; }
.trunc { color: var(--warning); font-size: .85rem; margin: 0 0 8px; }
ul.missing { color: var(--ink-2); font-size: .8rem; padding-left: 18px; margin: 0; }
.project { border-top: 1px solid var(--grid); padding: 10px 0; }
.project:first-of-type { border-top: 0; padding-top: 0; }
.project-name { font-weight: 600; }
.warn { color: var(--warning); font-size: .82rem; margin-top: 3px; }
.account { border-top: 1px solid var(--grid); padding: 8px 0; }
.account:first-child { border-top: 0; }
.subhead { font-size: .85rem; color: var(--ink-2); margin: 12px 0 4px; }
.project.idle-project { opacity: .7; }
footer { color: var(--muted); font-size: .75rem; margin: 16px 0 8px; }
/* L96 : feuille de route (Gantt), prévu face au réel */
.rm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rm-toggle { font: inherit; font-size: .78rem; color: var(--ink-2); background: none;
             border: 1px solid var(--grid); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
.rm-group { color: var(--muted); font-size: .75rem; letter-spacing: .04em; margin: 12px 0 2px; }
.rm-row { border-top: 1px solid var(--grid); padding: 6px 0; }
.rm-label { display: flex; gap: 8px; align-items: baseline; font-size: .86rem; }
.rm-label .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rm-track { position: relative; height: 16px; margin-top: 4px; }
.rm-plan { position: absolute; top: 2px; height: 12px; border-radius: 3px;
           border: 1px dashed var(--phase-build); background: transparent; }
.rm-real { position: absolute; top: 5px; height: 6px; border-radius: 3px; background: var(--phase-build); }
.rm-real.done { background: var(--phase-merge); }
.rm-real.late { background: var(--critical); }
.rm-mark { position: absolute; top: 3px; width: 10px; height: 10px; margin-left: -5px;
           transform: rotate(45deg); background: var(--ink); }
.rm-mark.due { background: transparent; border: 2px solid var(--warning); }
.rm-mark.done { transform: none; border-radius: 50%; background: var(--phase-merge); }
.rm-mark.decision { transform: none; border-radius: 50%; background: var(--warning); }
.rm-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
.rm-today { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px solid var(--critical); }
.rm-detail { color: var(--ink-2); font-size: .76rem; margin-top: 2px; overflow-wrap: anywhere; }
.rm-detail a { color: inherit; }
.rm-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 8px; font-size: .82rem; }
.rm-controls .seg button { font: inherit; padding: 2px 10px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
.rm-controls .seg button:first-child { border-radius: 4px 0 0 4px; }
.rm-controls .seg button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
.rm-controls .seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.rm-scroll { overflow-x: auto; }
.rm-gr { border-top: 1px solid var(--grid); }
.rm-gr > summary { cursor: pointer; padding: 6px 0; list-style-position: inside; }
.rm-gr > summary .rm-label { display: inline-flex; width: calc(100% - 2em); font-weight: 600; }
.rm-gr > summary .meta { font-weight: 400; }
.rm-gr .rm-row { padding-left: 14px; }
/* zoom jour : libellés et détails restent visibles pendant le défilement */
.rm-inner .rm-label, .rm-inner .rm-detail { position: sticky; left: 0; max-width: calc(100vw - 48px); }
.st-late { color: var(--critical); } .st-proposed { color: var(--warning); border-style: dashed; }
.st-done { color: var(--good); }
/* L304 : en-tête, onglets, cartes de projet, tables, fenêtres de détail */
header.top { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 10px 0 0;
  border-bottom: 1px solid var(--grid); }
.top-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.top-row h1 { margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--ink-2); font-size: .8rem; }
.controls select, .controls button { font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 6px; padding: 3px 8px; }
.controls button { cursor: pointer; }
.controls button:disabled { color: var(--muted); cursor: not-allowed; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: thin; }
.tab { font: inherit; font-size: .9rem; color: var(--ink-2); background: none; border: 0;
  border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--phase-build); font-weight: 600; }
.badge { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px; border-radius: 9px;
  font-size: .72rem; text-align: center; background: var(--grid); color: var(--ink); }
.badge.hot { background: var(--warning); color: #000; }
section.panel { background: none; border: 0; padding: 0; margin-top: 14px; }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 12px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
button.stat { display: flex; flex-direction: column; align-items: flex-start; text-align: left; font: inherit; color: inherit;
  background: var(--page); border: 1px solid var(--grid); border-radius: 8px; padding: 6px 8px; cursor: pointer; min-width: 0; }
.stat .v { font-size: 1.3rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .l { color: var(--ink-2); font-size: .7rem; line-height: 1.2; }
.stat.hot { border-color: var(--warning); }
.stat.hot .v { color: var(--warning); }
.ms { font-size: .85rem; margin-top: 2px; overflow-wrap: anywhere; }
.pbar { position: relative; height: 8px; background: var(--grid); border-radius: 4px; margin: 4px 0 6px; overflow: hidden; }
.pfill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--phase-merge); border-radius: 4px; }
.watch, .boxed { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 12px; margin-top: 12px; }
.line { padding: 3px 0; font-size: .86rem; overflow-wrap: anywhere; }
button.link { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  text-align: left; text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
button.link:hover { text-decoration-color: currentColor; }
.tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; }
.tbar input.filter { flex: 1 1 200px; max-width: 360px; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
table.data { margin-top: 0; background: var(--surface); }
button.sort { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
th[aria-sort="ascending"] button.sort::after { content: " ▲"; }
th[aria-sort="descending"] button.sort::after { content: " ▼"; }
tr.row { cursor: pointer; }
tr.row:hover, tr.row:focus { background: var(--grid); outline: none; }
td.wide { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog#modal { width: min(720px, 94vw); max-height: 88vh; overflow: auto; padding: 0; color: var(--ink);
  background: var(--surface); border: 1px solid var(--axis); border-radius: 12px; }
dialog#modal::backdrop { background: rgba(0, 0, 0, .45); }
.modal-head { position: sticky; top: 0; display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--grid); }
.modal-head h2 { margin: 0; overflow-wrap: anywhere; }
.modal-head button { font: inherit; color: var(--ink-2); background: none; border: 1px solid var(--grid);
  border-radius: 6px; padding: 1px 8px; cursor: pointer; }
#modal-body { padding: 8px 16px 16px; }
#modal-body h3 { font-size: .85rem; color: var(--ink-2); margin: 14px 0 4px; letter-spacing: .02em; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; font-size: .85rem; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
code.cmd { display: inline-block; font-size: .8rem; background: var(--page); border: 1px solid var(--grid);
  border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
p.question { font-size: .95rem; margin: 8px 0; overflow-wrap: anywhere; }
ul.options { margin: 0 0 8px; padding-left: 20px; font-size: .86rem; }
details.missing-box { margin-top: 14px; color: var(--ink-2); font-size: .8rem; }
.warn { color: var(--warning); }
/* L160f (#497) : onglet Versions — dernière publiée, prochaine release */
.vhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.vpub { font-size: .85rem; margin: 6px 0 2px; overflow-wrap: anywhere; }
.vtag { color: var(--warning); }
.vnext { margin-top: 6px; }
.vthemes { margin: 6px 0 0; font-size: .82rem; }
.vthemes summary { cursor: pointer; color: var(--ink-2); }
.vthemes details { margin: 2px 0 2px 12px; }
.vthemes ul { margin: 2px 0 4px; padding-left: 18px; }
.vthemes li { margin: 2px 0; overflow-wrap: anywhere; }
p.summary { font-size: .86rem; margin: 6px 0; }
#refresh-status.warn { font-size: .8rem; }
/* L83 : la conversation d'un agent dans la fiche (0024) — lecture et saisie */
.conv-list { margin: 4px 0; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--grid); }
.conv { border-bottom: 1px solid var(--grid); padding: 5px 0; }
.conv-human { background: var(--page); }
.conv-head { color: var(--muted); font-size: .74rem; }
.conv-text { font-size: .84rem; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.conv-form { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; flex-wrap: wrap; }
.conv-form textarea { flex: 1 1 14rem; min-height: 34px; resize: vertical; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--grid); border-radius: 6px; padding: 5px 7px; }
.conv-form button { font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--grid); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.conv-form button:disabled { color: var(--muted); cursor: default; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } main { padding: 0 10px 10px; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="top-row">
      <h1 id="title">Progress</h1>
      <div class="controls">
        <label>project <select id="project" aria-label="project"></select></label>
        <button type="button" id="refresh">Refresh</button>
        <label><input type="checkbox" id="auto-refresh"> every 60 s</label>
        <button type="button" id="theme">theme: auto</button>
      </div>
    </div>
    <div class="sub"><span id="asof"></span> <span id="refresh-status" role="status"></span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="views"></nav>
  </header>

  <section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
  <section class="panel" id="panel-versions" role="tabpanel" aria-labelledby="tab-versions" hidden></section>
  <section class="panel" id="panel-gantt" role="tabpanel" aria-labelledby="tab-gantt" hidden></section>
  <section class="panel" id="panel-lots" role="tabpanel" aria-labelledby="tab-lots" hidden></section>
  <section class="panel" id="panel-agents" role="tabpanel" aria-labelledby="tab-agents" hidden></section>
  <section class="panel" id="panel-budget" role="tabpanel" aria-labelledby="tab-budget" hidden></section>
  <section class="panel" id="panel-decisions" role="tabpanel" aria-labelledby="tab-decisions" hidden></section>

  <footer id="foot"></footer>
</main>

<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-head">
    <h2 id="modal-title"></h2>
    <button type="button" id="modal-close" aria-label="close">close ✕</button>
  </div>
  <div id="modal-body"></div>
</dialog>

<script type="application/json" id="data">/*__AMEESH_PROGRESS_DATA__*/null</script>
<script>
"use strict";
(function () {
  // L304 : "served" sous `ameesh progress --serve` : la page arrive sans
  // données et lit /api/progress.json avec le jeton (en-tête Authorization),
  // au chargement puis à chaque Refresh ; "static" pour un fichier --html
  // (données embarquées, rien à relire)
  var MODE = /*__AMEESH_PROGRESS_MODE__*/"static";
  // #5244 : la part faite (activée) d'une fiche, la fusion sur un ancien instantané
  function doneShare(x) { return x.progress_active === null || x.progress_active === undefined ? x.progress : x.progress_active; }
  function activationText(x) {
    return x.lots_active || x.lots_waiting_activation || x.lots_unmeasured
      ? ", " + x.lots_active + " active, " + x.lots_waiting_activation + " not active yet, " + x.lots_unmeasured + " not measured" : "";
  }
  var API = "/api/progress.json", CHAT = "/api/conversation.json";
  var TOKEN_KEY = "ameesh-progress-token", TOKEN = "";
  var D = JSON.parse(document.getElementById("data").textContent || "null");
  var TABS = [["overview", "Overview"], ["versions", "Versions"], ["gantt", "Gantt"],
              ["lots", null], ["agents", "Agents"], ["budget", "Budget"],
              ["decisions", "Decisions"]];
  // L102 T3 (#4393) : le nom d'une tâche dans le vocabulaire du module actif,
  // lu dans l'instantané (`vocabulary`) ; sans lui, celui du cœur (CORE)
  var CORE_W = {singular: "tâche", plural: "tâches", title: "Tâche", title_plural: "Tâches", abbreviation: "tâche(s)"};
  function W() { var v = D && D.vocabulary; return v && v.singular ? v : CORE_W; }
  function tabLabel(t) { return t[0] === "lots" ? W().title_plural : t[1]; }
  var LOT_FR = {active: "active", review: "in review", blocked: "blocked", approved: "approved", merged: "merged", closed: "closed"};
  var LOT_ICON = {active: "▶", review: "◐", blocked: "■", approved: "✓", merged: "●", closed: "✕"};
  var LOT_ORDER = {blocked: 0, review: 1, approved: 2, active: 3, merged: 4, closed: 5};
  var AG_FR = {working: "working", idle: "idle", paused: "paused", stopped: "stopped"};
  var AG_ICON = {working: "▶", idle: "○", paused: "‖", stopped: "■"};
  var AG_ORDER = {working: 0, paused: 1, idle: 2, stopped: 3};
  var PAY_FR = {plan: "plan", token: "token"};

  // -- état de la vue : onglet, projet et rafraîchissement auto dans l'URL

  // outbox:begin — §16 (#3889) : la boîte d'envoi de la conversation.
  // Chaque message a SA propre entrée sur l'appareil (localStorage), écrite
  // avec son Idempotency-Key AVANT l'envoi ; aucun nouvel envoi n'efface un

  var Outbox = (function () {

    function drop(m) { var s = store(); try { if (s) s.removeItem(slot(m)); } catch (e) {} }
    function all() {
      var s = store(), out = [];

      try {

          if (!k || k.indexOf(PREFIX) !== 0) continue;

          }
          out.push(m);

    }
    function of(agent) { return all().filter(function (m) { return m.agent === agent; }); }
    var quiet = {sending: function () {}, sent: function () {}, checking: function () {}, refused: function () {}};

    function delay(n) { return RETRY_MS[Math.min(n, RETRY_MS.length - 1)]; }
    function post(m) {
      // réponse ou corps suspendus (mandataire, connexion à demi morte) : le
      // délai couvre la requête ET la lecture du corps, puis abandonne ; sans

      var ctl = typeof AbortController === "function" ? new AbortController() : null;

    function acked(d, m) {

  function loadConversation(name, list) {
    if (MODE !== "served") return;

           headers: {"Accept": "application/json", "Authorization": "Bearer " + TOKEN}})
      .then(function (r) {

  // Une requête à la fois, étiquetée (projet + compteur) : un changement de

  // -- feuille de route (L96) : epics, jalons, tâches, engagements et décisions

  //    L304 : tâches groupées par epic (à défaut par projet), groupes repliés,
  //    zoom semaine (la fenêtre tient dans l'écran) ou jour (défilement)
  function renderRoadmap(panel) {
    var R = D.roadmap;
    if (!R) { panel.appendChild(el("p", "empty", "Roadmap left out (--no-gantt).")); return; }
    function dayTs(iso) {
      if (!iso) return null;
      var p = String(iso).split("-");
      return new Date(+p[0], +p[1] - 1, +p[2]).getTime() / 1000;
    }
    function dm(iso) { if (!iso) return "—"; var p = String(iso).split("-"); return p[2] + "/" + p[1]; }
    function dmTs(ts) { if (!ts) return "—"; var d = new Date(ts * 1000); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1); }
    var todayTs = dayTs(R.today) + 43200;
    var LBL = {start: "start", end: "end", delivery: "delivery", demandee: "requested", debut: "in progress",
               soumise: "submitted", verdict: "verdict", livree: "delivered"};
    var ST = {en_cours: "in progress", a_valider: "to validate", validee: "validated", bloquee: "blocked",
              livree: "delivered", abandonnee: "abandoned"};
    var ENDED = {livree: true, abandonnee: true};

    // jours calendaires (minuit local) et non 86 400 s : le 25/10 dure 25 h
    function midnight(ts) { var d = new Date(ts * 1000); d.setHours(0, 0, 0, 0); return d.getTime() / 1000; }
    function addDays(ts, n) { var d = new Date(ts * 1000); d.setDate(d.getDate() + n); return d.getTime() / 1000; }
    // fenêtre : celle de l'instantané, ou celle d'un jalon choisi, du jour la
    // plus tôt au jour le plus tard de toutes ses dates (prévues et réelles),
    // un jour de marge de chaque côté
    var ms = (R.milestones || []).filter(function (m) { return m.id === G.ms; })[0] || null;
    var f = midnight(R.window.from_ts), t = R.window.to_ts;
    if (ms) {
      var mts = [dayTs(ms.planned.start), dayTs(ms.planned.end), dayTs(ms.planned.delivery),
                 ms.real && ms.real.debut, ms.real && ms.real.livree].filter(Boolean);
      if (mts.length) {
        f = addDays(midnight(Math.min.apply(null, mts)), -1);
        t = addDays(midnight(Math.max.apply(null, mts)), 2);
      }
    }
    var sp = Math.max(86400, t - f), days = Math.max(1, Math.round(sp / 86400));
    function px(ts) { return Math.min(100, Math.max(0, (ts - f) / sp * 100)); }

    var tasks = (R.tasks || []).filter(function (x) { return inScope(x.project); });
    var nEnded = tasks.filter(function (x) { return ENDED[x.state]; }).length;

    // commandes : zoom, fenêtre de jalon, tâches terminées, tout déplier
    var bar = el("div", "rm-controls");
    var zoom = el("span", "seg");
    zoom.setAttribute("role", "group"); zoom.setAttribute("aria-label", "zoom");
    [["week", "week"], ["day", "day"]].forEach(function (z) {
      var b = el("button", null, z[1]); b.type = "button";
      b.setAttribute("aria-pressed", G.zoom === z[0] ? "true" : "false");
      b.addEventListener("click", function () { G.zoom = z[0]; saveHash(); renderAll(); });
      zoom.appendChild(b);
    });
    bar.appendChild(zoom);
    if ((R.milestones || []).length) {
      var lab = el("label", null, "window "), sel = el("select");
      var o0 = el("option", null, "whole snapshot"); o0.value = ""; sel.appendChild(o0);
      R.milestones.forEach(function (m) {
        var o = el("option", null, m.id + " " + m.title); o.value = m.id; o.selected = m.id === G.ms; sel.appendChild(o);
      });
      sel.addEventListener("change", function () { G.ms = sel.value; renderAll(); });
      lab.appendChild(sel); bar.appendChild(lab);
    }
    var dl = el("label"), dc = el("input"); dc.type = "checkbox"; dc.checked = G.done;
    dc.addEventListener("change", function () { G.done = dc.checked; renderAll(); });
    dl.appendChild(dc); dl.appendChild(document.createTextNode(" delivered and abandoned (" + nEnded + ")"));
    bar.appendChild(dl);
    var all = el("button", null, "expand all"); all.type = "button";
    bar.appendChild(all);
    panel.appendChild(bar);

    var legend = el("div", "legend");
    legend.setAttribute("aria-hidden", "true");
    [["border:1px dashed var(--phase-build);height:10px", "planned"], ["background:var(--phase-build)", "actual, in progress"],
     ["background:var(--phase-merge)", "actual, delivered"], ["background:var(--critical)", "past the planned date"],
     ["background:var(--ink);width:9px;height:9px;transform:rotate(45deg)", "planned delivery"],
     ["border:2px solid var(--warning);width:9px;height:9px;transform:rotate(45deg)", "commitment due date"],
     ["background:var(--warning);width:9px;height:9px;border-radius:50%", "pending decision"],
     ["background:var(--critical);width:2px;height:12px", "today"]].forEach(function (x) {
      var s = el("span"), i = el("i"); i.setAttribute("style", x[0]); s.appendChild(i);
      s.appendChild(document.createTextNode(x[1])); legend.appendChild(s);
    });
    panel.appendChild(legend);

    // zoom jour : une colonne de 34 px par jour, la frise défile ; semaine : elle tient dans l'écran
    var scroller = el("div", "rm-scroll"), inner = el("div", "rm-inner");
    if (G.zoom === "day") inner.style.minWidth = (days * 34) + "px";
    scroller.appendChild(inner); panel.appendChild(scroller);
    var axis = el("div", "axis"); axis.setAttribute("aria-hidden", "true"); inner.appendChild(axis);
    var box = el("div"); box.id = "roadmap"; inner.appendChild(box);
    var stepDays = G.zoom === "day" ? 1
      : [1, 2, 7, 14, 28].filter(function (k) { return days / k <= Math.max(2, Math.floor((panel.clientWidth || 320) / 56)); })[0] || 28;
    var ticks = [];
    for (var d = new Date(f * 1000); d.getTime() / 1000 < t; d.setDate(d.getDate() + stepDays)) ticks.push(d.getTime() / 1000);
    ticks.forEach(function (ts) { var s = el("span", null, dmTs(ts)); s.style.left = px(ts) + "%"; axis.appendChild(s); });

    function track(parts) {
      var tr = el("div", "rm-track");
      tr.setAttribute("role", "img");
      ticks.forEach(function (ts) { var g = el("div", "rm-tick"); g.style.left = px(ts) + "%"; tr.appendChild(g); });
      parts.forEach(function (p) {
        if (p.mark) {
          if (!p.at || p.at < f || p.at > t) return;
          var m = el("div", "rm-mark" + (p.cls ? " " + p.cls : "")); m.style.left = px(p.at) + "%";
          if (p.title) m.title = p.title;
          tr.appendChild(m); return;
        }
        if (!p.a || !p.b || p.b < f || p.a > t) return;
        var a = px(p.a), z = px(p.b);
        var b = el("div", p.cls); b.style.left = a + "%"; b.style.width = Math.max(0.6, z - a) + "%";
        tr.appendChild(b);
      });
      var n = el("div", "rm-today"); n.style.left = px(todayTs) + "%"; tr.appendChild(n);
      return tr;
    }
    function planned(p) {
      var out = ["start", "end", "delivery"].filter(function (k) { return p && p[k]; })
        .map(function (k) { return LBL[k] + " " + dm(p[k]); });
      return out.length ? "planned: " + out.join(", ") : "no planned date";
    }
    function source(det, src) {
      if (!src || !src.label) return;
      det.appendChild(document.createTextNode(" · source: "));
      if (src.url) { var a = el("a", null, src.label); a.href = src.url; a.rel = "noreferrer noopener"; det.appendChild(a); }
      else det.appendChild(document.createTextNode(src.label));
    }
    function late(head, l) {
      if (!l) return;
      head.appendChild(el("span", "chip st-late", l.open ? "⚠ " + l.days + " d late"
        : "delivered " + l.days + " d late"));
    }
    function hasPlan(p) { return !!(p && (p.start || p.end || p.delivery)); }
    function planBars(p, real, ended) {
      var ps = dayTs(p.start), pe = dayTs(p.end), pd = dayTs(p.delivery);
      var parts = [];
      var pa = ps || (real && (real.debut || real.demandee)), pz = pe || pd;
      if (pa && pz) parts.push({a: pa, b: pz + 86400, cls: "rm-plan"});
      var ra = real && (real.debut || real.demandee), rz = (real && real.livree) || (ended ? null : todayTs);
      var target = pd || pe;
      if (ra && rz) {
        var done = real && real.livree;
        if (target && rz > target + 86400) {
          parts.push({a: ra, b: target + 86400, cls: "rm-real" + (done ? " done" : "")});
          parts.push({a: target + 86400, b: rz, cls: "rm-real late"});
        } else parts.push({a: ra, b: rz, cls: "rm-real" + (done ? " done" : "")});
      }
      if (pd) parts.push({mark: true, at: pd + 43200, title: "planned delivery " + dm(p.delivery)});
      if (real && real.livree) parts.push({mark: true, at: real.livree, cls: "done", title: "delivered " + dmTs(real.livree)});
      return parts;
    }
    // un groupe = <details> ; ouvert ou fermé, il le reste d'un rafraîchissement à l'autre
    var groups = [];
    function group(key, title, count, summaryTrack, openByDefault) {
      var det = el("details", "rm-gr"), sum = el("summary");
      det.open = G.open[key] !== undefined ? G.open[key] : openByDefault;
      det.addEventListener("toggle", function () { G.open[key] = det.open; });
      var head = el("div", "rm-label");
      head.appendChild(el("span", "t", title));
      head.appendChild(el("span", "meta", count));
      sum.appendChild(head);
      if (summaryTrack) sum.appendChild(summaryTrack);
      det.appendChild(sum); box.appendChild(det);
      groups.push({key: key, det: det});
      return det;
    }
    function pkgRow(into, p) {
      var row = el("div", "rm-row"), head = el("div", "rm-label");
      head.appendChild(el("span", "lot-id", p.id));
      head.appendChild(el("span", "t", p.title));
      if (p.units_total) head.appendChild(el("span", "meta", p.units_delivered + "/" + p.units_total + " delivered"
        + (p.units_delivered && p.units_active !== undefined ? ", " + p.units_active + " active, " + p.units_waiting_activation + " not active yet, " + p.units_unmeasured + " not measured" : "")));
      late(head, p.late);
      row.appendChild(head);
      // le réel d'une fiche court jusqu'à aujourd'hui tant que tout n'est pas livré
      var pr = {debut: p.real.debut, livree: doneShare(p) === 1 ? p.real.livree : null};
      row.appendChild(track(planBars(p.planned, pr, false)));
      var det = el("div", "rm-detail", planned(p.planned));
      source(det, p.source);
      row.appendChild(det); into.appendChild(row);
    }
    function taskRow(into, x) {
      var row = el("div", "rm-row"), head = el("div", "rm-label");
      head.appendChild(el("span", "lot-id", "#" + x.id));
      var tt = el("span", "t"); tt.appendChild(link(x.title, function () { openModal("lot", x.id); }));
      head.appendChild(tt);
      head.appendChild(el("span", "chip st-" + (x.state === "livree" ? "done" : x.state === "bloquee" ? "blocked" : "active"), ST[x.state] || x.state));
      late(head, x.late);
      row.appendChild(head);
      row.appendChild(track(planBars(x.planned, x.real, x.state === "abandonnee")));
      var reached = ["demandee", "debut", "soumise", "verdict", "livree"].filter(function (k) { return x.real[k]; })
        .map(function (k) { return LBL[k] + " " + dmTs(x.real[k]); });
      var det = el("div", "rm-detail", [planned(x.planned), reached.length ? "actual: " + reached.join(", ") : "",
        x.activation ? x.activation.label : "",
        x.estimate && x.estimate.minutes ? x.estimate.label : "", x.assignee || ""].filter(Boolean).join(" · "));
      source(det, x.source);
      if (x.commitments.length) det.appendChild(document.createTextNode(" · commitment(s) "
        + x.commitments.map(function (i) { return "e" + i; }).join(", ")));
      row.appendChild(det); into.appendChild(row);
    }

    if ((R.milestones || []).length) {
      var gm = group("milestones", "Milestones", R.milestones.length + "", null, true);
      R.milestones.forEach(function (p) { pkgRow(gm, p); });
    }
    // tâches par epic, à défaut par projet ; les groupes les plus chargés d'abord
    var EPIC = Object.create(null);
    (R.epics || []).forEach(function (e) { EPIC[e.id] = e; });
    var byKey = Object.create(null), order = [];
    // une epic sans aucune tâche a son groupe quand même (sa barre prévue) ;
    // celle dont les tâches sont toutes hors du projet choisi n'en a pas ;
    // sans prototype, un identifiant « constructor » ou « toString » compte aussi
    var hasTask = Object.create(null);
    (R.tasks || []).forEach(function (x) { if (x.epic) hasTask[x.epic] = true; });
    (R.epics || []).forEach(function (e) {
      if (hasTask[e.id]) return;
      byKey["epic:" + e.id] = {key: "epic:" + e.id, rows: [], epic: e, title: null}; order.push("epic:" + e.id);
    });
    tasks.forEach(function (x) {
      var k = x.epic ? "epic:" + x.epic : x.project ? "project:" + x.project : "none";
      if (!byKey[k]) { byKey[k] = {key: k, rows: [], epic: x.epic ? EPIC[x.epic] || {id: x.epic, title: x.epic} : null,
                                   title: x.epic ? null : x.project ? "project " + x.project : "no epic, no project"}; order.push(k); }
      byKey[k].rows.push(x);
    });
    order.map(function (k) { return byKey[k]; }).sort(function (a, b) {
      var oa = a.rows.filter(function (x) { return !ENDED[x.state]; }).length, ob = b.rows.filter(function (x) { return !ENDED[x.state]; }).length;
      return (a.key === "none") - (b.key === "none") || (!!b.epic - !!a.epic) || ob - oa;
    }).forEach(function (g) {
      var open = g.rows.filter(function (x) { return !ENDED[x.state]; });
      var shown = G.done ? g.rows : open;
      // une epic planifiée garde son groupe (ses dates) même si ses tâches finies sont masquées ;
      // « planned » toujours présent, il faut au moins une date non nulle
      if (!shown.length && g.rows.length && !(g.epic && hasPlan(g.epic.planned))) return;
      var nLate = g.rows.filter(function (x) { return x.late && x.late.open; }).length;
      var nBlocked = g.rows.filter(function (x) { return x.state === "bloquee"; }).length;
      var nDone = g.rows.filter(function (x) { return x.state === "livree"; }).length;
      var count = [open.length + " open", nDone + " delivered", nBlocked ? nBlocked + " blocked" : "", nLate ? nLate + " late" : ""]
        .filter(Boolean).join(" · ");
      // synthèse : du premier début au dernier terme des tâches affichées
      var a = null, z = null;
      var bars = shown.map(function (x) { return planBars(x.planned, x.real, x.state === "abandonnee"); });
      if (g.epic && g.epic.planned) bars.push(planBars(g.epic.planned, g.epic.real, false));
      bars.forEach(function (parts) {
        parts.forEach(function (p) {
          var lo = p.mark ? p.at : p.a, hi = p.mark ? p.at : p.b;
          if (lo && (a === null || lo < a)) a = lo;
          if (hi && (z === null || hi > z)) z = hi;
        });
      });
      var sum = track(a !== null ? [{a: a, b: Math.max(z, a + 3600), cls: "rm-real" + (nLate ? " late" : open.length || !g.rows.length ? "" : " done")}] : []);
      var title = g.epic ? "epic " + g.epic.id + " " + (g.epic.title || "") : g.title;
      // déplié d'office seulement s'il porte une tâche en retard, ou si l'epic
      // l'est (mesh-design, n°9311) : « en cours » ne suffit pas
      var det = group(g.key, title, count, sum, nLate > 0 || !!(g.epic && g.epic.late && g.epic.late.open));
      if (g.epic && g.epic.planned) pkgRow(det, g.epic);
      shown.forEach(function (x) { taskRow(det, x); });
    });

    var commitments = (R.commitments || []).filter(function (c) { return inScope(c.project); });
    var CST = {proposed: "proposed, to validate", open: "open", done: "kept", cancelled: "cancelled"};
    if (commitments.length) {
      var gc = group("commitments", "Commitments", commitments.length + "", null, true);
      commitments.forEach(function (c) {
        var row = el("div", "rm-row"), head = el("div", "rm-label");
        head.appendChild(el("span", "lot-id", "e" + c.id));
        head.appendChild(el("span", "t", c.what));
        head.appendChild(el("span", "chip st-" + (c.fulfilled ? "done" : c.status === "proposed" ? "proposed" : "active"),
          c.fulfilled ? "kept" : CST[c.status] || c.status));
        late(head, c.late);
        row.appendChild(head);
        row.appendChild(track([{mark: true, at: dayTs(c.due) + 43200, cls: c.fulfilled ? "done" : "due", title: "due " + dm(c.due)}]));
        var det = el("div", "rm-detail", ["due " + dm(c.due), c.owner || "", c.project ? "project " + c.project : "",
          c.lot ? W().singular + " #" + c.lot : "", c.depends_on.length ? "depends on " + c.depends_on.join(", ") : ""]
          .filter(Boolean).join(" · "));
        source(det, c.source);
        row.appendChild(det); gc.appendChild(row);
      });
    }
    var expected = (R.decisions || []).filter(function (c) { return inScope(c.project); });
    if (expected.length) {
      var gd = group("decisions", "Pending decisions", expected.length + "", null, true);
      expected.forEach(function (c) {
        var row = el("div", "rm-row"), head = el("div", "rm-label");
        head.appendChild(el("span", "lot-id", c.id ? "e" + c.id : "#" + c.lot));
        head.appendChild(el("span", "t", c.what));
        if (c.status === "proposed") head.appendChild(el("span", "chip st-proposed", "proposed, to validate"));
        row.appendChild(head);
        row.appendChild(track([{mark: true, at: c.due ? dayTs(c.due) + 43200 : todayTs, cls: "decision"}]));
        var det = el("div", "rm-detail", (c.due ? "due " + dm(c.due) : "no date") + (c.owner ? " · " + c.owner : ""));
        source(det, c.source);
        row.appendChild(det); gd.appendChild(row);
      });
    }
    if (!groups.length)
      box.appendChild(el("p", "empty", tasks.length ? "Every " + W().singular + " is delivered or abandoned; tick the box above to see them."
        : "Nothing to plan: no open " + W().singular + ", no planned date, no commitment."));
    var anyClosed = groups.some(function (g) { return !g.det.open; });
    all.textContent = anyClosed ? "expand all" : "collapse all";
    all.addEventListener("click", function () {
      var to = groups.some(function (g) { return !g.det.open; });
      groups.forEach(function (g) { g.det.open = to; G.open[g.key] = to; });
      all.textContent = to ? "collapse all" : "expand all";
    });
    // zoom jour : la frise s'ouvre sur aujourd'hui
    if (G.zoom === "day" && scroller.clientWidth)
      scroller.scrollLeft = Math.max(0, inner.scrollWidth * px(todayTs) / 100 - scroller.clientWidth / 2);
  }

  if (MODE === "served") {
    saveHash();  // ôte #t= de l'URL
    if (!TOKEN) { status.textContent = "token missing: open the URL printed by ameesh progress --serve"; status.className = "warn"; return; }
    refresh();
    return;
  }
  if (!D || D.schema !== "ameesh-progress/1") {
    document.getElementById("asof").textContent = "no data or unknown schema";
    return;
  }
  renderAll();
})();
</script>
</body>
</html>
